<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grumpy's Live Scores</title>

<style>
body{margin:0;background:#0b0f14;font-family:Arial,Helvetica,sans-serif;color:#fff}
.wrap{height:100vh;display:flex;flex-direction:column}

/* ==== MINNESOTA CARDS ==== */
.mn{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:18px 20px;flex:1}
.mnCard{background:#11161d;border-radius:20px;border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column}
.mnHeader{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:rgba(255,255,255,.05)}
.mnTitle{font:900 26px Arial}
.mnLeague{font:900 14px Arial;background:rgba(255,255,255,.1);padding:6px 10px;border-radius:999px}
.mnBody{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}

.scoreBox{display:flex;justify-content:center;align-items:center;gap:18px;font:900 48px Arial;background:rgba(255,255,255,.05);padding:14px;border-radius:16px}
.status{font:900 18px Arial}
.live{color:#ff3b3b}
.final{color:#ffd24d}

.leaders{margin-top:auto;background:rgba(255,255,255,.05);padding:12px;border-radius:14px}
.leaderRow{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.leaderLeft{display:flex;align-items:center;gap:10px}
.headshot{width:40px;height:40px;border-radius:10px;object-fit:cover}
.record{margin-top:8px;font:900 14px Arial;opacity:.8}

/* ==== TICKER ==== */
.tickerBar{height:180px;background:#0d131a;border-top:2px solid rgba(255,255,255,.1);overflow:hidden;display:flex;align-items:center}
.tickerTrack{display:flex;white-space:nowrap;animation:scroll 180s linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tickItem{display:inline-flex;align-items:center;gap:16px;padding-right:120px;font:900 60px Arial}
.tScore{font-size:70px}
.leagueHeader{font:900 50px Arial;margin:0 40px}
</style>
</head>

<body>
<div class="wrap">
  <div class="mn">
    <div class="mnCard" id="card-nhl"></div>
    <div class="mnCard" id="card-nba"></div>
    <div class="mnCard" id="card-mlb"></div>
    <div class="mnCard" id="card-nfl"></div>
  </div>

  <div class="tickerBar">
    <div class="tickerTrack">
      <div id="ticker"></div>
      <div id="tickerClone"></div>
    </div>
  </div>
</div>

<script>

/* ==============================
   CONFIG
============================== */

const WORKER = "https://grumpys-scores-api.shootscore3.workers.dev";
const PROXY = (u) => WORKER + "/proxy?url=" + encodeURIComponent(u);

/* ==============================
   ESPN ENDPOINTS (THROUGH PROXY)
============================== */

const ESPN = {
  nhlTeams: PROXY("https://site.web.api.espn.com/apis/site/v2/sports/hockey/nhl/teams"),
  nbaTeams: PROXY("https://site.web.api.espn.com/apis/site/v2/sports/basketball/nba/teams"),
  mlbTeams: PROXY("https://site.web.api.espn.com/apis/site/v2/sports/baseball/mlb/teams"),
  nflTeams: PROXY("https://site.web.api.espn.com/apis/site/v2/sports/football/nfl/teams")
};

/* ==============================
   HELPERS
============================== */

const esc = (s)=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function toCentral(iso){
  return new Date(iso).toLocaleString("en-US",{timeZone:"America/Chicago",hour:"numeric",minute:"2-digit",hour12:true})+" CT";
}

/* ==============================
   LOAD TEAM DATA (logos, record)
============================== */

async function loadTeams(url){
  const r = await fetch(url);
  const j = await r.json();
  const teams = j.sports[0].leagues[0].teams;
  const map={};
  teams.forEach(t=>{
    const team=t.team;
    map[team.abbreviation.toUpperCase()] = {
      id:team.id,
      logo:team.logos?.[0]?.href,
      record:team.record?.items?.[0]?.summary || ""
    };
  });
  return map;
}

/* ==============================
   LOAD LEADERS
============================== */

async function loadLeaders(sport,id){
  const url = PROXY(`https://site.web.api.espn.com/apis/site/v2/sports/${sport}/teams/${id}/leaders`);
  const r = await fetch(url);
  const j = await r.json();
  const cats=j.categories||[];
  return cats.slice(0,3).map(c=>{
    const leader=c.leaders?.[0];
    if(!leader) return null;
    const athlete=leader.athlete||{};
    return{
      label:c.displayName,
      name:athlete.displayName,
      value:leader.displayValue,
      headshot:athlete.headshot?.href
    };
  }).filter(Boolean);
}

/* ==============================
   BUILD CARD
============================== */

async function buildCard(el,title,leagueLabel,sportKey,teamsMap){
  const team=teamsMap["MIN"];
  if(!team){ el.innerHTML="Error loading team"; return; }

  const leaders=await loadLeaders(sportKey,team.id);

  let leadersHTML=leaders.map(l=>`
    <div class="leaderRow">
      <div class="leaderLeft">
        ${l.headshot?`<img class="headshot" src="${l.headshot}">`:``}
        <div>${esc(l.label)} - ${esc(l.name)}</div>
      </div>
      <div>${esc(l.value)}</div>
    </div>
  `).join("");

  el.innerHTML=`
    <div class="mnHeader">
      <div class="mnTitle">${title}</div>
      <div class="mnLeague">${leagueLabel}</div>
    </div>
    <div class="mnBody">
      <div>No game today</div>
      <div class="leaders">
        ${leadersHTML}
        <div class="record">Record: ${team.record||"—"}</div>
      </div>
    </div>
  `;
}

/* ==============================
   INIT
============================== */

(async()=>{
  const nhl=await loadTeams(ESPN.nhlTeams);
  const nba=await loadTeams(ESPN.nbaTeams);
  const mlb=await loadTeams(ESPN.mlbTeams);
  const nfl=await loadTeams(ESPN.nflTeams);

  await buildCard(document.getElementById("card-nhl"),"Minnesota Wild","NHL","hockey/nhl",nhl);
  await buildCard(document.getElementById("card-nba"),"Minnesota Timberwolves","NBA","basketball/nba",nba);
  await buildCard(document.getElementById("card-mlb"),"Minnesota Twins","MLB","baseball/mlb",mlb);
  await buildCard(document.getElementById("card-nfl"),"Minnesota Vikings","NFL","football/nfl",nfl);
})();
</script>
</body>
</html>
