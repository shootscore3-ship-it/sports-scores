<script>
    const workerUrl = "https://grumpys-scores-api.shootscore3.workers.dev/?url=";
    const TEAMS = [
        { id: "30", sport: "hockey", league: "nhl", name: "Wild" },
        { id: "16", sport: "basketball", league: "nba", name: "Wolves" },
        { id: "9", sport: "baseball", league: "mlb", name: "Twins" },
        { id: "16", sport: "football", league: "nfl", name: "Vikings" }
    ];

    async function fetchJson(url) {
        try {
            const response = await fetch(workerUrl + encodeURIComponent(url));
            return await response.json();
        } catch (e) { return null; }
    }

    async function getTeamData(team) {
        // We call TWO endpoints now: Summary and the V3 Stats endpoint
        const [scoreboard, summary, stats] = await Promise.all([
            fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/scoreboard`),
            fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/teams/${team.id}`),
            fetchJson(`https://site.web.api.espn.com/apis/site/v3/sports/${team.sport}/${team.league}/teams/${team.id}/statistics`)
        ]);
        
        const t = summary?.team;
        let record = t?.record?.items?.[0]?.summary || "0-0";
        let logo = t?.logo || `https://a.espncdn.com/i/teamlogos/${team.league}/500/${team.id}.png`;
        
        // --- IMPROVED STAT FINDER ---
        let sLabel = "Season Record";
        let sVal = record;

        // Look for Season Leaders in the V3 Stats or V2 Summary
        const leaders = stats?.results || t?.leaders;
        if (leaders && leaders[0]) {
            // This path finds Kaprizov/Edwards specifically
            const cat = leaders[0]; // Usually Points or PPG
            const leader = cat.leaders ? cat.leaders[0] : cat;
            const name = leader.athlete ? leader.athlete.shortName : "Team";
            sLabel = `${name} (${cat.displayName || 'Leader'})`;
            sVal = leader.displayValue || "Active";
        }

        let game = scoreboard?.events?.find(e => e.competitions[0].competitors.some(c => c.team.id === team.id));
        
        if (game) {
            const comp = game.competitions[0];
            const me = comp.competitors.find(c => c.team.id === team.id);
            const opp = comp.competitors.find(c => c.team.id !== team.id);
            return { status: game.status.type.state, detail: game.status.type.shortDetail, myScore: me.score, oppScore: opp.score, logo, record, sLabel, sVal };
        } else {
            const next = t?.nextEvent?.[0];
            return { status: 'none', record, logo, sLabel, sVal, nextOpponent: next?.shortName || "TBD", nextTime: next?.date ? new Date(next.date).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : "TBD" };
        }
    }

    async function updateDashboard() {
        const container = document.getElementById('cards-container');
        const results = await Promise.all(TEAMS.map(team => getTeamData(team)));
        container.innerHTML = ''; 
        results.forEach((data, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="status-badge status-${data.status}">${data.status === 'in' ? 'LIVE' : (data.status === 'post' ? 'FINAL' : 'OFF DAY')}</div>
                <img class="team-logo" src="${data.logo}">
                <div><div style="font-size:32px; font-weight:900;">${TEAMS[index].name}</div><div style="color:#888;">${data.record}</div></div>
                <div class="stat-box">
                    <div class="stat-label">${data.sLabel}</div>
                    <div class="stat-value">${data.sVal}</div>
                </div>
                ${data.status !== 'none' ? `<div style="font-size:56px; font-weight:900;">${data.myScore}-${data.oppScore}</div><div>${data.detail}</div>` : `<div><div style="color:#444; font-size:12px; font-weight:900;">NEXT</div><div style="font-size:24px; font-weight:900;">${data.nextOpponent}</div><div>${data.nextTime}</div></div>`}`;
            container.appendChild(card);
        });
    }

    async function updateTicker() {
        const leagues = [{l:'nhl', s:'hockey'}, {l:'nba', s:'basketball'}, {l:'mlb', s:'baseball'}];
        const ticker = document.getElementById('ticker-content');
        let allItems = [];
        for (const league of leagues) {
            const data = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${league.s}/${league.l}/scoreboard`);
            data?.events?.forEach(game => {
                const comp = game.competitions[0];
                const away = comp.competitors[1], home = comp.competitors[0];
                const state = game.status.type.state;
                allItems.push(`
                    <div class="ticker-item">
                        <div class="league-badge">${league.l.toUpperCase()}</div>
                        <div class="ticker-logo-container"><img class="ticker-team-logo" src="${away.team.logo}"></div>
                        <span>${away.team.abbreviation} ${away.score || ''} @ ${home.team.abbreviation} ${home.score || ''}</span>
                        <span style="margin-left:30px; color:#555">${game.status.type.shortDetail}</span>
                    </div>
                `);
            });
        }
        ticker.innerHTML = [...allItems, ...allItems].join('');
    }

    updateDashboard(); updateTicker();
    setInterval(updateDashboard, 60000); setInterval(updateTicker, 300000);
</script>
