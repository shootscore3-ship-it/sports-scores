<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Scores</title>

  <style>
    body { margin:0; background:#0b0d10; font-family: Arial, Helvetica, sans-serif; }
    .wrap { height:100vh; display:flex; flex-direction:column; }

    .mn {
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:16px;
      padding:20px;
      box-sizing:border-box;
      flex:1;
    }

    .card {
      background:#12161c;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 0 20px rgba(0,0,0,0.5);
    }

    .tickerWrap {
      height:110px;
      background:#07090c;
      border-top:2px solid rgba(255,255,255,.1);
      overflow:hidden;
    }

    iframe { width:100%; height:100%; border:0; }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- 4 static boards -->
    <div class="mn">
      <div class="card"><iframe src="https://scorestream.com/widgets/scoreboards/vert?userWidgetId=68173"></iframe></div>
      <div class="card"><iframe src="https://scorestream.com/widgets/scoreboards/vert?userWidgetId=68174"></iframe></div>
      <div class="card"><iframe src="https://scorestream.com/widgets/scoreboards/vert?userWidgetId=68175"></iframe></div>
      <div class="card"><iframe src="https://scorestream.com/widgets/scoreboards/vert?userWidgetId=68177"></iframe></div>
    </div>

    <!-- "Ticker" (auto-advancing by reload) -->
    <div class="tickerWrap">
      <iframe id="tickerFrame" src=""></iframe>
    </div>

  </div>

  <script>
    // ScoreStream horizontal widget (manual arrows). We "auto-advance" by reloading it.
    const base = "https://scorestream.com/widgets/scoreboards/horz?userWidgetId=68178";
    const frame = document.getElementById("tickerFrame");

    function loadTicker() {
      // cache-bust forces reload so it rotates/updates
      frame.src = base + "&t=" + Date.now();
    }

    loadTicker();
    // Adjust speed here: 8000–12000 is usually perfect on bar TVs
    setInterval(loadTicker, 10000);
  </script>
</body>
</html>
