<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grumpy's Live Scores</title>

<style>
  body{
    margin:0;
    background:#0b0f14;
    font-family: Arial, Helvetica, sans-serif;
    color:#fff;
  }
  .wrap{
    height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ===== TOP: Minnesota cards (BIGGER content now) ===== */
  .mn{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:18px;
    padding:18px 20px 14px;
    box-sizing:border-box;
    flex:1;
    min-height:0;
  }
  .mnCard{
    background:#11161d;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.10);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .mnHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px;                 /* bigger header */
    background:rgba(255,255,255,.06);
    border-bottom:1px solid rgba(255,255,255,.10);
  }
  .mnTitle{
    font:900 28px/1.1 Arial;           /* bigger title */
    letter-spacing:.6px;
  }
  .mnLeaguePill{
    font:900 16px/1 Arial;             /* bigger pill */
    opacity:.9;
    padding:9px 12px;
    border-radius:999px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.16);
  }

  .mnBody{
    padding:18px;                      /* more padding */
    display:flex;
    flex-direction:column;
    gap:16px;
    flex:1;
    justify-content:center;
  }

  /* No overlap layout */
  .matchGrid{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    gap:18px;
  }

  .side{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:0;
  }
  .side.right{ justify-content:flex-end; }

  .abbr{
    font-weight:900;
    font-size:28px;                    /* bigger */
    letter-spacing:.6px;
    white-space:nowrap;
  }
  .name{
    font-weight:900;
    font-size:20px;                    /* bigger */
    opacity:.82;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:220px;                   /* more room */
  }

  /* Logo badge */
  .logo{
    width:56px;                        /* bigger */
    height:56px;
    object-fit:contain;
    border-radius:14px;
    background:rgba(255,255,255,.22);
    border:1px solid rgba(255,255,255,.28);
    padding:7px;
    box-shadow:0 3px 14px rgba(0,0,0,.60);
    box-sizing:border-box;
    flex:0 0 auto;
  }

  .scoreBox{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 18px;                 /* bigger */
    border-radius:18px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.10);
  }
  .scoreBig{
    font:900 46px/1 Arial;             /* bigger */
    letter-spacing:.5px;
  }
  .dash{
    font:900 38px/1 Arial;
    opacity:.75;
    padding:0 4px;
  }

  .statusLine{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .pill{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:10px 16px;
    border-radius:999px;
    font:900 20px/1 Arial;             /* bigger */
    letter-spacing:.3px;
  }
  .pillLive{
    background:rgba(255,0,0,.20);
    border:1px solid rgba(255,0,0,.45);
  }
  .liveDot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#ff2b2b;
    box-shadow:0 0 14px rgba(255,43,43,.95);
  }
  .pillFinal{
    background:rgba(255,205,0,.22);
    border:1px solid rgba(255,205,0,.45);
    color:#ffd24d;
  }
  .pillTime{
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.22);
  }
  .detailText{
    font:900 20px/1.2 Arial;           /* bigger */
    opacity:.85;
  }
  .mutedBig{
    font:900 28px/1.2 Arial;           /* bigger "No game today" */
    opacity:.88;
  }

  /* ===== BOTTOM: Ticker (EVEN BIGGER) ===== */
  .tickerBar{
    height:220px;                      /* bigger */
    background:#0d131a;
    border-top:2px solid rgba(255,255,255,.15);
    overflow:hidden;
    display:flex;
    align-items:center;
  }
  .tickerTrack{
    display:flex;
    white-space:nowrap;
    will-change:transform;
    animation:tickerScroll 190s linear infinite;
  }
  @keyframes tickerScroll{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }
  .lane{ display:flex; align-items:center; }

  .leagueHeader{
    display:inline-flex;
    align-items:center;
    padding:20px 32px;
    margin-right:40px;
    border-radius:999px;
    background:rgba(255,255,255,.14);
    font:900 64px/1 Arial;            /* bigger */
    letter-spacing:1px;
  }

  .tickItem{
    display:inline-flex;
    align-items:center;
    gap:26px;
    padding-right:140px;
    font:900 84px/1 Arial;            /* bigger */
  }

  .tScore{
    font-weight:900;
    font-size:92px;
  }
  .sepDot{
    opacity:.7;
    margin:0 20px;
    font-weight:900;
    font-size:82px;
  }

  .tlogo{
    width:76px;                       /* bigger */
    height:76px;
    object-fit:contain;
    border-radius:16px;
    background:rgba(255,255,255,.22);
    border:1px solid rgba(255,255,255,.28);
    padding:8px;
    box-shadow:0 3px 14px rgba(0,0,0,.60);
    box-sizing:border-box;
  }

  .meta{
    display:inline-flex;
    align-items:center;
    gap:22px;
    margin-left:44px;
    font:900 44px/1 Arial;            /* bigger */
  }
  .timeTag{
    padding:14px 26px;
    border-radius:999px;
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.25);
  }
  .statusText{ opacity:.85; }
  .liveTag{
    display:inline-flex;
    align-items:center;
    gap:12px;
    padding:14px 22px;
    border-radius:999px;
    background:rgba(255,0,0,.20);
    border:1px solid rgba(255,0,0,.45);
  }
  .finalTag{
    padding:14px 22px;
    border-radius:999px;
    background:rgba(255,205,0,.22);
    border:1px solid rgba(255,205,0,.45);
    color:#ffd24d;
  }
  .divider{
    display:inline-block;
    width:4px;
    height:104px;
    background:rgba(255,255,255,.2);
    margin:0 44px;
    border-radius:2px;
  }
</style>
</head>

<body>
<div class="wrap">

  <!-- Minnesota cards -->
  <div class="mn">
    <div class="mnCard" id="card-nhl"></div>
    <div class="mnCard" id="card-nba"></div>
    <div class="mnCard" id="card-mlb"></div>
    <div class="mnCard" id="card-nfl"></div>
  </div>

  <!-- Ticker -->
  <div class="tickerBar">
    <div class="tickerTrack">
      <span class="lane" id="lane1"></span>
      <span class="lane" id="lane2"></span>
    </div>
  </div>

</div>

<script>
  const WORKER_URL = "https://grumpys-scores-api.shootscore3.workers.dev/scores";

  const ESPN_TEAMS = {
    nhl:"https://site.web.api.espn.com/apis/site/v2/sports/hockey/nhl/teams",
    nba:"https://site.web.api.espn.com/apis/site/v2/sports/basketball/nba/teams",
    mlb:"https://site.web.api.espn.com/apis/site/v2/sports/baseball/mlb/teams",
    nfl:"https://site.web.api.espn.com/apis/site/v2/sports/football/nfl/teams"
  };
  const logoMap = { nhl:{}, nba:{}, mlb:{}, nfl:{} };

  function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}

  function toCTDateYYYYMMDD(d=new Date()){
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone:"America/Chicago", year:"numeric", month:"2-digit", day:"2-digit"
    }).formatToParts(d);
    const y = parts.find(p=>p.type==="year").value;
    const m = parts.find(p=>p.type==="month").value;
    const da = parts.find(p=>p.type==="day").value;
    return `${y}-${m}-${da}`;
  }

  function addDaysCT(dateObj, days){
    return new Date(dateObj.getTime() + days*86400000);
  }

  function toCentral12h(iso){
    try{
      const d = new Date(iso);
      const ct = d.toLocaleString("en-US", {
        timeZone:"America/Chicago",
        hour:"numeric", minute:"2-digit", hour12:true
      });
      return `${ct} CT`;
    }catch(e){ return ""; }
  }

  async function loadEspnLogos(league){
    try{
      const r = await fetch(ESPN_TEAMS[league]);
      if(!r.ok) throw new Error("teams " + r.status);
      const j = await r.json();
      const teams = j?.sports?.[0]?.leagues?.[0]?.teams || [];
      for(const entry of teams){
        const t = entry?.team;
        const abbr = (t?.abbreviation || "").toUpperCase();
        const logo = t?.logos?.[0]?.href || t?.logo || "";
        if(abbr && logo) logoMap[league][abbr] = logo;
      }
    } catch(e){
      console.log("Logo fetch failed for", league, e);
    }
  }

  function logoHTML(league, abbr, cls){
    const A = (abbr||"").toUpperCase();
    const url = logoMap?.[league]?.[A];
    if(!url) return "";
    return `<img class="${cls}" src="${esc(url)}" alt="${esc(A)}" loading="lazy" referrerpolicy="no-referrer"
             onerror="this.style.display='none'">`;
  }

  function isTeamInGame(g, abbr){
    const A = (abbr||"").toUpperCase();
    return (g?.home?.abbr || "").toUpperCase() === A || (g?.away?.abbr || "").toUpperCase() === A;
  }

  function findGameForTeam(games, teamAbbr){
    return (games || []).find(g => isTeamInGame(g, teamAbbr));
  }

  async function findNextGame(leagueKey, teamAbbr, maxDays=14){
    const now = new Date();
    for(let i=1; i<=maxDays; i++){
      const d = addDaysCT(now, i);
      const dateStr = toCTDateYYYYMMDD(d);
      const r = await fetch(WORKER_URL + "?date=" + encodeURIComponent(dateStr) + "&t=" + Date.now());
      if(!r.ok) continue;
      const j = await r.json();
      const games = j?.[leagueKey]?.games || [];
      const g = findGameForTeam(games, teamAbbr);
      if(g) return g;
    }
    return null;
  }

  function buildMnCardShell(title, leagueLabel){
    return `
      <div class="mnHeader">
        <div class="mnTitle">${esc(title)}</div>
        <div class="mnLeaguePill">${esc(leagueLabel)}</div>
      </div>
      <div class="mnBody">
        <div class="mutedBig">Loading…</div>
      </div>
    `;
  }

  function renderMnGame(leagueKey, title, leagueLabel, game){
    const away = (game.away?.abbr || "").toUpperCase();
    const home = (game.home?.abbr || "").toUpperCase();
    const awayScore = (game.away?.score ?? "").toString();
    const homeScore = (game.home?.score ?? "").toString();

    const state = (game.statusState || "").toLowerCase(); // pre/in/post
    const detail = game.shortDetail || game.statusDetail || "";
    const start = game.startTime || "";

    let statusHTML = "";
    if(state === "in"){
      statusHTML = `
        <span class="pill pillLive"><span class="liveDot"></span>LIVE</span>
        <span class="detailText">${esc(detail)}</span>
      `;
    } else if(state === "post"){
      statusHTML = `<span class="pill pillFinal">FINAL</span>`;
    } else {
      const t = start ? toCentral12h(start) : "";
      statusHTML = t
        ? `<span class="pill pillTime">${esc(t)}</span>`
        : `<span class="detailText">${esc(detail)}</span>`;
    }

    return `
      <div class="mnHeader">
        <div class="mnTitle">${esc(title)}</div>
        <div class="mnLeaguePill">${esc(leagueLabel)}</div>
      </div>

      <div class="mnBody">
        <div class="matchGrid">
          <div class="side">
            ${logoHTML(leagueKey, away, "logo")}
            <div style="min-width:0;">
              <div class="abbr">${esc(away)}</div>
              <div class="name">${esc(away)}</div>
            </div>
          </div>

          <div class="scoreBox">
            <div class="scoreBig">${esc(awayScore)}</div>
            <div class="dash">–</div>
            <div class="scoreBig">${esc(homeScore)}</div>
          </div>

          <div class="side right">
            <div style="min-width:0; text-align:right;">
              <div class="abbr">${esc(home)}</div>
              <div class="name" style="margin-left:auto;">${esc(home)}</div>
            </div>
            ${logoHTML(leagueKey, home, "logo")}
          </div>
        </div>

        <div class="statusLine">
          ${statusHTML}
        </div>
      </div>
    `;
  }

  function renderMnNoGame(leagueKey, title, leagueLabel, nextGame){
    let nextLine = `<div class="mutedBig">No game today</div>`;
    if(nextGame){
      const away = (nextGame.away?.abbr || "").toUpperCase();
      const home = (nextGame.home?.abbr || "").toUpperCase();
      const when = nextGame.startTime ? toCentral12h(nextGame.startTime) : "";
      nextLine = `
        <div class="mutedBig">No game today</div>
        <div class="detailText" style="font-size:22px;">
          Next: ${esc(away)} @ ${esc(home)}${when ? " • " + esc(when) : ""}
        </div>
      `;
    }

    return `
      <div class="mnHeader">
        <div class="mnTitle">${esc(title)}</div>
        <div class="mnLeaguePill">${esc(leagueLabel)}</div>
      </div>
      <div class="mnBody">
        ${nextLine}
      </div>
    `;
  }

  function setTickerHTML(html){
    document.getElementById("lane1").innerHTML = html;
    document.getElementById("lane2").innerHTML = html;
  }

  function tickerTeamHTML(leagueKey, abbr){
    const A = (abbr||"").toUpperCase();
    const url = logoMap?.[leagueKey]?.[A];
    if(!url) return `<span class="abbr">${esc(A)}</span>`;
    return `${logoHTML(leagueKey, A, "tlogo")}<span class="abbr">${esc(A)}</span>`;
  }

  function formatTickerGame(leagueKey, g){
    const away = (g.away?.abbr || "").toUpperCase();
    const home = (g.home?.abbr || "").toUpperCase();
    const awayScore = (g.away?.score ?? "").toString();
    const homeScore = (g.home?.score ?? "").toString();

    const state = (g.statusState || "").toLowerCase();
    const detail = g.shortDetail || g.statusDetail || "";
    const start  = g.startTime || "";

    let metaHTML = "";
    if(state === "pre"){
      const t = start ? toCentral12h(start) : "";
      metaHTML = t ? `<span class="meta"><span class="timeTag">${esc(t)}</span></span>`
                   : `<span class="meta"><span class="statusText">${esc(detail)}</span></span>`;
    } else if(state === "post"){
      metaHTML = `<span class="meta"><span class="finalTag">FINAL</span></span>`;
    } else if(state === "in"){
      metaHTML = `<span class="meta"><span class="liveTag"><span class="liveDot"></span>LIVE</span><span class="statusText">${esc(detail)}</span></span>`;
    } else if(detail){
      metaHTML = `<span class="meta"><span class="statusText">${esc(detail)}</span></span>`;
    }

    return `
      <span class="tickItem">
        ${tickerTeamHTML(leagueKey, away)}
        <span class="tScore">${esc(awayScore)}</span>
        <span class="sepDot">•</span>
        <span class="tScore">${esc(homeScore)}</span>
        ${tickerTeamHTML(leagueKey, home)}
        ${metaHTML}
      </span>
    `;
  }

  function leagueSection(leagueKey, label, games){
    if(!games || !games.length) return "";
    return `<span class="leagueHeader">${esc(label)}</span>` +
           games.map(g => formatTickerGame(leagueKey, g)).join("") +
           `<span class="divider"></span>`;
  }

  async function refreshAll(){
    const dateCT = toCTDateYYYYMMDD(new Date());
    const r = await fetch(WORKER_URL + "?date=" + encodeURIComponent(dateCT) + "&t=" + Date.now());
    if(!r.ok) throw new Error("Worker HTTP " + r.status);
    const j = await r.json();

    const nhl = j.nhl?.games || [];
    const nba = j.nba?.games || [];
    const mlb = j.mlb?.games || [];
    const nfl = j.nfl?.games || [];

    const configs = [
      { key:"nhl", title:"Minnesota Wild", league:"NHL", games:nhl, team:"MIN" },
      { key:"nba", title:"Minnesota Timberwolves", league:"NBA", games:nba, team:"MIN" },
      { key:"mlb", title:"Minnesota Twins", league:"MLB", games:mlb, team:"MIN" },
      { key:"nfl", title:"Minnesota Vikings", league:"NFL", games:nfl, team:"MIN" },
    ];

    // shells
    for(const c of configs){
      const el = document.getElementById(`card-${c.key}`);
      if(el) el.innerHTML = buildMnCardShell(c.title, c.league);
    }

    // render
    for(const c of configs){
      const el = document.getElementById(`card-${c.key}`);
      if(!el) continue;

      const todayGame = findGameForTeam(c.games, c.team);
      if(todayGame){
        el.innerHTML = renderMnGame(c.key, c.title, c.league, todayGame);
      }else{
        const next = await findNextGame(c.key, c.team, 14);
        el.innerHTML = renderMnNoGame(c.key, c.title, c.league, next);
      }
    }

    // ticker
    let html = "";
    html += leagueSection("nhl","NHL", nhl);
    html += leagueSection("nba","NBA", nba);
    html += leagueSection("mlb","MLB", mlb);
    html += leagueSection("nfl","NFL", nfl);
    setTickerHTML(html || `<span class="tickItem">No games today</span>`);
  }

  (async () => {
    setTickerHTML(`<span class="tickItem">Loading scores...</span>`);

    await Promise.all([
      loadEspnLogos("nhl"),
      loadEspnLogos("nba"),
      loadEspnLogos("mlb"),
      loadEspnLogos("nfl"),
    ]);

    try{
      await refreshAll();
    }catch(e){
      console.log(e);
      setTickerHTML(`<span class="tickItem">Ticker error (worker).</span>`);
    }

    setInterval(() => refreshAll().catch(console.log), 30000);
  })();
</script>
</body>
</html>
