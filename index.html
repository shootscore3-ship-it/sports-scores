<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MN Sports Center - Fixed Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505; --card-bg: #111111; --text: #ffffff;
            --live: #ff3b3b; --final-gold: #D4AF37; --theme-color: #222;
        }

        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Inter', sans-serif; width: 100vw; height: 100vh;
            overflow: hidden; display: flex; flex-direction: column;
        }

        .dashboard {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;
            padding: 15px; flex: 1; box-sizing: border-box;
            align-items: stretch; /* Prevents squishing to the top */
        }

        .card {
            background: var(--card-bg); border-radius: 20px; padding: 20px;
            display: flex; flex-direction: column; 
            justify-content: space-between; /* Spreads content from top to bottom */
            align-items: center; border: 2px solid var(--theme-color);
            position: relative; transition: all 0.5s ease;
        }

        .rank-badge {
            position: absolute; top: 15px; right: 15px;
            background: rgba(212, 175, 55, 0.15); color: var(--final-gold);
            padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 900;
            border: 1px solid rgba(212, 175, 55, 0.4);
        }

        .team-logo { width: 95px; height: 95px; object-fit: contain; margin-bottom: 5px; }
        
        .player-row {
            display: flex; align-items: center; background: rgba(255,255,255,0.05);
            border-radius: 12px; padding: 10px; width: 100%; box-sizing: border-box;
            border-left: 4px solid var(--theme-color); margin: 10px 0;
        }
        .headshot { width: 55px; height: 55px; border-radius: 50%; background: #222; margin-right: 12px; border: 1px solid #444; }
        .stat-name { font-size: 13px; font-weight: 900; color: var(--final-gold); }
        .stat-vals { font-size: 11px; color: #bbb; }

        .vs-container { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; }
        .score-text { font-size: 44px; font-weight: 900; }
        .opp-logo { width: 45px; height: 45px; object-fit: contain; }

        .ticker-wrap { background: #000; height: 215px; border-top: 5px solid var(--theme-color); display: flex; align-items: center; overflow: hidden; }
        .ticker-move { display: flex; white-space: nowrap; animation: ticker-scroll 110s linear infinite; }
        .ticker-item { display: flex; align-items: center; background: #151515; margin: 0 35px; padding: 0 45px; border-radius: 20px; font-size: 72px; font-weight: 900; height: 165px; }
        .ticker-logo { width: 110px; height: 110px; object-fit: contain; margin: 0 15px; }

        @keyframes ticker-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    </style>
</head>
<body>
    <div class="dashboard" id="cards-container"></div>
    <div class="ticker-wrap"><div class="ticker-move" id="ticker-content"></div></div>

    <script>
        const worker = "https://grumpys-scores-api.shootscore3.workers.dev/?url=";
        const TEAMS = [
            { id: "30", sport: "hockey", league: "nhl", name: "Wild", color: "#154734", athleteId: "3043233", pName: "K. Kaprizov", pStats: "32G, 38A" },
            { id: "16", sport: "basketball", league: "nba", name: "Wolves", color: "#0C2340", athleteId: "4431611", pName: "A. Edwards", pStats: "29.6 PPG, 5.3 RPG" },
            { id: "9", sport: "baseball", league: "mlb", name: "Twins", color: "#002B5C", athleteId: "4240362", pName: "J. Miranda", pStats: "6 RBI, .310 AVG" },
            { id: "16", sport: "football", league: "nfl", name: "Vikings", color: "#4F2683", athleteId: "4426336", pName: "J.J. McCarthy", pStats: "1632 Yds, 12 TD" }
        ];

        async function fetchJson(url) {
            try { const r = await fetch(worker + encodeURIComponent(url)); return await r.json(); } catch(e) { return null; }
        }

        async function getRank(league, teamId) {
            const leaguePath = league==='nba'?'basketball':(league==='nhl'?'hockey':(league==='mlb'?'baseball':'football'));
            const data = await fetchJson(`https://site.api.espn.com/apis/v2/sports/${leaguePath}/${league}/standings`);
            try {
                for (const group of data.children || []) {
                    let entry = group.standings?.entries?.find(e => e.team.id === teamId);
                    if (!entry && group.children) { // Some leagues have nested divisions
                        for (const child of group.children) {
                            entry = child.standings?.entries?.find(e => e.team.id === teamId);
                            if (entry) break;
                        }
                    }
                    if (entry) return `#${entry.stats.find(s=>s.name==='rank')?.displayValue || '—'}`;
                }
            } catch(e) {} return "—";
        }

        async function updateDashboard() {
            const container = document.getElementById('cards-container');
            const results = await Promise.all(TEAMS.map(async (team) => {
                const sb = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/scoreboard`);
                const details = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/teams/${team.id}`);
                const rank = await getRank(team.league, team.id);
                
                let game = sb?.events?.find(e => e.competitions[0].competitors.some(c => c.team.id === team.id));
                let oppLogo = "";
                if (game) {
                    const opp = game.competitions[0].competitors.find(c => c.team.id !== team.id);
                    oppLogo = opp.team.logo;
                    if (game.status.type.state === 'in') document.documentElement.style.setProperty('--theme-color', team.color);
                }
                return { ...team, game, rank, record: details?.team?.record?.items?.[0]?.summary || "0-0", oppLogo, logo: details?.team?.logo || `https://a.espncdn.com/i/teamlogos/${team.league}/500/${team.id}.png` };
            }));

            container.innerHTML = '';
            results.forEach(res => {
                const isLive = res.game?.status.type.state === 'in';
                const card = document.createElement('div');
                card.className = `card ${isLive ? 'active-game' : ''}`;
                card.style.setProperty('--theme-color', res.color);
                
                card.innerHTML = `
                    <div class="rank-badge">${res.rank}</div>
                    <div style="width:100%">
                        <img class="team-logo" src="${res.logo}">
                        <div style="font-size:24px; font-weight:900;">${res.name}</div>
                        <div style="color:#666; font-size:14px;">${res.record}</div>
                    </div>
                    
                    <div class="player-row">
                        <img class="headshot" src="https://a.espncdn.com/i/headshots/${res.league}/players/full/${res.athleteId}.png" onerror="this.src='https://a.espncdn.com/i/teamlogos/${res.league}/500/${res.id}.png'">
                        <div class="stat-content">
                            <div class="stat-name">${res.pName}</div>
                            <div class="stat-vals">${res.pStats}</div>
                        </div>
                    </div>

                    <div style="width:100%">
                        ${res.game ? `
                            <div class="vs-container">
                                <span class="score-text">${res.game.competitions[0].competitors.find(c => c.team.id === res.id).score}</span>
                                <img class="opp-logo" src="${res.oppLogo}">
                                <span class="score-text">${res.game.competitions[0].competitors.find(c => c.team.id !== res.id).score}</span>
                            </div>
                            <div style="font-weight:700; font-size:12px;">${res.game.status.type.shortDetail}</div>
                        ` : `<div style="font-size:12px; color:#444; font-weight:900; letter-spacing:1px;">NEXT GAME SCHEDULED</div>`}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function updateTicker() {
            const leagues = [{l:'nhl', s:'hockey'}, {l:'nba', s:'basketball'}, {l:'mlb', s:'baseball'}];
            const ticker = document.getElementById('ticker-content');
            let allItems = [];
            for (const league of leagues) {
                const data = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${league.s}/${league.l}/scoreboard`);
                data?.events?.forEach(game => {
                    const away = game.competitions[0].competitors[1], home = game.competitions[0].competitors[0];
                    allItems.push(`<div class="ticker-item"><img class="ticker-logo" src="${away.team.logo}"> ${away.team.abbreviation} ${away.score || ''} @ ${home.team.abbreviation} ${home.score || ''} <img class="ticker-logo" src="${home.team.logo}"><span style="margin-left:25px; color:#555;">${game.status.type.shortDetail}</span></div>`);
                });
            }
            ticker.innerHTML = [...allItems, ...allItems].join('');
        }

        updateDashboard(); updateTicker();
        setInterval(updateDashboard, 60000); setInterval(updateTicker, 300000);
    </script>
</body>
</html>
