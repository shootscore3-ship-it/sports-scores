<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MN Sports Center - 215px Pro Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card-bg: #111111;
            --text: #ffffff;
            --live: #ff3b3b;
            --final: #ffcc00;
            --accent: #1a1a1a;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Grid - Adjusted to make room for 215px ticker */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
            flex: 1;
            box-sizing: border-box;
            max-height: calc(100vh - 215px);
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #222;
            text-align: center;
            justify-content: space-around;
        }

        .status-badge {
            font-size: 20px;
            font-weight: 900;
            padding: 6px 18px;
            border-radius: 8px;
            text-transform: uppercase;
        }
        .status-live { background: var(--live); animation: pulse 2s infinite; }
        .status-final { color: var(--final); border: 1px solid var(--final); }
        .status-none { color: #555; border: 1px solid #333; }

        .team-logo { width: 170px; height: 170px; object-fit: contain; }
        .team-name { font-size: 32px; font-weight: 900; margin-top: 5px; }
        .record { font-size: 22px; color: #888; font-weight: bold; }

        .score-container {
            font-size: 70px;
            font-weight: 900;
            letter-spacing: -2px;
        }

        .game-info { font-size: 24px; color: #ccc; line-height: 1.2; }
        .next-label { font-size: 14px; color: #444; text-transform: uppercase; letter-spacing: 3px; }

        /* THE PERFECT 215PX TICKER */
        .ticker-wrap {
            background: #000;
            height: 215px; 
            border-top: 6px solid var(--accent);
            display: flex;
            align-items: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .ticker-move {
            display: flex;
            white-space: nowrap;
            animation: ticker-scroll 100s linear infinite;
        }

        .ticker-item {
            display: flex;
            align-items: center;
            padding: 0 90px;
            font-size: 72px; /* Balanced large font */
            font-weight: 800;
            border-right: 4px solid #111;
        }

        .ticker-item span { margin: 0 18px; }
        
        .ticker-team-logo {
            width: 100px; /* Scaled to fit 215px height comfortably */
            height: 100px;
            object-fit: contain;
            margin: 0 12px;
        }

        .ticker-live-dot { color: var(--live); margin-right: 18px; font-size: 50px; }
        .league-label { color: #333; font-size: 44px; margin-right: 30px; font-weight: 900; }

        @keyframes ticker-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        #last-updated { position: absolute; bottom: 225px; right: 25px; font-size: 12px; color: #222; }
    </style>
</head>
<body>

    <div class="dashboard" id="cards-container"></div>
    <div id="last-updated">Updating...</div>

    <div class="ticker-wrap">
        <div class="ticker-move" id="ticker-content">
            <div class="ticker-item">REFRESHING MN SPORTS FEED...</div>
        </div>
    </div>

    <script>
        const workerUrl = "https://grumpys-scores-api.shootscore3.workers.dev/?url=";

        const TEAMS = [
            { id: "30", sport: "hockey", league: "nhl", name: "Wild" },
            { id: "16", sport: "basketball", league: "nba", name: "Timberwolves" },
            { id: "9", sport: "baseball", league: "mlb", name: "Twins" },
            { id: "16", sport: "football", league: "nfl", name: "Vikings" }
        ];

        async function fetchJson(url) {
            try {
                const response = await fetch(workerUrl + encodeURIComponent(url.replace('site.web.api', 'site.api')));
                return await response.json();
            } catch (e) { return null; }
        }

        function formatTime(dateStr) {
            if (!dateStr) return "TBD";
            return new Date(dateStr).toLocaleTimeString('en-US', { 
                timeZone: 'America/Chicago', hour: 'numeric', minute: '2-digit', hour12: true 
            }) + " CT";
        }

        async function getTeamData(team) {
            const scoreboard = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/scoreboard`);
            let game = scoreboard?.events?.find(e => e.competitions[0].competitors.some(c => c.team.id === team.id));
            const teamData = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/teams/${team.id}`);
            
            let record = "0-0";
            if (teamData?.team?.record?.items?.[0]?.summary) record = teamData.team.record.items[0].summary;

            if (game) {
                const comp = game.competitions[0];
                const me = comp.competitors.find(c => c.team.id === team.id);
                const opp = comp.competitors.find(c => c.team.id !== team.id);
                return {
                    status: game.status.type.state, 
                    detail: game.status.type.shortDetail,
                    myScore: me.score || "0",
                    oppScore: opp.score || "0",
                    opponent: opp.team.shortDisplayName,
                    logo: me.team.logo,
                    record: record
                };
            } else {
                const nextEvent = teamData?.team?.nextEvent?.[0];
                return {
                    status: 'none',
                    record: record,
                    logo: `https://a.espncdn.com/i/teamlogos/${team.league}/500/${team.id}.png`,
                    nextOpponent: nextEvent?.shortName || "Check Schedule",
                    nextTime: nextEvent?.date ? formatTime(nextEvent.date) : "TBD"
                };
            }
        }

        async function updateDashboard() {
            const container = document.getElementById('cards-container');
            const teamResults = await Promise.all(TEAMS.map(team => getTeamData(team)));
            container.innerHTML = ''; 

            teamResults.forEach((data, index) => {
                const team = TEAMS[index];
                const card = document.createElement('div');
                card.className = 'card';
                let statusHtml, contentHtml;

                if (data.status === 'in') {
                    statusHtml = `<div class="status-badge status-live">LIVE</div>`;
                    contentHtml = `<div class="score-container">${data.myScore}-${data.oppScore}</div><div class="game-info">${data.detail}<br>vs ${data.opponent}</div>`;
                } else if (data.status === 'post') {
                    statusHtml = `<div class="status-badge status-final">FINAL</div>`;
                    contentHtml = `<div class="score-container">${data.myScore}-${data.oppScore}</div><div class="game-info">vs ${data.opponent}</div>`;
                } else {
                    statusHtml = `<div class="status-badge status-none">OFF DAY</div>`;
                    contentHtml = `<div><div class="next-label">Next Game</div><div class="game-info" style="font-weight:900; color:white; margin-top:8px;">${data.nextOpponent}</div><div class="game-info">${data.nextTime}</div></div>`;
                }

                card.innerHTML = `${statusHtml}<img class="team-logo" src="${data.logo}"><div><div class="team-name">${team.name}</div><div class="record">${data.record}</div></div>${contentHtml}`;
                container.appendChild(card);
            });
            document.getElementById('last-updated').innerText = "Last Sync: " + new Date().toLocaleTimeString();
        }

        async function updateTicker() {
            const leagues = [{l:'nhl', s:'hockey'}, {l:'nba', s:'basketball'}, {l:'mlb', s:'baseball'}];
            const ticker = document.getElementById('ticker-content');
            let allItems = [];

            for (const league of leagues) {
                const data = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${league.s}/${league.l}/scoreboard`);
                data?.events?.forEach(game => {
                    const comp = game.competitions[0];
                    const away = comp.competitors[1], home = comp.competitors[0];
                    const state = game.status.type.state;
                    let color = state === 'in' ? 'var(--live)' : (state === 'post' ? 'var(--final)' : '#222');
                    
                    allItems.push(`
                        <div class="ticker-item">
                            ${state === 'in' ? '<span class="ticker-live-dot">●</span>' : ''}
                            <span class="league-label">${league.l.toUpperCase()}</span>
                            <img class="ticker-team-logo" src="${away.team.logo}">
                            <span>${away.team.abbreviation} ${away.score || ''}</span>
                            <span style="color:#1a1a1a; margin:0 5px;">@</span>
                            <img class="ticker-team-logo" src="${home.team.logo}">
                            <span>${home.team.abbreviation} ${home.score || ''}</span>
                            <span style="color: ${color}; margin-left:35px; font-size:48px;">${game.status.type.shortDetail}</span>
                        </div>
                    `);
                });
            }
            if (allItems.length > 0) ticker.innerHTML = [...allItems, ...allItems].join('');
            else ticker.innerHTML = '<div class="ticker-item">MN SPORTS NETWORK - STANDBY</div>';
        }

        updateDashboard(); updateTicker();
        setInterval(updateDashboard, 60000); 
        setInterval(updateTicker, 300000);
    </script>
</body>
</html>
