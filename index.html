<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MN Sports Center - 2026 Pro Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card-bg: #111111;
            --text: #ffffff;
            --live: #ff3b3b;
            --final-gold: #D4AF37;
            --accent: #1a1a1a;
            --ticker-item-bg: #151515; 
        }

        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Inter', sans-serif; width: 100vw; height: 100vh;
            overflow: hidden; display: flex; flex-direction: column;
        }

        .dashboard {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;
            padding: 20px; flex: 1; box-sizing: border-box;
            max-height: calc(100vh - 215px);
        }

        .card {
            background: var(--card-bg); border-radius: 20px; padding: 25px;
            display: flex; flex-direction: column; align-items: center;
            border: 2px solid #222; text-align: center; justify-content: space-between;
            position: relative; overflow: hidden;
        }

        .team-logo { width: 140px; height: 140px; object-fit: contain; margin-bottom: 10px; }
        
        .status-badge { 
            font-size: 18px; font-weight: 900; padding: 6px 15px; 
            border-radius: 6px; text-transform: uppercase; margin-bottom: 10px;
        }
        .status-in { background: var(--live); animation: pulse 2s infinite; }
        .status-post { color: var(--final-gold); border: 1px solid var(--final-gold); }
        .status-none { color: #555; border: 1px solid #333; }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px; border-radius: 12px; width: 90%; margin: 15px 0;
        }
        .stat-label { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .stat-value { color: var(--final-gold); font-size: 18px; font-weight: 800; }

        .score-display { font-size: 56px; font-weight: 900; margin: 10px 0; }
        .next-game-label { color: #444; font-size: 12px; letter-spacing: 2px; font-weight: 900; }

        .ticker-wrap {
            background: #000; height: 215px; border-top: 6px solid var(--accent);
            display: flex; align-items: center; overflow: hidden;
        }
        .ticker-move { display: flex; white-space: nowrap; animation: ticker-scroll 120s linear infinite; }
        .ticker-item {
            display: flex; align-items: center; height: 175px; 
            background: var(--ticker-item-bg); margin: 0 40px; 
            padding: 0 60px; border-radius: 20px; font-size: 72px;
            font-weight: 900; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
        }

        .ticker-alert-pulse { border: 3px solid var(--live) !important; animation: alert-glow 1s infinite alternate !important; }
        @keyframes alert-glow { from { box-shadow: 0 0 10px rgba(255, 59, 59, 0.3); } to { box-shadow: 0 0 40px rgba(255, 59, 59, 0.7); } }

        .league-label-badge {
            background: rgba(255, 255, 255, 0.05); color: #888;
            font-size: 30px; font-weight: 900; padding: 8px 20px;
            border-radius: 50px; margin-right: 30px; border: 1px solid #333;
        }

        @keyframes ticker-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="dashboard" id="cards-container"></div>
    <div class="ticker-wrap"><div class="ticker-move" id="ticker-content"></div></div>

    <script>
        const workerUrl = "https://grumpys-scores-api.shootscore3.workers.dev/?url=";
        const TEAMS = [
            { id: "30", sport: "hockey", league: "nhl", name: "Wild", statLabel: "Kaprizov (PTS)", statVal: "32G, 38A (70 PTS)" },
            { id: "16", sport: "basketball", league: "nba", name: "Timberwolves", statLabel: "A. Edwards (PPG)", statVal: "29.6 PPG, 5.3 RPG" },
            { id: "9", sport: "baseball", league: "mlb", name: "Twins", statLabel: "Spring Leaders", statVal: "Miranda: 6 RBI • Rodriguez: 2 HR" },
            { id: "16", sport: "football", league: "nfl", name: "Vikings", statLabel: "Season Leaders", statVal: "McCarthy: 1632Yds • JJ: 1048Yds" }
        ];

        async function fetchJson(url) {
            try {
                const response = await fetch(workerUrl + encodeURIComponent(url.replace('site.web.api', 'site.api')));
                return await response.json();
            } catch (e) { return null; }
        }

        async function getTeamData(team) {
            const scoreboard = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/scoreboard`);
            let game = scoreboard?.events?.find(e => e.competitions[0].competitors.some(c => c.team.id === team.id));
            const teamData = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/teams/${team.id}`);
            let record = teamData?.team?.record?.items?.[0]?.summary || "0-0";
            if (game) {
                const me = game.competitions[0].competitors.find(c => c.team.id === team.id);
                const opp = game.competitions[0].competitors.find(c => c.team.id !== team.id);
                return { status: game.status.type.state, detail: game.status.type.shortDetail, myScore: me.score, oppScore: opp.score, logo: me.team.logo, record: record };
            } else {
                const next = teamData?.team?.nextEvent?.[0];
                return { status: 'none', record: record, logo: teamData?.team?.logo || `https://a.espncdn.com/i/teamlogos/${team.league}/500/${team.id}.png`, nextOpponent: next?.shortName || "Check Schedule", nextTime: next?.date ? new Date(next.date).toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}) : "TBD" };
            }
        }

        async function updateDashboard() {
            const container = document.getElementById('cards-container');
            const teamResults = await Promise.all(TEAMS.map(team => getTeamData(team)));
            container.innerHTML = ''; 
            teamResults.forEach((data, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="status-badge status-${data.status}">${data.status === 'in' ? 'LIVE' : (data.status === 'post' ? 'FINAL' : 'OFF DAY')}</div>
                    <img class="team-logo" src="${data.logo}">
                    <div><div style="font-size:32px; font-weight:900;">${TEAMS[index].name}</div><div style="color:#888;">${data.record}</div></div>
                    
                    <div class="stat-box">
                        <div class="stat-label">${TEAMS[index].statLabel}</div>
                        <div class="stat-value">${TEAMS[index].statVal}</div>
                    </div>

                    ${data.status !== 'none' ? `<div class="score-display">${data.myScore}-${data.oppScore}</div><div>${data.detail}</div>` : `<div><div class="next-game-label">NEXT</div><div style="font-weight:900; font-size:24px;">${data.nextOpponent}</div><div>${data.nextTime}</div></div>`}`;
                container.appendChild(card);
            });
        }

        async function updateTicker() {
            const leagues = [{l:'nhl', s:'hockey'}, {l:'nba', s:'basketball'}, {l:'mlb', s:'baseball'}];
            const ticker = document.getElementById('ticker-content');
            let allItems = [];

            for (const league of leagues) {
                const data = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${league.s}/${league.l}/scoreboard`);
                data?.events?.forEach(game => {
                    const comp = game.competitions[0];
                    const away = comp.competitors[1], home = comp.competitors[0];
                    const state = game.status.type.state;
                    const sit = comp.situation;
                    let alertClass = "";
                    if (state === 'in' && sit && ((league.l === 'nhl' && sit.onPowerPlay) || (league.l === 'nfl' && sit.isRedZone))) alertClass = "ticker-alert-pulse";

                    allItems.push(`
                        <div class="ticker-item ${alertClass}">
                            <div class="league-label-badge">${league.l.toUpperCase()}</div>
                            <span>${away.team.abbreviation} ${away.score || ''} @ ${home.team.abbreviation} ${home.score || ''}</span>
                            <span style="color:${state === 'post' ? 'var(--final-gold)' : (state === 'in' ? 'var(--live)' : '#888')}; margin-left:25px;">${game.status.type.shortDetail}</span>
                        </div>
                    `);
                });
            }

            const spotlights = [
                `<div class="ticker-item" style="border-left:10px solid #154734;"><div class="league-label-badge" style="background:#154734; color:white;">WILD</div><span>NHL RETURNS: at Avalanche • Tomorrow 8PM</span></div>`,
                `<div class="ticker-item" style="border-left:10px solid #0C2340;"><div class="league-label-badge" style="background:#236192; color:white;">WOLVES</div><span>LAST NIGHT: MIN 124, POR 121 • Next: at LAC</span></div>`
            ];

            let finalArr = [];
            allItems.forEach((item, i) => { finalArr.push(item); if((i+1)%3===0) finalArr.push(spotlights[i%2]); });
            ticker.innerHTML = [...finalArr, ...finalArr].join('');
        }

        updateDashboard(); updateTicker();
        setInterval(updateDashboard, 60000); 
        setInterval(updateTicker, 300000);
    </script>
</body>
</html>
