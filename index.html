<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MN Sports Center - 2026 Pro Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#050505; --card-bg:#111111; --text:#ffffff;
      --live:#ff3b3b; --final-gold:#D4AF37; --accent:#1a1a1a;
      --cols: 4;
    }

    body{
      margin:0; background:var(--bg); color:var(--text);
      font-family:'Inter',sans-serif; width:100vw; height:100vh;
      overflow:hidden; display:flex; flex-direction:column;
    }

    .dashboard{
      display:grid;
      grid-template-columns:repeat(var(--cols), 1fr);
      gap:20px;
      padding:20px;
      flex:1;
      box-sizing:border-box;
      max-height:calc(100vh - 215px);
    }

    .card{
      background:var(--card-bg); border-radius:20px; padding:25px;
      display:flex; flex-direction:column; align-items:center;
      border:2px solid #222; text-align:center; justify-content:space-between;
    }

    /* =========================
       BASE SIZES (4 cards)
       ========================= */
    .team-logo{ width:185px; height:185px; object-fit:contain; }
    .name-text{ font-size:32px; font-weight:900; }
    .record-text{ color:#888; }
    .opp-logo{ width:88px; height:88px; object-fit:contain; }
    .opp-text{ font-size:44px; font-weight:900; line-height:1; }

    .status-badge{ font-size:18px; font-weight:900; padding:6px 15px; border-radius:6px; }
    .standings-line{ margin-top:6px; font-size:14px; font-weight:800; color:#9a9a9a; letter-spacing:0.2px; }
    .countdown{ font-size:16px; font-weight:900; }
    .next-time{ font-size:18px; font-weight:800; }

    .score-logo{ width:54px; height:54px; object-fit:contain; }
    .score-num{ font-size:64px; font-weight:900; line-height:1; }
    .score-dash{ font-size:64px; font-weight:900; line-height:1; color:#666; }
    .game-pill{ font-size:16px; font-weight:900; }

    /* =========================
       Stats block (Wild/Wolves)
       ========================= */
    .stats-block{
      margin-top:12px;
      width:100%;
      padding:12px 14px;
      border-radius:18px;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.10);
      display:flex;
      flex-direction:column;
      gap:8px;
      box-sizing:border-box;
    }
    .stat-line{
      font-size:14px;
      font-weight:900;
      letter-spacing:0.6px;
      text-transform:uppercase;
      color:rgba(255,255,255,0.80);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .stat-key{ color:rgba(255,255,255,0.55); margin-right:10px; }

    /* =========================
       ✅ BIGGER WHEN COLLAPSED
       ========================= */

    /* 3 cards: big */
    body[data-cols="3"] .team-logo{ width:255px; height:255px; }
    body[data-cols="3"] .name-text{ font-size:46px; }
    body[data-cols="3"] .standings-line{ font-size:17px; }
    body[data-cols="3"] .opp-logo{ width:124px; height:124px; }
    body[data-cols="3"] .opp-text{ font-size:68px; }
    body[data-cols="3"] .status-badge{ font-size:20px; padding:7px 16px; }

    body[data-cols="3"] .score-logo{ width:66px; height:66px; }
    body[data-cols="3"] .score-num{ font-size:82px; }
    body[data-cols="3"] .score-dash{ font-size:82px; }
    body[data-cols="3"] .game-pill{ font-size:18px; }
    body[data-cols="3"] .countdown{ font-size:18px; padding:7px 14px; }
    body[data-cols="3"] .next-time{ font-size:20px; }

    body[data-cols="3"] .stats-block{ padding:14px 16px; border-radius:20px; }
    body[data-cols="3"] .stat-line{ font-size:16px; }

    /* 2 cards: HUGE broadcast look */
    body[data-cols="2"] .team-logo{ width:340px; height:340px; }
    body[data-cols="2"] .name-text{ font-size:62px; }
    body[data-cols="2"] .record-text{ font-size:20px; }
    body[data-cols="2"] .standings-line{ font-size:22px; }
    body[data-cols="2"] .opp-logo{ width:170px; height:170px; }
    body[data-cols="2"] .opp-text{ font-size:96px; }
    body[data-cols="2"] .status-badge{ font-size:26px; padding:10px 22px; }

    body[data-cols="2"] .score-team{ padding:18px 22px; border-radius:18px; }
    body[data-cols="2"] .score-logo{ width:92px; height:92px; }
    body[data-cols="2"] .score-num{ font-size:120px; }
    body[data-cols="2"] .score-dash{ font-size:120px; margin:0 6px; }
    body[data-cols="2"] .game-pill{ font-size:24px; padding:12px 18px; }
    body[data-cols="2"] .countdown{ font-size:24px; padding:10px 18px; }
    body[data-cols="2"] .next-time{ font-size:28px; }

    body[data-cols="2"] .stats-block{ padding:18px 20px; border-radius:24px; gap:10px; }
    body[data-cols="2"] .stat-line{ font-size:20px; }

    /* 1 card: MAX broadcast look */
    body[data-cols="1"] .team-logo{ width:430px; height:430px; }
    body[data-cols="1"] .name-text{ font-size:84px; }
    body[data-cols="1"] .record-text{ font-size:26px; }
    body[data-cols="1"] .standings-line{ font-size:26px; }
    body[data-cols="1"] .opp-logo{ width:220px; height:220px; }
    body[data-cols="1"] .opp-text{ font-size:128px; }
    body[data-cols="1"] .status-badge{ font-size:34px; padding:12px 28px; border-radius:10px; }

    body[data-cols="1"] .score-team{ padding:22px 28px; border-radius:22px; }
    body[data-cols="1"] .score-logo{ width:120px; height:120px; }
    body[data-cols="1"] .score-num{ font-size:160px; }
    body[data-cols="1"] .score-dash{ font-size:160px; margin:0 10px; }
    body[data-cols="1"] .game-pill{ font-size:30px; padding:14px 22px; }
    body[data-cols="1"] .countdown{ font-size:30px; padding:12px 22px; }
    body[data-cols="1"] .next-time{ font-size:34px; }

    body[data-cols="1"] .stats-block{ padding:22px 24px; border-radius:28px; gap:12px; }
    body[data-cols="1"] .stat-line{ font-size:24px; }

    /* =========================
       REST OF STYLES
       ========================= */
    .status-in{ background:var(--live); animation:pulse 2s infinite; }
    .status-post{ color:var(--final-gold); border:1px solid var(--final-gold); }
    .status-pre{ color:#cfcfcf; border:1px solid #444; }
    .status-none{ color:#444; border:1px solid #222; }

    .next-wrap{ display:flex; flex-direction:column; align-items:center; gap:12px; }
    .next-label{ color:#444; font-size:12px; font-weight:900; letter-spacing:1px; }
    body[data-cols="2"] .next-label{ font-size:14px; letter-spacing:1.4px; }
    body[data-cols="1"] .next-label{ font-size:16px; letter-spacing:1.6px; }

    .opp-row{ display:flex; align-items:center; gap:18px; }

    .countdown{
      color:#bdbdbd;
      letter-spacing:0.4px;
      text-transform:uppercase;
      border-radius:999px;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
    }

    .next-time{ color:#cfcfcf; letter-spacing:0.2px; }

    .score-row{
      display:flex; align-items:center; justify-content:center;
      gap:18px; margin-top:4px;
    }
    body[data-cols="2"] .score-row{ gap:24px; }
    body[data-cols="1"] .score-row{ gap:28px; }

    .score-team{
      display:flex; align-items:center; gap:12px;
      padding:10px 14px; border-radius:14px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.08);
    }
    .score-team.batting{
      border:2px solid var(--live);
      box-shadow:0 0 22px rgba(255,59,59,0.35);
      background:rgba(255,59,59,0.06);
    }

    .game-pill{
      margin-top:12px;
      border-radius:999px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.10);
      color:#cfcfcf;
      letter-spacing:0.6px;
      text-transform:uppercase;
    }

    .alert-row{
      margin-top:10px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:center;
    }
    .alert-pill{
      padding:8px 14px;
      border-radius:999px;
      font-size:14px;
      font-weight:900;
      letter-spacing:0.6px;
      text-transform:uppercase;
      background:rgba(255,59,59,0.12);
      border:1px solid rgba(255,59,59,0.55);
      color:#fff;
      box-shadow:0 0 18px rgba(255,59,59,0.18);
    }
    body[data-cols="2"] .alert-pill{ font-size:16px; padding:10px 16px; }
    body[data-cols="1"] .alert-pill{ font-size:18px; padding:12px 18px; }

    /* Ticker */
    .ticker-wrap{
      background:#000; height:215px; border-top:6px solid var(--accent);
      display:flex; align-items:center; overflow:hidden;
    }
    .ticker-move{
      display:flex; white-space:nowrap;
      animation:ticker-scroll 140s linear infinite;
      will-change:transform;
    }
    .ticker-item{
      display:flex; align-items:center; height:175px;
      background:#151515; margin:0 40px; padding:0 50px;
      border-radius:20px; font-size:72px; font-weight:900;
    }

    .ticker-alert-pulse{ border:4px solid var(--live)!important; animation:alert-glow 1s infinite alternate!important; }
    @keyframes alert-glow{ from{ box-shadow:0 0 10px rgba(255,59,59,0.2);} to{ box-shadow:0 0 50px rgba(255,59,59,0.8);} }
    .alert-badge{ background:var(--live); color:white; font-size:24px; padding:4px 12px; border-radius:4px; margin-left:20px; }

    .ticker-logo-container{ width:120px; height:120px; display:flex; align-items:center; justify-content:center; margin:0 15px; }
    .ticker-team-logo{ width:115px; height:115px; object-fit:contain; }
    .league-badge{ background:#222; color:#888; font-size:24px; padding:5px 15px; border-radius:5px; margin-right:25px; }

    .ticker-batting{
      display:inline-flex;
      align-items:center;
      padding:8px 14px;
      border-radius:14px;
      border:3px solid var(--live);
      background:rgba(255,59,59,0.08);
      box-shadow:0 0 24px rgba(255,59,59,0.28);
      line-height:1;
    }

    @keyframes ticker-scroll{ 0%{ transform:translateX(0);} 100%{ transform:translateX(-50%);} }
    @keyframes pulse{ 0%,100%{ opacity:1;} 50%{ opacity:0.5;} }
  </style>
</head>

<body>
  <div class="dashboard" id="cards-container"></div>
  <div class="ticker-wrap"><div class="ticker-move" id="ticker-content"></div></div>

  <script>
    const workerUrl = "https://grumpys-scores-api.shootscore3.workers.dev/?url=";
    const CT_TZ = "America/Chicago";

    const HIDE_AFTER_DAYS = 3;
    const NFL_SHOW_WITHIN_DAYS = 7;

    const TEAMS = [
      { id:"30", sport:"hockey",     league:"nhl", name:"Wild"   },
      { id:"16", sport:"basketball", league:"nba", name:"Wolves" },
      { id:"9",  sport:"baseball",   league:"mlb", name:"Twins"  },
      { id:"16", sport:"football",   league:"nfl", name:"Vikings"}
    ];

    async function fetchJson(url){
      try{
        const response = await fetch(workerUrl + encodeURIComponent(url));
        return await response.json();
      }catch(e){ return null; }
    }

    function teamLogo(t){
      return t?.logo || t?.logos?.[0]?.href || t?.logos?.[0]?.url || "";
    }
    function teamName(t){
      return t?.shortDisplayName || t?.displayName || t?.name || t?.abbreviation || "TBD";
    }

    function normalizeDetailForPill(detail){
      if (!detail) return "";
      return String(detail).replace(/\s+/g, " ").trim();
    }

    function countdownText(iso){
      if (!iso) return "";
      const start = new Date(iso).getTime();
      const now = Date.now();
      const diff = start - now;
      if (diff <= 0) return "";
      const totalMinutes = Math.floor(diff / 60000);
      const days = Math.floor(totalMinutes / (60 * 24));
      const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
      const mins = totalMinutes % 60;
      if (days >= 1) return `Starts in ${days}d ${hours}h`;
      if (hours >= 1) return `Starts in ${hours}h ${mins}m`;
      return `Starts in ${mins}m`;
    }

    function nextLabelAndTime(iso){
      if (!iso) return "TBD";
      const start = new Date(iso);

      const todayCT = new Date().toLocaleDateString('en-US', { timeZone: CT_TZ, year:'numeric', month:'2-digit', day:'2-digit' });
      const startCT = start.toLocaleDateString('en-US', { timeZone: CT_TZ, year:'numeric', month:'2-digit', day:'2-digit' });

      const [mm, dd, yyyy] = todayCT.split('/').map(x => parseInt(x, 10));
      const tomorrowDate = new Date(Date.UTC(yyyy, mm - 1, dd + 1, 12, 0, 0));
      const tomorrowCT = tomorrowDate.toLocaleDateString('en-US', { timeZone: CT_TZ, year:'numeric', month:'2-digit', day:'2-digit' });

      let label = "";
      if (startCT === todayCT) label = "TODAY";
      else if (startCT === tomorrowCT) label = "TOMORROW";
      else {
        const dow = start.toLocaleDateString('en-US', { timeZone: CT_TZ, weekday:'short' }).toUpperCase();
        const md = start.toLocaleDateString('en-US', { timeZone: CT_TZ, month:'numeric', day:'numeric' });
        label = `${dow} ${md}`;
      }

      const time = start.toLocaleTimeString('en-US', { timeZone: CT_TZ, hour:'numeric', minute:'2-digit' });
      return `${label} • ${time} CT`;
    }

    async function standingsText(team, teamDetails){
      const summary = teamDetails?.team?.standingSummary || teamDetails?.team?.standingsSummary || "";
      return summary ? String(summary) : "";
    }

    /* =========================
       ✅ Leaders (Wild/Wolves)
       ========================= */
    const leadersCache = new Map();
    const LEADERS_TTL_MS = 10 * 60 * 1000;

    function safeVal(v){
      return (v === null || v === undefined) ? "" : String(v).trim();
    }

    function findLeaderGroup(data, keywords){
      const groups = data?.leaders;
      if (!Array.isArray(groups)) return null;

      const norm = (s) => String(s || "").toLowerCase();

      // try keyword match against group.name/displayName/abbreviation
      for (const g of groups){
        const hay = `${norm(g?.name)} ${norm(g?.displayName)} ${norm(g?.abbreviation)}`;
        if (keywords.some(k => hay.includes(k))) return g;
      }
      return null;
    }

    function formatTop3Points(group){
      const arr = Array.isArray(group?.leaders) ? group.leaders : [];
      const top = arr.slice(0, 3).map(x => {
        const nm = x?.athlete?.displayName || x?.athlete?.shortName || "";
        const val = safeVal(x?.displayValue);
        if (!nm || !val) return null;
        return `${nm} ${val}`;
      }).filter(Boolean);

      return top.length ? top.join(" • ") : "";
    }

    function formatSingleLeader(group){
      const first = group?.leaders?.[0];
      const nm = first?.athlete?.displayName || first?.athlete?.shortName || "";
      const val = safeVal(first?.displayValue);
      if (!nm || !val) return "";
      return `${nm} ${val}`;
    }

    async function getTeamLeadersBlock(team){
      // only for Wild + Wolves
      if (!(team.league === "nhl" || team.league === "nba")) return null;

      const key = `${team.sport}:${team.league}:${team.id}`;
      const cached = leadersCache.get(key);
      if (cached && (Date.now() - cached.ts) < LEADERS_TTL_MS) return cached.block;

      const data = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/teams/${team.id}/leaders`);
      if (!data) return null;

      let block = null;

      if (team.league === "nhl") {
        // Points group (top 3)
        const ptsGroup = findLeaderGroup(data, ["points", "pts"]);
        const gGroup   = findLeaderGroup(data, ["goals", "goal", "g"]);
        const aGroup   = findLeaderGroup(data, ["assists", "assist", "a"]);

        const ptsTop3 = ptsGroup ? formatTop3Points(ptsGroup) : "";
        const goals1  = gGroup ? formatSingleLeader(gGroup) : "";
        const ast1    = aGroup ? formatSingleLeader(aGroup) : "";

        block = [
          ptsTop3 ? { k:"PTS (TOP 3)", v: ptsTop3 } : null,
          goals1  ? { k:"G", v: goals1 } : null,
          ast1    ? { k:"A", v: ast1 } : null
        ].filter(Boolean);
      }

      if (team.league === "nba") {
        const ppgGroup = findLeaderGroup(data, ["points per game", "ppg", "points"]);
        const rebGroup = findLeaderGroup(data, ["rebounds", "rpg", "reb"]);
        const astGroup = findLeaderGroup(data, ["assists", "apg", "ast"]);
        const stlGroup = findLeaderGroup(data, ["steals", "spg", "stl"]);

        const ppg1 = ppgGroup ? formatSingleLeader(ppgGroup) : "";
        const reb1 = rebGroup ? formatSingleLeader(rebGroup) : "";
        const ast1 = astGroup ? formatSingleLeader(astGroup) : "";
        const stl1 = stlGroup ? formatSingleLeader(stlGroup) : "";

        block = [
          ppg1 ? { k:"PPG", v: ppg1 } : null,
          reb1 ? { k:"REB", v: reb1 } : null,
          ast1 ? { k:"AST", v: ast1 } : null,
          stl1 ? { k:"STL", v: stl1 } : null
        ].filter(Boolean);
      }

      // If we failed to build anything, return null
      if (!block || !block.length) block = null;

      leadersCache.set(key, { ts: Date.now(), block });
      return block;
    }

    /* =========================
       Alerts + helper logic
       ========================= */
    function toNum(v){
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function mlbAlerts(game){
      const comp = game?.competitions?.[0];
      const sit = comp?.situation;
      if (!sit) return [];
      const on1 = !!sit.onFirst, on2 = !!sit.onSecond, on3 = !!sit.onThird;
      const inning = toNum(sit.inning) ?? null;
      const awayScore = toNum(comp?.competitors?.[1]?.score);
      const homeScore = toNum(comp?.competitors?.[0]?.score);

      const alerts = [];
      if (on1 && on2 && on3) alerts.push("BASES LOADED");
      else if (on2 || on3) alerts.push("RISP");
      if (inning !== null && inning >= 9 && (on1 || on2 || on3) && awayScore !== null && homeScore !== null && awayScore === homeScore) {
        alerts.push("GO-AHEAD RUN ON");
      }
      return alerts;
    }

    function nhlAlerts(game){
      const sit = game?.competitions?.[0]?.situation;
      return sit?.onPowerPlay ? ["POWER PLAY"] : [];
    }

    function nbaAlerts(game){
      const comp = game?.competitions?.[0];
      const sit = comp?.situation;
      if (!sit) return [];
      const period = toNum(sit.period);
      const clock = (sit.clock || "").trim();
      if (!period || !clock || period < 4) return [];
      const [mStr, sStr] = clock.split(":");
      const mins = toNum(mStr), secs = toNum(sStr);
      if (mins === null || secs === null) return [];
      const secondsLeft = mins * 60 + secs;
      if (secondsLeft > 300) return [];
      const a = toNum(comp?.competitors?.[1]?.score);
      const h = toNum(comp?.competitors?.[0]?.score);
      if (a === null || h === null) return [];
      return Math.abs(a - h) <= 6 ? ["CLUTCH"] : [];
    }

    function nflAlerts(game){
      const sit = game?.competitions?.[0]?.situation;
      return sit?.isRedZone ? ["RED ZONE"] : [];
    }

    function getAlertsForGame(league, game){
      const state = game?.status?.type?.state;
      if (state !== "in") return [];
      if (league === "mlb") return mlbAlerts(game);
      if (league === "nhl") return nhlAlerts(game);
      if (league === "nba") return nbaAlerts(game);
      if (league === "nfl") return nflAlerts(game);
      return [];
    }

    function mlbBattingSideFromEvent(event){
      const comp = event?.competitions?.[0];
      const sit = comp?.situation;
      if (!sit) return null;
      const half = String(sit.inningHalf || sit.inningState || "").toLowerCase();
      if (half.includes("top")) return "away";
      if (half.includes("bottom") || half.includes("bot")) return "home";
      return null;
    }

    function pickBestEventForTeam(scoreboard, teamId){
      const events = (scoreboard?.events || []).filter(e =>
        e?.competitions?.[0]?.competitors?.some(c => String(c?.team?.id) === String(teamId))
      );
      if (!events.length) return null;

      const prio = (e) => {
        const s = e?.status?.type?.state;
        if (s === "in") return 0;
        if (s === "post") return 1;
        if (s === "pre") return 2;
        return 3;
      };

      events.sort((a,b) => {
        const pa = prio(a), pb = prio(b);
        if (pa !== pb) return pa - pb;
        return new Date(a.date).getTime() - new Date(b.date).getTime();
      });

      return events[0];
    }

    async function getOpponentFromEventSummary(team, eventId, myTeamId){
      if (!eventId) return null;
      const event = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/summary?event=${eventId}`);
      const comp = event?.header?.competitions?.[0];
      const competitors = comp?.competitors;
      if (!competitors || competitors.length < 2) return null;

      const me  = competitors.find(c => String(c?.team?.id) === String(myTeamId));
      const opp = competitors.find(c => String(c?.team?.id) !== String(myTeamId));
      if (!opp) return null;

      return {
        oppName: teamName(opp?.team),
        oppLogo: teamLogo(opp?.team),
        atOrVs: (me?.homeAway === "away") ? "@" : "vs"
      };
    }

    function parseShortNameForOpponent(shortName, myAbbrev){
      if (!shortName) return null;
      const s = String(shortName).toUpperCase().trim();
      const m = s.match(/^([A-Z]{2,4})\s*(?:@|VS)\s*([A-Z]{2,4})$/);
      if (!m) return null;

      const left = m[1], right = m[2];
      const isAt = s.includes("@");

      const oppAbbrev = (left === myAbbrev) ? right : left;
      let atOrVs = "vs";
      if (isAt) atOrVs = (left === myAbbrev) ? "@" : "vs";
      return { oppAbbrev, atOrVs };
    }

    async function lookupTeamByAbbrev(team, abbrev){
      if (!abbrev) return null;
      const data = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/teams?search=${encodeURIComponent(abbrev)}`);
      const first = data?.sports?.[0]?.leagues?.[0]?.teams?.[0]?.team || data?.teams?.[0]?.team;
      if (!first) return null;
      return { name: teamName(first), logo: teamLogo(first) };
    }

    async function getTeamData(team){
      const scoreboard = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/scoreboard`);
      const event = pickBestEventForTeam(scoreboard, team.id);

      const teamDetails = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/teams/${team.id}`);
      const record = teamDetails?.team?.record?.items?.[0]?.summary || "0-0";
      const logo = teamDetails?.team?.logo || `https://a.espncdn.com/i/teamlogos/${team.league}/500/${team.id}.png`;
      const standings = await standingsText(team, teamDetails);
      const myAbbrev = String(teamDetails?.team?.abbreviation || "").toUpperCase();

      // We'll compute leaders block, but only DISPLAY it when NOT LIVE.
      const leadersBlock = await getTeamLeadersBlock(team);

      if (event){
        const comp = event.competitions[0];
        const me   = comp.competitors.find(c => String(c?.team?.id) === String(team.id));
        const opp  = comp.competitors.find(c => String(c?.team?.id) !== String(team.id));

        const state = event.status.type.state;
        const startIso = event.date || null;

        const oppName = teamName(opp?.team);
        const oppLogo = teamLogo(opp?.team);
        const atOrVs  = (me?.homeAway === "away") ? "@" : "vs";

        const detail = (state === "pre" && startIso) ? nextLabelAndTime(startIso) : event.status.type.shortDetail;
        const alerts = getAlertsForGame(team.league, event);

        let myBatting = false, oppBatting = false;
        if (team.league === "mlb" && state === "in") {
          const battingSide = mlbBattingSideFromEvent(event);
          if (battingSide) {
            myBatting = (me?.homeAway === battingSide);
            oppBatting = (opp?.homeAway === battingSide);
          }
        }

        return {
          status: state,
          detail,
          startIso,
          countdown: (state === "pre" && startIso) ? countdownText(startIso) : "",
          myScore: me?.score ?? "",
          oppScore: opp?.score ?? "",
          logo,
          record,
          standings,
          leadersBlock,
          showLeaders: (state !== "in"),   // ✅ only when not LIVE
          oppName,
          oppLogo,
          atOrVs,
          myLogo: teamLogo(me?.team) || logo,
          theirLogo: oppLogo,
          alerts,
          myBatting,
          oppBatting
        };
      }

      const next = teamDetails?.team?.nextEvent?.[0];
      const startIso = next?.date || null;

      let oppInfo = await getOpponentFromEventSummary(team, next?.id, team.id);

      if (!oppInfo) {
        const parsed = parseShortNameForOpponent(next?.shortName, myAbbrev);
        if (parsed?.oppAbbrev) {
          const looked = await lookupTeamByAbbrev(team, parsed.oppAbbrev);
          oppInfo = {
            oppName: looked?.name || parsed.oppAbbrev,
            oppLogo: looked?.logo || "",
            atOrVs: parsed.atOrVs || "vs"
          };
        }
      }

      return {
        status:"none",
        record,
        logo,
        standings,
        leadersBlock,
        showLeaders: true,             // ✅ definitely not live
        startIso,
        countdown: startIso ? countdownText(startIso) : "",
        nextTime: startIso ? nextLabelAndTime(startIso) : "TBD",
        nextOpponent: oppInfo?.oppName || "TBD",
        nextOppLogo: oppInfo?.oppLogo || "",
        nextAtOrVs: oppInfo?.atOrVs || "vs",
        alerts: [],
        myBatting:false,
        oppBatting:false
      };
    }

    function statusLabel(state){
      if (state === "in") return "LIVE";
      if (state === "post") return "FINAL";
      if (state === "pre") return "UP NEXT";
      return "OFF DAY";
    }

    function renderLeadersHtml(block){
      if (!block || !block.length) return "";
      return `
        <div class="stats-block">
          ${block.map(row => `
            <div class="stat-line"><span class="stat-key">${row.k}:</span>${row.v}</div>
          `).join("")}
        </div>
      `;
    }

    async function updateDashboard(){
      const container = document.getElementById("cards-container");
      const teamResults = await Promise.all(TEAMS.map(t => getTeamData(t)));
      const now = Date.now();

      const visible = teamResults
        .map((data, idx) => ({ data, idx }))
        .filter(({ data, idx }) => {
          if (data.status === "in" || data.status === "post" || data.status === "pre") return true;

          const league = TEAMS[idx].league;
          if (!data.startIso) return league === "nfl" ? false : true;

          const diffDays = (new Date(data.startIso).getTime() - now) / 86400000;
          if (league === "nfl") return diffDays <= NFL_SHOW_WITHIN_DAYS;
          return diffDays <= HIDE_AFTER_DAYS;
        });

      const listToRender = visible.length ? visible : teamResults.map((data, idx) => ({ data, idx }));
      const cols = Math.max(1, Math.min(4, listToRender.length));
      document.documentElement.style.setProperty("--cols", cols);
      document.body.setAttribute("data-cols", String(cols));

      container.innerHTML = "";

      const opponentBlock = (atOrVs, oppLogo, oppName, timeText, countdown) => {
        const hasLogo = !!oppLogo;
        return `
          <div class="next-wrap">
            <div class="next-label">NEXT</div>
            <div class="opp-row">
              <div class="opp-text">${atOrVs}</div>
              ${hasLogo ? `<img class="opp-logo" src="${oppLogo}" alt="">`
                        : `<div class="opp-text">${oppName}</div>`}
            </div>
            ${countdown ? `<div class="countdown">${countdown}</div>` : ``}
            <div class="next-time">${timeText}</div>
          </div>
        `;
      };

      const scoreBlock = (data) => {
        const pillText = normalizeDetailForPill(data.detail);
        const alertsHtml = (data.alerts && data.alerts.length)
          ? `<div class="alert-row">${data.alerts.map(a => `<div class="alert-pill">${a}</div>`).join("")}</div>`
          : "";

        const myBattingClass = data.myBatting ? "batting" : "";
        const oppBattingClass = data.oppBatting ? "batting" : "";

        return `
          <div class="score-row">
            <div class="score-team ${myBattingClass}">
              <img class="score-logo" src="${data.myLogo}" alt="">
              <div class="score-num">${data.myScore}</div>
            </div>
            <div class="score-dash">-</div>
            <div class="score-team ${oppBattingClass}">
              <div class="score-num">${data.oppScore}</div>
              <img class="score-logo" src="${data.theirLogo}" alt="">
            </div>
          </div>
          ${alertsHtml}
          ${pillText ? `<div class="game-pill">${pillText}</div>` : ``}
        `;
      };

      listToRender.forEach(({ data, idx: i }) => {
        const card = document.createElement("div");
        card.className = "card";
        const badgeClass = `status-badge status-${data.status}`;

        let bottomBlock = "";
        if (data.status === "in" || data.status === "post") {
          bottomBlock = scoreBlock(data);
        } else if (data.status === "pre") {
          bottomBlock = opponentBlock(data.atOrVs, data.oppLogo, data.oppName, data.detail, data.countdown);
        } else {
          bottomBlock = opponentBlock(data.nextAtOrVs, data.nextOppLogo, data.nextOpponent, data.nextTime, data.countdown);
        }

        const leadersHtml = (data.showLeaders && data.leadersBlock) ? renderLeadersHtml(data.leadersBlock) : "";

        card.innerHTML = `
          <div class="${badgeClass}">${statusLabel(data.status)}</div>
          <img class="team-logo" src="${data.logo}" alt="${TEAMS[i].name} logo">
          <div>
            <div class="name-text">${TEAMS[i].name}</div>
            <div class="record-text">${data.record}</div>
            ${data.standings ? `<div class="standings-line">${data.standings}</div>` : ``}
            ${leadersHtml}
          </div>
          ${bottomBlock}
        `;
        container.appendChild(card);
      });
    }

    /* ✅ TICKER: NHL then NBA then MLB, within each league: LIVE -> UPCOMING -> FINAL */
    async function updateTicker(){
      const leagues = [
        { l:"nhl", s:"hockey" },
        { l:"nba", s:"basketball" },
        { l:"mlb", s:"baseball" }
        // later: { l:"nfl", s:"football" }
      ];

      const ticker = document.getElementById("ticker-content");
      let allItems = [];

      const stateRank = (state) => {
        if (state === "in") return 0;
        if (state === "pre") return 1;
        if (state === "post") return 2;
        return 3;
      };

      for (const league of leagues){
        const data = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${league.s}/${league.l}/scoreboard`);

        const events = (data?.events || []).slice().sort((a, b) => {
          const sa = a?.status?.type?.state;
          const sb = b?.status?.type?.state;

          const ra = stateRank(sa);
          const rb = stateRank(sb);
          if (ra !== rb) return ra - rb;

          const ta = new Date(a?.date || 0).getTime();
          const tb = new Date(b?.date || 0).getTime();
          return ta - tb;
        });

        events.forEach(game => {
          const comp = game.competitions[0];
          const away = comp.competitors[1], home = comp.competitors[0];
          const state = game.status.type.state;

          let alertClass = "";
          let alertLabel = "";
          const alerts = getAlertsForGame(league.l, game);
          if (alerts.length) {
            alertClass = "ticker-alert-pulse";
            alertLabel = `<span class="alert-badge">${alerts[0]}</span>`;
          }

          const awayScoreText = (state === "pre") ? "" : (away.score ?? "");
          const homeScoreText = (state === "pre") ? "" : (home.score ?? "");

          const detail = (state === "pre" && game.date)
            ? (() => {
                const d = new Date(game.date);
                const md = d.toLocaleDateString('en-US', { timeZone: CT_TZ, month:'numeric', day:'numeric' });
                const t  = d.toLocaleTimeString('en-US', { timeZone: CT_TZ, hour:'numeric', minute:'2-digit' });
                return `${md} - ${t} CT`;
              })()
            : game.status.type.shortDetail;

          let awayWrapStart = "", awayWrapEnd = "";
          let homeWrapStart = "", homeWrapEnd = "";
          if (league.l === "mlb" && state === "in") {
            const battingSide = mlbBattingSideFromEvent(game);
            if (battingSide === "away") { awayWrapStart = `<span class="ticker-batting">`; awayWrapEnd = `</span>`; }
            if (battingSide === "home") { homeWrapStart = `<span class="ticker-batting">`; homeWrapEnd = `</span>`; }
          }

          allItems.push(`
            <div class="ticker-item ${alertClass}">
              <div class="league-badge">${league.l.toUpperCase()}</div>
              <div class="ticker-logo-container"><img class="ticker-team-logo" src="${away.team.logo}" alt=""></div>
              ${awayWrapStart}<span>${away.team.abbreviation}${awayScoreText !== "" ? ` ${awayScoreText}` : ""}</span>${awayWrapEnd}
              <span style="color:#222; margin:0 15px;">@</span>
              <div class="ticker-logo-container"><img class="ticker-team-logo" src="${home.team.logo}" alt=""></div>
              ${homeWrapStart}<span>${home.team.abbreviation}${homeScoreText !== "" ? ` ${homeScoreText}` : ""}</span>${homeWrapEnd}
              <span style="margin-left:30px; color:${state === "in" ? "var(--live)" : (state === "post" ? "var(--final-gold)" : "#888")}">${detail}</span>
              ${alertLabel}
            </div>
          `);
        });
      }

      ticker.innerHTML = [...allItems, ...allItems].join("");
      const mover = document.querySelector(".ticker-move");
      const seconds = Math.max(120, allItems.length * 7);
      mover.style.animationDuration = `${seconds}s`;
    }

    updateDashboard();
    updateTicker();
    setInterval(updateDashboard, 60000);
    setInterval(updateTicker, 300000);
  </script>
</body>
