<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MN Sports Center - Broadcast Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505; --card-bg: #111111; --text: #ffffff;
            --live: #ff3b3b; --final-gold: #D4AF37;
            --theme-color: #222; /* Changes dynamically based on live games */
        }

        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Inter', sans-serif; width: 100vw; height: 100vh;
            overflow: hidden; display: flex; flex-direction: column;
            transition: background 0.5s ease;
        }

        .dashboard {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;
            padding: 15px; flex: 1; box-sizing: border-box;
        }

        .card {
            background: var(--card-bg); border-radius: 20px; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
            border: 2px solid var(--theme-color); text-align: center;
            position: relative; transition: all 0.5s ease;
        }

        /* Standings Badge */
        .rank-badge {
            position: absolute; top: 12px; right: 12px;
            background: rgba(212, 175, 55, 0.1); color: var(--final-gold);
            padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 900;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .card.active-game { border-color: var(--live); box-shadow: 0 0 25px rgba(255, 59, 59, 0.2); }

        .team-logo { width: 90px; height: 90px; object-fit: contain; }
        
        /* Player Stat Row */
        .player-row {
            display: flex; align-items: center; background: rgba(255,255,255,0.03);
            border-radius: 12px; padding: 8px; width: 95%; margin: 10px 0;
            border-left: 4px solid var(--theme-color);
        }
        .headshot { width: 45px; height: 45px; border-radius: 50%; background: #222; margin-right: 10px; border: 1px solid #333; }
        .stat-content { text-align: left; }
        .stat-name { font-size: 12px; font-weight: 900; color: var(--final-gold); text-transform: uppercase; }
        .stat-vals { font-size: 10px; color: #aaa; }

        /* VS Score Section */
        .vs-container { display: flex; align-items: center; justify-content: center; margin: 5px 0; gap: 10px; }
        .opp-logo { width: 40px; height: 40px; object-fit: contain; }
        .score-text { font-size: 40px; font-weight: 900; }

        .status-badge { font-size: 13px; font-weight: 900; padding: 3px 8px; border-radius: 4px; margin-bottom: 5px; }
        .status-in { background: var(--live); animation: pulse 2s infinite; }
        .status-none { color: #444; border: 1px solid #222; }

        /* TICKER (STAYS SAME) */
        .ticker-wrap { background: #000; height: 210px; border-top: 5px solid var(--theme-color); display: flex; align-items: center; overflow: hidden; transition: border 0.5s ease; }
        .ticker-move { display: flex; white-space: nowrap; animation: ticker-scroll 100s linear infinite; }
        .ticker-item { display: flex; align-items: center; background: #151515; margin: 0 35px; padding: 0 45px; border-radius: 18px; font-size: 70px; font-weight: 900; height: 160px; }
        .ticker-logo { width: 110px; height: 110px; object-fit: contain; margin: 0 15px; }

        @keyframes ticker-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    </style>
</head>
<body>
    <div class="dashboard" id="cards-container"></div>
    <div class="ticker-wrap"><div class="ticker-move" id="ticker-content"></div></div>

    <script>
        const worker = "https://grumpys-scores-api.shootscore3.workers.dev/?url=";
        const TEAMS = [
            { id: "30", sport: "hockey", league: "nhl", name: "Wild", color: "#154734", athleteId: "3043233", pName: "Kirill Kaprizov", pStats: "32G, 38A (70 PTS)" },
            { id: "16", sport: "basketball", league: "nba", name: "Wolves", color: "#0C2340", athleteId: "4431611", pName: "Anthony Edwards", pStats: "29.6 PPG, 5.3 RPG" },
            { id: "9", sport: "baseball", league: "mlb", name: "Twins", color: "#002B5C", athleteId: "4240362", pName: "Jose Miranda", pStats: "6 RBI, .310 AVG" },
            { id: "16", sport: "football", league: "nfl", name: "Vikings", color: "#4F2683", athleteId: "4426336", pName: "J.J. McCarthy", pStats: "1632 Yds, 12 TD" }
        ];

        async function fetchJson(url) {
            try { const r = await fetch(worker + encodeURIComponent(url)); return await r.json(); } catch(e) { return null; }
        }

        // Fetches Rank from Standings
        async function getRank(league, teamId) {
            const data = await fetchJson(`https://site.api.espn.com/apis/v2/sports/${league==='nba'?'basketball':(league==='nhl'?'hockey':(league==='mlb'?'baseball':'football'))}/${league}/standings`);
            try {
                for (const group of data.children || []) {
                    const entry = group.standings.entries.find(e => e.team.id === teamId);
                    if (entry) {
                        const rank = entry.stats.find(s => s.name === 'rank')?.displayValue || '—';
                        return `#${rank} ${group.abbreviation || group.name}`;
                    }
                }
            } catch(e) {} return "—";
        }

        async function updateDashboard() {
            const container = document.getElementById('cards-container');
            const results = await Promise.all(TEAMS.map(async (team) => {
                const sb = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/scoreboard`);
                const details = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/teams/${team.id}`);
                const rank = await getRank(team.league, team.id);
                
                let game = sb?.events?.find(e => e.competitions[0].competitors.some(c => c.team.id === team.id));
                let oppLogo = "";
                if (game) {
                    const opp = game.competitions[0].competitors.find(c => c.team.id !== team.id);
                    oppLogo = opp.team.logo;
                    if (game.status.type.state === 'in') document.documentElement.style.setProperty('--theme-color', team.color);
                }
                return { ...team, game, rank, record: details?.team?.record?.items?.[0]?.summary || "0-0", oppLogo, logo: details?.team?.logo };
            }));

            container.innerHTML = '';
            results.forEach(res => {
                const isLive = res.game?.status.type.state === 'in';
                const card = document.createElement('div');
                card.className = `card ${isLive ? 'active-game' : ''}`;
                card.style.setProperty('--theme-color', res.color);

                card.innerHTML = `
                    <div class="rank-badge">${res.rank}</div>
                    <div class="status-badge ${isLive ? 'status-in' : 'status-none'}">${isLive ? 'LIVE' : 'OFF DAY'}</div>
                    <img class="team-logo" src="${res.logo}">
                    <div style="font-size:22px; font-weight:900; margin-top:5px;">${res.name}</div>
                    <div style="color:#666; font-size:13px;">${res.record}</div>

                    <div class="player-row">
                        <img class="headshot" src="https://a.espncdn.com/i/headshots/${res.league}/players/full/${res.athleteId}.png">
                        <div class="stat-content">
                            <div class="stat-name">${res.pName}</div>
                            <div class="stat-vals">${res.pStats}</div>
                        </div>
                    </div>

                    ${res.game ? `
                        <div class="vs-container">
                            <span class="score-text">${res.game.competitions[0].competitors.find(c => c.team.id === res.id).score}</span>
                            <img class="opp-logo" src="${res.oppLogo}">
                            <span class="score-text">${res.game.competitions[0].competitors.find(c => c.team.id !== res.id).score}</span>
                        </div>
                        <div style="font-weight:700; font-size:12px;">${res.game.status.type.shortDetail}</div>
                    ` : `<div style="margin-top:10px; font-size:11px; color:#444; font-weight:900;">SCHEDULED</div>`}
                `;
                container.appendChild(card);
            });
        }

        async function updateTicker() {
            const leagues = [{l:'nhl', s:'hockey'}, {l:'nba', s:'basketball'}, {l:'mlb', s:'baseball'}];
            const ticker = document.getElementById('ticker-content');
            let allItems = [];
            for (const league of leagues) {
                const data = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${league.s}/${league.l}/scoreboard`);
                data?.events?.forEach(game => {
                    const away = game.competitions[0].competitors[1], home = game.competitions[0].competitors[0];
                    allItems.push(`
                        <div class="ticker-item">
                            <img class="ticker-logo" src="${away.team.logo}">
                            <span>${away.team.abbreviation} ${away.score || ''} @ ${home.team.abbreviation} ${home.score || ''}</span>
                            <img class="ticker-logo" src="${home.team.logo}">
                            <span style="margin-left:25px; color:#555;">${game.status.type.shortDetail}</span>
                        </div>
                    `);
                });
            }
            ticker.innerHTML = [...allItems, ...allItems].join('');
        }

        updateDashboard(); updateTicker();
        setInterval(updateDashboard, 60000); setInterval(updateTicker, 300000);
    </script>
</body>
</html>
