<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MN Sports Center - 2026 Pro Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#050505; --card-bg:#111111; --text:#ffffff;
      --live:#ff3b3b; --final-gold:#D4AF37; --accent:#1a1a1a;
      --cols: 4;
    }

    body{
      margin:0; background:var(--bg); color:var(--text);
      font-family:'Inter',sans-serif; width:100vw; height:100vh;
      overflow:hidden; display:flex; flex-direction:column;
    }

    .dashboard{
      display:grid;
      grid-template-columns:repeat(var(--cols), 1fr);
      gap:20px;
      padding:20px;
      flex:1;
      box-sizing:border-box;
      max-height:calc(100vh - 215px);
    }

    .card{
      background:var(--card-bg);
      border-radius:20px;
      padding:24px;
      border:2px solid #222;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      box-sizing:border-box;
      min-height:0;
      overflow:hidden;
    }

    .card-top{ width:100%; display:flex; justify-content:center; }
    .card-main{ display:flex; flex-direction:column; align-items:center; gap:10px; }
    .card-bottom{ width:100%; margin-top:auto; padding-top:14px; }

    .status-badge{ font-size:18px; font-weight:900; padding:6px 15px; border-radius:6px; }
    .status-in{ background:var(--live); animation:pulse 2s infinite; }
    .status-post{ color:var(--final-gold); border:1px solid var(--final-gold); background:transparent; }
    .status-pre{ color:#cfcfcf; border:1px solid #444; background:transparent; }
    .status-none{ color:#444; border:1px solid #222; background:transparent; }

    .team-logo{ width:210px; height:210px; object-fit:contain; }
    .name-text{ font-size:34px; font-weight:900; }
    .record-text{ color:#888; font-weight:800; }
    .standings-line{ margin-top:4px; font-size:14px; font-weight:900; color:#9a9a9a; letter-spacing:0.2px; }

    /* NEXT */
    .next-wrap{ display:flex; flex-direction:column; align-items:center; gap:12px; }
    .next-label{ color:#444; font-size:12px; font-weight:900; letter-spacing:1px; }
    .opp-row{ display:flex; align-items:center; gap:18px; justify-content:center; }
    .opp-logo{ width:120px; height:120px; object-fit:contain; }
    .opp-text{ font-size:64px; font-weight:900; line-height:1; }
    .countdown{
      color:#d0d0d0;
      letter-spacing:0.5px;
      text-transform:uppercase;
      border-radius:999px;
      padding:9px 14px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.10);
      font-weight:900;
      font-size:15px;
    }
    .next-time{
      color:#e0e0e0;
      letter-spacing:0.2px;
      font-weight:900;
      font-size:18px;
    }

    /* Score block */
    .score-row{
      display:flex; align-items:center; justify-content:center;
      gap:16px;
    }
    .score-team{
      display:flex; align-items:center; gap:12px;
      padding:10px 14px; border-radius:14px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.08);
    }
    .score-logo{ width:56px; height:56px; object-fit:contain; }
    .score-num{ font-size:64px; font-weight:900; line-height:1; }
    .score-dash{ font-size:64px; font-weight:900; line-height:1; color:#666; }

    /* Bottom carousel panel */
    .panel{
      width:100%;
      padding:16px 18px;
      border-radius:20px;
      background:transparent;
      border:none;
      box-sizing:border-box;
    }
    .panel-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:12px;
    }
    .panel-title{
      font-size:12px;
      font-weight:900;
      letter-spacing:1px;
      text-transform:uppercase;
      color:rgba(255,255,255,0.45);
      text-align:left;
    }
    .dots{ display:flex; gap:6px; }
    .dot{
      width:7px; height:7px; border-radius:999px;
      background:rgba(255,255,255,0.18);
    }
    .dot.active{ background:rgba(255,255,255,0.60); }

    .slides{ position:relative; min-height:210px; }

    .slide{
      position:absolute; inset:0;
      opacity:0; transform:translateY(6px);
      transition:opacity .35s ease, transform .35s ease;
      display:flex;
      flex-direction:column;
      gap:0;
      pointer-events:none;
    }
    .slide.active{
      opacity:1; transform:translateY(0);
      pointer-events:auto;
    }

    .leader-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:8px 0;
      border-top:1px solid rgba(255,255,255,0.06);
    }
    .leader-row:first-child{
      border-top:none;
      padding-top:0;
    }
    .leader-row:last-child{
      padding-bottom:0;
    }

    .leader-left{
      display:flex; align-items:center; gap:14px;
      min-width:0;
    }
    .headshot{
      width:66px; height:66px;
      border-radius:999px;
      object-fit:cover;
      background:#222;
      border:1px solid rgba(255,255,255,0.14);
      flex:0 0 auto;
    }
    .leader-text{ min-width:0; text-align:left; }
    .leader-k{
      font-size:12px;
      font-weight:900;
      letter-spacing:0.8px;
      text-transform:uppercase;
      color:rgba(255,255,255,0.55);
      line-height:1;
      margin-bottom:2px;
    }
    .leader-v{
      font-size:22px;
      font-weight:900;
      color:rgba(255,255,255,0.97);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:360px;
      line-height:1.05;
    }
    .leader-stat{
      font-size:24px;
      font-weight:900;
      color:var(--final-gold);
      white-space:nowrap;
    }

    /* Custom live/final card area */
    .wild-live-wrap{
      display:flex;
      flex-direction:column;
      gap:12px;
      width:100%;
    }

    .wild-live-scoreboard{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:26px;
      width:100%;
      padding:12px 16px;
      border-radius:18px;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      box-sizing:border-box;
    }

    .wild-side{
      display:flex;
      align-items:center;
      gap:14px;
      min-width:0;
    }

    .wild-live-team-logo{
      width:72px;
      height:72px;
      object-fit:contain;
      flex:0 0 auto;
    }

    .wild-live-score{
      font-size:72px;
      font-weight:900;
      line-height:1;
      color:#fff;
    }

    .wild-live-divider{
      font-size:34px;
      font-weight:900;
      color:#666;
      line-height:1;
      flex:0 0 auto;
      text-transform:lowercase;
    }

    .wild-live-status{
      text-align:center;
      font-size:22px;
      font-weight:900;
      color:#d7d7d7;
      letter-spacing:0.4px;
      line-height:1.1;
      min-height:24px;
    }

    .wild-live-panel{
      width:100%;
      padding:10px 4px 0;
      box-sizing:border-box;
    }

    .wild-live-panel-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:10px;
    }

    .wild-live-panel-title{
      font-size:12px;
      font-weight:900;
      letter-spacing:1px;
      text-transform:uppercase;
      color:rgba(255,255,255,0.45);
    }

    .wild-live-dots{
      display:flex;
      gap:6px;
    }

    .wild-live-dot{
      width:7px;
      height:7px;
      border-radius:999px;
      background:rgba(255,255,255,0.18);
    }

    .wild-live-dot.active{
      background:rgba(255,255,255,0.60);
    }

    .wild-live-slides{
      position:relative;
      min-height:250px;
    }

    .wild-live-slide{
      position:absolute;
      inset:0;
      opacity:0;
      transform:translateY(6px);
      transition:opacity .35s ease, transform .35s ease;
      pointer-events:none;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .wild-live-slide.active{
      opacity:1;
      transform:translateY(0);
      pointer-events:auto;
    }

    .wild-goal-row{
      display:flex;
      align-items:flex-start;
      padding:8px 0;
      border-top:1px solid rgba(255,255,255,0.06);
    }

    .wild-goal-row:first-child{
      border-top:none;
      padding-top:0;
    }

    .wild-goal-left{
      display:flex;
      align-items:flex-start;
      gap:12px;
      min-width:0;
      width:100%;
    }

    .wild-goal-headshot{
      width:58px;
      height:58px;
      border-radius:999px;
      object-fit:cover;
      background:#222;
      border:1px solid rgba(255,255,255,0.14);
      flex:0 0 auto;
    }

    .wild-goal-main{
      min-width:0;
      flex:1;
      text-align:left;
    }

    .wild-goal-name-row{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .wild-goal-scorer{
      font-size:24px;
      font-weight:900;
      color:rgba(255,255,255,0.97);
      line-height:1.05;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .wild-goal-team-logo{
      width:24px;
      height:24px;
      object-fit:contain;
      flex:0 0 auto;
    }

    .wild-goal-assists{
      margin-top:5px;
      font-size:16px;
      font-weight:800;
      color:#a9a9a9;
      line-height:1.2;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .wild-no-goals{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:180px;
      text-align:center;
      font-size:24px;
      font-weight:900;
      color:#8d8d8d;
    }

    /* Ticker */
    .ticker-wrap{
      background:#000; height:215px; border-top:6px solid var(--accent);
      display:flex; align-items:center; overflow:hidden;
    }
    .ticker-move{
      display:flex; white-space:nowrap;
      animation:ticker-scroll 140s linear infinite;
      will-change:transform;
    }
    .ticker-item{
      display:flex; align-items:center; height:175px;
      background:#151515; margin:0 40px; padding:0 50px;
      border-radius:20px; font-size:72px; font-weight:900;
    }
    .ticker-logo-container{ width:120px; height:120px; display:flex; align-items:center; justify-content:center; margin:0 15px; }
    .ticker-team-logo{ width:115px; height:115px; object-fit:contain; }
    .league-badge{ background:#222; color:#888; font-size:24px; padding:5px 15px; border-radius:5px; margin-right:25px; }

    @keyframes ticker-scroll{ 0%{ transform:translateX(0);} 100%{ transform:translateX(-50%);} }
    @keyframes pulse{ 0%,100%{ opacity:1;} 50%{ opacity:0.5;} }
  </style>
</head>

<body>
  <div class="dashboard" id="cards-container"></div>
  <div class="ticker-wrap"><div class="ticker-move" id="ticker-content"></div></div>

  <script>
    const workerUrl = "https://grumpys-scores-api.shootscore3.workers.dev/?url=";
    const CT_TZ = "America/Chicago";

    const HIDE_AFTER_DAYS = 3;
    const NFL_SHOW_WITHIN_DAYS = 7;

    const TEAMS = [
      { id:"30", sport:"hockey",     league:"nhl", name:"Wild"   },
      { id:"16", sport:"basketball", league:"nba", name:"Wolves" },
      { id:"9",  sport:"baseball",   league:"mlb", name:"Twins"  },
      { id:"16", sport:"football",   league:"nfl", name:"Vikings"}
    ];

    // Wild / NHL
    const NHL_SEASON_CODE = "20252026";
    const NHL_WILD_CLUB_STATS_URL = `https://api-web.nhle.com/v1/club-stats/MIN/${NHL_SEASON_CODE}/2`;

    // Wolves stats
    const NBA_WOLVES_LEAGUE_DASH_URL =
      "https://stats.nba.com/stats/leaguedashplayerstats" +
      "?College=&Conference=&Country=&DateFrom=&DateTo=&Division=&DraftPick=&DraftYear=&GameScope=&GameSegment=" +
      "&Height=&LastNGames=0&LeagueID=00&Location=&MeasureType=Base&Month=0&OpponentTeamID=0&Outcome=&PORound=0" +
      "&PaceAdjust=N&PerMode=PerGame&Period=0&PlayerExperience=&PlayerPosition=&PlusMinus=N&Rank=N&Season=2025-26" +
      "&SeasonSegment=&SeasonType=Regular%20Season&ShotClockRange=&StarterBench=&TeamID=1610612750&TwoWay=0&VsConference=&VsDivision=&Weight=";

    const NBA_HEADSHOT = (playerId) =>
      `https://ak-static.cms.nba.com/wp-content/uploads/headshots/nba/latest/260x190/${playerId}.png`;

    // Twins (MLB)
    const MLB_TWINS_TEAM_ID = 142;
    const MLB_SEASON = new Date().getFullYear();
    let MLB_GAME_TYPE = "S";
    const MLB_HEADSHOT = (personId) =>
      `https://img.mlbstatic.com/mlb-photos/image/upload/w_180,q_auto:best/v1/people/${personId}/headshot/67/current`;

    const MLB_TEAM_LOGO = (teamId) =>
      `https://www.mlbstatic.com/team-logos/team-cap-on-light/${teamId}.svg`;

    async function fetchJson(url){
      try{
        const r = await fetch(workerUrl + encodeURIComponent(url));
        const ct = (r.headers.get("content-type") || "").toLowerCase();
        if (!ct.includes("application/json") && !ct.includes("text/json")) return null;
        return await r.json();
      }catch(e){
        return null;
      }
    }

    // cache (10 minutes)
    const LEADERS_TTL_MS = 10 * 60 * 1000;
    const cache = new Map();
    const cacheGet = (k) => {
      const v = cache.get(k);
      if (!v) return null;
      if (Date.now() - v.ts > LEADERS_TTL_MS) return null;
      return v.data;
    };
    const cacheSet = (k, data) => cache.set(k, { ts: Date.now(), data });

    function teamLogo(t){ return t?.logo || t?.logos?.[0]?.href || t?.logos?.[0]?.url || ""; }
    function teamName(t){ return t?.shortDisplayName || t?.displayName || t?.name || t?.abbreviation || "TBD"; }

    function ctDateKey(d){
      return (d instanceof Date ? d : new Date(d))
        .toLocaleDateString("en-US", { timeZone: CT_TZ, year:"numeric", month:"2-digit", day:"2-digit" });
    }

    function daysUntil(iso){
      if (!iso) return Infinity;
      return (new Date(iso).getTime() - Date.now()) / 86400000;
    }

    function countdownText(iso){
      if (!iso) return "";
      const start = new Date(iso).getTime();
      const now = Date.now();
      const diff = start - now;
      if (diff <= 0) return "";
      const totalMinutes = Math.floor(diff / 60000);
      const days = Math.floor(totalMinutes / (60 * 24));
      const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
      const mins = totalMinutes % 60;
      if (days >= 1) return `Starts in ${days}d ${hours}h`;
      if (hours >= 1) return `Starts in ${hours}h ${mins}m`;
      return `Starts in ${mins}m`;
    }

    function nextLabelAndTime(iso){
      if (!iso) return "TBD";
      const start = new Date(iso);

      const todayCT = new Date().toLocaleDateString('en-US', { timeZone: CT_TZ, year:'numeric', month:'2-digit', day:'2-digit' });
      const startCT = start.toLocaleDateString('en-US', { timeZone: CT_TZ, year:'numeric', month:'2-digit', day:'2-digit' });

      const [mm, dd, yyyy] = todayCT.split('/').map(x => parseInt(x, 10));
      const tomorrowDate = new Date(Date.UTC(yyyy, mm - 1, dd + 1, 12, 0, 0));
      const tomorrowCT = tomorrowDate.toLocaleDateString('en-US', { timeZone: CT_TZ, year:'numeric', month:'2-digit', day:'2-digit' });

      let label = "";
      if (startCT === todayCT) label = "TODAY";
      else if (startCT === tomorrowCT) label = "TOMORROW";
      else {
        const dow = start.toLocaleDateString('en-US', { timeZone: CT_TZ, weekday:'short' }).toUpperCase();
        const md = start.toLocaleDateString('en-US', { timeZone: CT_TZ, month:'numeric', day:'numeric' });
        label = `${dow} ${md}`;
      }

      const time = start.toLocaleTimeString('en-US', { timeZone: CT_TZ, hour:'numeric', minute:'2-digit' });
      return `${label} • ${time} CT`;
    }

    function chunkArray(arr, size){
      const out = [];
      for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
      return out;
    }

    function ordinalPeriod(n){
      const num = Number(n);
      if (!Number.isFinite(num) || num <= 0) return "";
      if (num === 1) return "1ST";
      if (num === 2) return "2ND";
      if (num === 3) return "3RD";
      return `${num}OT`;
    }

    function safeText(s){
      return String(s || "").trim();
    }

    function toNum(v){
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function normalizeAthlete(a){
      if (!a) return null;
      return a?.athlete || a?.player || a;
    }

    function athleteName(a){
      const x = normalizeAthlete(a);
      return x?.displayName || x?.shortName || x?.fullName || x?.name || "";
    }

    function athleteHeadshot(a){
      const x = normalizeAthlete(a);
      return x?.headshot || x?.image || x?.images?.[0]?.href || x?.images?.[0]?.url || x?.photo || "";
    }

    function normalizePlayerName(name){
      return String(name || "")
        .toLowerCase()
        .replace(/\./g, "")
        .replace(/'/g, "")
        .replace(/-/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function buildWildStatusLineFromCompetition(comp){
      const status = comp?.status || {};
      const state = status?.type?.state || "";
      const shortDetail = safeText(status?.type?.shortDetail);
      const detail = safeText(status?.type?.detail);
      const clock = safeText(status?.displayClock);
      const period = ordinalPeriod(status?.period);
      const combined = `${shortDetail} ${detail}`.toUpperCase();

      if (state === "post"){
        if (combined.includes("SO") || combined.includes("SHOOTOUT")) return "FINAL • SO";
        if (combined.includes("OT") || combined.includes("OVERTIME")) return "FINAL • OT";
        return "FINAL";
      }

      if (state === "in"){
        const bits = ["LIVE"];
        if (period) bits.push(period);
        if (clock && clock !== "0:00") bits.push(clock);
        return bits.join(" • ");
      }

      return shortDetail || detail || "";
    }

    function buildGenericStatusLineFromCompetition(comp){
      const status = comp?.status || {};
      const state = status?.type?.state || "";
      const shortDetail = safeText(status?.type?.shortDetail);
      const detail = safeText(status?.type?.detail);
      const combinedUpper = `${shortDetail} ${detail}`.toUpperCase();
      const display = shortDetail || detail;

      if (state === "post"){
        if (combinedUpper.includes("SO") || combinedUpper.includes("SHOOTOUT")) return "FINAL • SO";
        if (combinedUpper.includes("OT") || combinedUpper.includes("OVERTIME")) return "FINAL • OT";
        return "FINAL";
      }

      if (state === "in"){
        return display ? `LIVE • ${display.toUpperCase()}` : "LIVE";
      }

      return display;
    }

    function buildNhlHeadshotLookupFromClubStats(data){
      const lookup = new Map();

      const skaters = Array.isArray(data?.skaters) ? data.skaters : [];
      const goalies = Array.isArray(data?.goalies) ? data.goalies : [];
      const allPlayers = [...skaters, ...goalies];

      for (const p of allPlayers){
        const first = p?.firstName?.default || "";
        const last = p?.lastName?.default || "";
        const full = `${first} ${last}`.trim();
        const shot = p?.headshot || "";

        if (full && shot){
          lookup.set(normalizePlayerName(full), shot);
        }
      }

      return lookup;
    }

    async function getNhlTeamHeadshotLookup(teamAbbr){
      if (!teamAbbr) return new Map();

      const cacheKey = `nhlHeadshots:${teamAbbr}:${NHL_SEASON_CODE}`;
      const cached = cacheGet(cacheKey);
      if (cached) return cached;

      const url = `https://api-web.nhle.com/v1/club-stats/${teamAbbr}/${NHL_SEASON_CODE}/2`;
      const data = await fetchJson(url);
      const lookup = buildNhlHeadshotLookupFromClubStats(data || {});

      cacheSet(cacheKey, lookup);
      return lookup;
    }

    function applyNhlHeadshotsToGoals(goals, wildLookup, oppLookup, wildLogo, oppLogo){
      return (goals || []).map(g => {
        const key = normalizePlayerName(g.scorer);
        const isWildGoal = !!g.teamLogo && !!wildLogo && g.teamLogo === wildLogo;
        const preferredLookup = isWildGoal ? wildLookup : oppLookup;
        const fallbackLookup = isWildGoal ? oppLookup : wildLookup;

        const betterHeadshot =
          preferredLookup?.get(key) ||
          fallbackLookup?.get(key) ||
          g.headshot ||
          "";

        return {
          ...g,
          headshot: betterHeadshot
        };
      });
    }

    function findScoringPlaysDeep(obj){
      if (!obj || typeof obj !== "object") return [];
      if (Array.isArray(obj?.scoringPlays)) return obj.scoringPlays;
      if (Array.isArray(obj?.plays)) {
        const goalLike = obj.plays.filter(p => {
          const txt = `${p?.text || ""} ${p?.type?.text || ""} ${p?.type?.displayName || ""}`.toLowerCase();
          return txt.includes("goal") || txt.includes("scores");
        });
        if (goalLike.length) return goalLike;
      }
      for (const key of Object.keys(obj)){
        const val = obj[key];
        if (val && typeof val === "object"){
          const found = findScoringPlaysDeep(val);
          if (found.length) return found;
        }
      }
      return [];
    }

    function parseWildScoringPlays(summary, fallbackWildLogo, fallbackOppLogo){
      const comp = summary?.header?.competitions?.[0] || summary?.boxscore?.game || summary?.gamepackageJSON?.header?.competitions?.[0] || null;
      const competitors = comp?.competitors || [];
      const wildComp = competitors.find(c => String(c?.team?.id) === "30");
      const oppComp = competitors.find(c => String(c?.team?.id) !== "30");

      const wildLogo = teamLogo(wildComp?.team) || fallbackWildLogo || "";
      const oppLogo = teamLogo(oppComp?.team) || fallbackOppLogo || "";

      const playsRaw = findScoringPlaysDeep(summary);
      const plays = [];

      for (const p of playsRaw){
        const text = safeText(p?.text || p?.shortText || p?.description);
        const lower = text.toLowerCase();

        if (
          lower.includes("shootout") ||
          lower.includes("goalie stopped") ||
          lower.includes("saved") ||
          lower.includes("save") ||
          lower.includes("missed") ||
          lower.includes("misses") ||
          lower.includes("penalty shot")
        ) {
          continue;
        }

        const isGoalLike = lower.includes("goal") || lower.includes("scores");
        if (!isGoalLike) continue;

        if (p?.scoreValue != null && Number(p.scoreValue) <= 0) continue;

        const athletes = Array.isArray(p?.athletesInvolved)
          ? p.athletesInvolved
          : (Array.isArray(p?.participants) ? p.participants : []);

        const scorerA = athletes.length ? normalizeAthlete(athletes[0]) : null;
        const assistsA = athletes.slice(1).map(normalizeAthlete).filter(Boolean);

        let scorer = athleteName(scorerA);
        const headshot = athleteHeadshot(scorerA);

        const playTeam = p?.team || p?.teamInfo || {};
        const playTeamId = String(playTeam?.id || p?.teamId || "");
        const playTeamLogo = teamLogo(playTeam) || (playTeamId === "30" ? wildLogo : oppLogo) || "";

        let assists = assistsA.map(athleteName).filter(Boolean);

        if (!assists.length){
          const assistMatch = text.match(/assists?:\s*(.*)$/i);
          if (assistMatch && assistMatch[1]){
            assists = assistMatch[1]
              .split(/[;,]/)
              .map(s => s.replace(/\(\d+\)/g, "").trim())
              .filter(Boolean);
          }
        }

        if (!scorer){
          let firstPart = text.split(",")[0].trim();
          firstPart = firstPart.replace(/\s+scores.*$/i, "").trim();
          firstPart = firstPart.replace(/\s+goal.*$/i, "").trim();
          scorer = firstPart || "Goal";
        }

        assists = assists
          .map(a => a.replace(/\s+scores.*$/i, "").trim())
          .filter(Boolean);

        plays.push({
          scorer,
          assists,
          teamLogo: playTeamLogo,
          headshot: headshot || "",
          sequence: Number(p?.sequenceNumber || p?.id || 0) || 0
        });
      }

      plays.sort((a,b) => a.sequence - b.sequence);
      return plays;
    }

    async function getWildLiveFinalPack(event, fallbackData){
      const cacheKey = `wildLiveFinal:${event?.id}:${event?.status?.type?.state}:${fallbackData?.myScore}:${fallbackData?.oppScore}`;
      const cached = cacheGet(cacheKey);
      if (cached) return cached;

      const summary = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/summary?event=${event?.id}`);
      const comp = summary?.header?.competitions?.[0] || event?.competitions?.[0] || {};
      const competitors = comp?.competitors || [];

      const eventComp = event?.competitions?.[0] || {};
      const eventCompetitors = eventComp?.competitors || [];

      const wildComp = competitors.find(c => String(c?.team?.id) === "30") || eventCompetitors.find(c => String(c?.team?.id) === "30");
      const oppComp  = competitors.find(c => String(c?.team?.id) !== "30") || eventCompetitors.find(c => String(c?.team?.id) !== "30");

      const wildHomeAway = wildComp?.homeAway || eventCompetitors.find(c => String(c?.team?.id) === "30")?.homeAway || "";
      const matchupSymbol = wildHomeAway === "away" ? "@" : "vs";

      const wildLogo = teamLogo(wildComp?.team) || fallbackData?.myLogo || "";
      const oppLogo = teamLogo(oppComp?.team) || fallbackData?.theirLogo || "";

      const wildScore = String(wildComp?.score ?? fallbackData?.myScore ?? "");
      const oppScore = String(oppComp?.score ?? fallbackData?.oppScore ?? "");

      const statusLine =
        buildWildStatusLineFromCompetition(comp) ||
        buildWildStatusLineFromCompetition(eventComp) ||
        statusLabel(event?.status?.type?.state);

      let goals = summary ? parseWildScoringPlays(summary, wildLogo, oppLogo) : [];

      const wildAbbr =
        wildComp?.team?.abbreviation ||
        wildComp?.team?.shortDisplayName ||
        "MIN";

      const oppAbbr =
        oppComp?.team?.abbreviation ||
        oppComp?.team?.shortDisplayName ||
        "";

      const [wildLookup, oppLookup] = await Promise.all([
        getNhlTeamHeadshotLookup(wildAbbr),
        getNhlTeamHeadshotLookup(oppAbbr)
      ]);

      goals = applyNhlHeadshotsToGoals(goals, wildLookup, oppLookup, wildLogo, oppLogo);

      const pack = {
        wildLogo,
        wildScore,
        oppLogo,
        oppScore,
        statusLine,
        goals,
        matchupSymbol
      };

      cacheSet(cacheKey, pack);
      return pack;
    }

    // ---------- Generic ESPN boxscore helpers for Wolves/Twins ----------
    function normalizeLabel(label){
      return String(label || "")
        .toUpperCase()
        .replace(/[^A-Z0-9%]/g, "");
    }

    function firstExisting(obj, keys){
      for (const k of keys){
        if (obj[k] != null && obj[k] !== "") return obj[k];
      }
      return null;
    }

    function buildStatMap(labels, stats){
      const map = {};
      (labels || []).forEach((label, i) => {
        map[normalizeLabel(label)] = stats?.[i];
      });
      return map;
    }

    function parseEspnStatNumber(v){
      if (v == null) return null;
      const s = String(v).trim();
      if (!s || s === "-" || s === "--") return null;
      const n = Number(s);
      return Number.isFinite(n) ? n : null;
    }

    function baseballIpToNumber(v){
      if (v == null) return null;
      const s = String(v).trim();
      if (!s || s === "-" || s === "--") return null;
      if (!s.includes(".")) {
        const n = Number(s);
        return Number.isFinite(n) ? n : null;
      }
      const [wholeStr, fracStr] = s.split(".");
      const whole = Number(wholeStr);
      const frac = Number(fracStr);
      if (!Number.isFinite(whole) || !Number.isFinite(frac)) return null;
      if (frac === 1) return whole + 1/3;
      if (frac === 2) return whole + 2/3;
      return whole + (frac / 10);
    }

    function extractEspnTeamBox(summary, teamId){
      const players = Array.isArray(summary?.boxscore?.players) ? summary.boxscore.players : [];
      return players.find(p => String(p?.team?.id) === String(teamId)) || null;
    }

    function extractAthleteRowsFromTeamBox(teamBox){
      const rows = [];
      const seen = new Map();

      function visit(node, inheritedLabels = null){
        if (!node) return;

        if (Array.isArray(node)){
          node.forEach(item => visit(item, inheritedLabels));
          return;
        }

        if (typeof node !== "object") return;

        const currentLabels = Array.isArray(node?.labels) ? node.labels : inheritedLabels;

        if (node?.athlete && Array.isArray(node?.stats)){
          const id = String(node.athlete?.id || node.athlete?.$ref || node.athlete?.displayName || Math.random());
          const candidate = {
            athlete: node.athlete,
            labels: currentLabels || [],
            stats: node.stats || []
          };
          const prev = seen.get(id);
          if (!prev || (candidate.labels.length + candidate.stats.length) > (prev.labels.length + prev.stats.length)){
            seen.set(id, candidate);
          }
        }

        if (Array.isArray(node?.athletes)){
          node.athletes.forEach(a => visit(a, currentLabels));
        }

        Object.values(node).forEach(v => {
          if (v && typeof v === "object") visit(v, currentLabels);
        });
      }

      visit(teamBox, null);
      seen.forEach(v => rows.push(v));
      return rows;
    }

    function getCompTeamInfo(comp, teamId){
      const competitors = comp?.competitors || [];
      const me = competitors.find(c => String(c?.team?.id) === String(teamId));
      const opp = competitors.find(c => String(c?.team?.id) !== String(teamId));
      return { me, opp };
    }

    function buildLivePackBaseFromSummary(summary, event, teamId, fallbackData, statusBuilder){
      const comp = summary?.header?.competitions?.[0] || event?.competitions?.[0] || {};
      const { me, opp } = getCompTeamInfo(comp, teamId);

      const myHomeAway = me?.homeAway || "";
      const matchupSymbol = myHomeAway === "away" ? "@" : "vs";

      return {
        comp,
        me,
        opp,
        myLogo: teamLogo(me?.team) || fallbackData?.myLogo || "",
        oppLogo: teamLogo(opp?.team) || fallbackData?.theirLogo || "",
        myScore: String(me?.score ?? fallbackData?.myScore ?? ""),
        oppScore: String(opp?.score ?? fallbackData?.oppScore ?? ""),
        statusLine: statusBuilder(comp) || statusBuilder(event?.competitions?.[0] || {}) || statusLabel(event?.status?.type?.state),
        matchupSymbol
      };
    }

    function buildWolvesPlayersFromTeamBox(teamBox, teamLogoUrl){
      const rows = extractAthleteRowsFromTeamBox(teamBox);

      return rows.map(r => {
        const statMap = buildStatMap(r.labels, r.stats);
        const pts = parseEspnStatNumber(firstExisting(statMap, ["PTS"]));
        const reb = parseEspnStatNumber(firstExisting(statMap, ["REB"]));
        const ast = parseEspnStatNumber(firstExisting(statMap, ["AST"]));

        return {
          name: athleteName(r.athlete),
          headshot: athleteHeadshot(r.athlete),
          teamLogo: teamLogoUrl,
          pts: pts ?? 0,
          reb: reb ?? 0,
          ast: ast ?? 0
        };
      })
      .filter(p => p.name && (p.pts > 0 || p.reb > 0 || p.ast > 0))
      .sort((a,b) => {
        if (b.pts !== a.pts) return b.pts - a.pts;
        if (b.reb !== a.reb) return b.reb - a.reb;
        return b.ast - a.ast;
      })
      .slice(0, 3)
      .map(p => ({
        name: p.name,
        headshot: p.headshot,
        teamLogo: p.teamLogo,
        statLine: `PTS ${p.pts} • REB ${p.reb} • AST ${p.ast}`
      }));
    }

    async function getWolvesLiveFinalPack(event, fallbackData){
      const cacheKey = `wolvesLiveFinal:${event?.id}:${event?.status?.type?.state}:${fallbackData?.myScore}:${fallbackData?.oppScore}`;
      const cached = cacheGet(cacheKey);
      if (cached) return cached;

      const summary = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=${event?.id}`);
      const base = buildLivePackBaseFromSummary(summary || {}, event, "16", fallbackData, buildGenericStatusLineFromCompetition);
      const myBox = extractEspnTeamBox(summary || {}, "16");
      const oppTeamId = String(base?.opp?.team?.id || "");
      const oppBox = extractEspnTeamBox(summary || {}, oppTeamId);

      const myRows = buildWolvesPlayersFromTeamBox(myBox, base.myLogo);
      const oppRows = buildWolvesPlayersFromTeamBox(oppBox, base.oppLogo);

      const pack = {
        teamLogo: base.myLogo,
        teamScore: base.myScore,
        oppLogo: base.oppLogo,
        oppScore: base.oppScore,
        statusLine: base.statusLine,
        matchupSymbol: base.matchupSymbol,
        title: "GAME LEADERS",
        slides: [myRows, oppRows]
      };

      cacheSet(cacheKey, pack);
      return pack;
    }

    function buildTwinsHitterRowsFromTeamBox(teamBox, teamLogoUrl){
      const rows = extractAthleteRowsFromTeamBox(teamBox);

      return rows.map(r => {
        const statMap = buildStatMap(r.labels, r.stats);
        const row = {
          name: athleteName(r.athlete),
          headshot: athleteHeadshot(r.athlete),
          teamLogo: teamLogoUrl,
          r: parseEspnStatNumber(firstExisting(statMap, ["R"])) ?? 0,
          h: parseEspnStatNumber(firstExisting(statMap, ["H"])) ?? 0,
          rbi: parseEspnStatNumber(firstExisting(statMap, ["RBI"])) ?? 0,
          hr: parseEspnStatNumber(firstExisting(statMap, ["HR"])) ?? 0,
          ip: firstExisting(statMap, ["IP"]),
          so: firstExisting(statMap, ["SO"]),
          er: firstExisting(statMap, ["ER"])
        };

        return row;
      })
      .filter(p => p.name && p.ip == null && (p.h > 0 || p.rbi > 0 || p.r > 0 || p.hr > 0))
      .sort((a,b) => {
        if (b.rbi !== a.rbi) return b.rbi - a.rbi;
        if (b.h !== a.h) return b.h - a.h;
        if (b.r !== a.r) return b.r - a.r;
        return b.hr - a.hr;
      })
      .slice(0, 2)
      .map(p => ({
        name: p.name,
        headshot: p.headshot,
        teamLogo: p.teamLogo,
        statLine: `R ${p.r} • H ${p.h} • RBI ${p.rbi} • HR ${p.hr}`
      }));
    }

    function buildTwinsPitcherRowFromTeamBox(teamBox, teamLogoUrl){
      const rows = extractAthleteRowsFromTeamBox(teamBox);

      const pitchers = rows.map(r => {
        const statMap = buildStatMap(r.labels, r.stats);
        const ipRaw = firstExisting(statMap, ["IP"]);
        const ipValue = baseballIpToNumber(ipRaw);
        const so = parseEspnStatNumber(firstExisting(statMap, ["SO"])) ?? 0;
        const er = parseEspnStatNumber(firstExisting(statMap, ["ER"])) ?? 0;

        return {
          name: athleteName(r.athlete),
          headshot: athleteHeadshot(r.athlete),
          teamLogo: teamLogoUrl,
          ipRaw: ipRaw || null,
          ipValue,
          so,
          er
        };
      })
      .filter(p => p.name && p.ipRaw != null)
      .sort((a,b) => {
        if ((b.ipValue ?? -1) !== (a.ipValue ?? -1)) return (b.ipValue ?? -1) - (a.ipValue ?? -1);
        if (b.so !== a.so) return b.so - a.so;
        return a.er - b.er;
      });

      if (!pitchers.length) return null;

      const p = pitchers[0];
      return {
        name: p.name,
        headshot: p.headshot,
        teamLogo: p.teamLogo,
        statLine: `IP ${p.ipRaw} • SO ${p.so} • ER ${p.er}`
      };
    }

    async function getTwinsLiveFinalPack(event, fallbackData){
      const cacheKey = `twinsLiveFinal:${event?.id}:${event?.status?.type?.state}:${fallbackData?.myScore}:${fallbackData?.oppScore}`;
      const cached = cacheGet(cacheKey);
      if (cached) return cached;

      const summary = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/summary?event=${event?.id}`);
      const base = buildLivePackBaseFromSummary(summary || {}, event, "9", fallbackData, buildGenericStatusLineFromCompetition);
      const myBox = extractEspnTeamBox(summary || {}, "9");
      const oppTeamId = String(base?.opp?.team?.id || "");
      const oppBox = extractEspnTeamBox(summary || {}, oppTeamId);

      const myHitters = buildTwinsHitterRowsFromTeamBox(myBox, base.myLogo);
      const myPitcher = buildTwinsPitcherRowFromTeamBox(myBox, base.myLogo);
      const oppHitters = buildTwinsHitterRowsFromTeamBox(oppBox, base.oppLogo);
      const oppPitcher = buildTwinsPitcherRowFromTeamBox(oppBox, base.oppLogo);

      const slide1 = [...myHitters];
      if (myPitcher) slide1.push(myPitcher);

      const slide2 = [...oppHitters];
      if (oppPitcher) slide2.push(oppPitcher);

      const pack = {
        teamLogo: base.myLogo,
        teamScore: base.myScore,
        oppLogo: base.oppLogo,
        oppScore: base.oppScore,
        statusLine: base.statusLine,
        matchupSymbol: base.matchupSymbol,
        title: "GAME LEADERS",
        slides: [slide1, slide2]
      };

      cacheSet(cacheKey, pack);
      return pack;
    }

    // ---------------- Wild pack ----------------
    function wildName(p){
      const fn = p?.firstName?.default || "";
      const ln = p?.lastName?.default || "";
      return (fn + " " + ln).trim() || "Unknown";
    }

    async function getWildPack(){
      const cached = cacheGet("wildPack");
      if (cached) return cached;

      const nhl = await fetchJson(NHL_WILD_CLUB_STATS_URL);
      if (!nhl) return null;

      const skaters = Array.isArray(nhl?.skaters) ? nhl.skaters : [];
      if (!skaters.length) return null;

      const topPts = [...skaters].sort((a,b)=> (b.points??0)-(a.points??0)).slice(0,3);
      const goals1 = [...skaters].sort((a,b)=> (b.goals??0)-(a.goals??0))[0];
      const ast1   = [...skaters].sort((a,b)=> (b.assists??0)-(a.assists??0))[0];

      const pack = { topPts, goals1, ast1 };
      cacheSet("wildPack", pack);
      return pack;
    }

    function buildWildSlides(pack){
      if (!pack) return [];
      const { topPts, goals1, ast1 } = pack;

      const slidePts = (topPts || []).map((p,i)=>({
        key: i===0 ? "PTS (TOP 3)" : "PTS",
        name: wildName(p),
        stat: `${p.points ?? 0}P`,
        headshot: p.headshot || ""
      }));

      const slideGA = [
        { key:"GOALS", name: wildName(goals1), stat: `${goals1?.goals ?? 0}G`, headshot: goals1?.headshot || "" },
        { key:"ASSISTS", name: wildName(ast1), stat: `${ast1?.assists ?? 0}A`, headshot: ast1?.headshot || "" }
      ];

      return [slidePts, slideGA];
    }

    // ---------------- Wolves off-day pack ----------------
    function parseNbaResultSet(data){
      const rs = data?.resultSets?.[0] || data?.resultSet;
      if (!rs) return null;
      const headers = rs.headers;
      const rows = rs.rowSet;
      if (!Array.isArray(headers) || !Array.isArray(rows)) return null;

      const idx = (h) => headers.indexOf(h);
      const iId = idx("PLAYER_ID");
      const iName = idx("PLAYER_NAME");
      const iPTS = idx("PTS");
      const iREB = idx("REB");
      const iAST = idx("AST");
      if ([iId,iName,iPTS,iREB,iAST].some(v => v < 0)) return null;

      return rows.map(r => ({
        id: r[iId],
        name: r[iName],
        pts: Number(r[iPTS]) || 0,
        reb: Number(r[iREB]) || 0,
        ast: Number(r[iAST]) || 0
      }));
    }

    function topBy(players, field){
      let best = null;
      for (const p of players) if (!best || p[field] > best[field]) best = p;
      return best;
    }

    async function getWolvesPack(){
      const cached = cacheGet("wolvesPack");
      if (cached) return cached;

      const data = await fetchJson(NBA_WOLVES_LEAGUE_DASH_URL);
      if (!data) return null;

      const players = parseNbaResultSet(data);
      if (!players || !players.length) return null;

      const topPts = [...players].sort((a,b)=>b.pts-a.pts).slice(0,3);
      const rebL = topBy(players, "reb");
      const astL = topBy(players, "ast");

      const pack = { topPts, rebL, astL };
      cacheSet("wolvesPack", pack);
      return pack;
    }

    function buildWolvesSlides(pack){
      if (!pack) return [];
      const { topPts, rebL, astL } = pack;

      const slidePts = (topPts || []).map((p,i)=>({
        key: i===0 ? "PTS (TOP 3)" : "PTS",
        name: p.name,
        stat: `${p.pts.toFixed(1)}`,
        headshot: NBA_HEADSHOT(p.id)
      }));

      const slideOther = [
        { key:"REB", name: rebL.name, stat: `${rebL.reb.toFixed(1)}`, headshot: NBA_HEADSHOT(rebL.id) },
        { key:"AST", name: astL.name, stat: `${astL.ast.toFixed(1)}`, headshot: NBA_HEADSHOT(astL.id) }
      ];

      return [slidePts, slideOther];
    }

    // ---------------- Twins off-day pack ----------------
    function fmtAvg(v){
      const n = toNum(v);
      if (n == null) return "—";
      if (n > 0 && n < 1) return n.toFixed(3).replace(/^0/, "");
      return n.toFixed(3);
    }
    function fmtEra(v){
      const n = toNum(v);
      if (n == null) return "—";
      return n.toFixed(2);
    }
    function mlbName(s){ return s?.player?.fullName || s?.player?.name || "—"; }
    function mlbId(s){ return s?.player?.id || null; }

    function topOne(splits, getter, dir="desc"){
      const mult = dir === "asc" ? 1 : -1;
      return [...splits]
        .map(x => ({ x, v: toNum(getter(x)) }))
        .filter(o => o.v != null)
        .sort((a,b) => (a.v - b.v) * mult)
        [0]?.x || null;
    }

    async function detectMlbGameType(){
      const today = new Date().toISOString().slice(0,10);
      const scheduleUrl =
        `https://statsapi.mlb.com/api/v1/schedule` +
        `?sportId=1&teamId=${MLB_TWINS_TEAM_ID}&season=${MLB_SEASON}&gameType=R` +
        `&startDate=${MLB_SEASON}-01-01&endDate=${today}`;

      const sched = await fetchJson(scheduleUrl);
      const dates = sched?.dates || [];
      const hasRegularGameAlready = dates.some(d => (d?.games || []).length > 0);

      MLB_GAME_TYPE = hasRegularGameAlready ? "R" : "S";
    }

    async function mlbTeamStats(group){
      const url =
        `https://statsapi.mlb.com/api/v1/stats` +
        `?stats=season` +
        `&group=${encodeURIComponent(group)}` +
        `&season=${encodeURIComponent(MLB_SEASON)}` +
        `&gameType=${encodeURIComponent(MLB_GAME_TYPE)}` +
        `&sportId=1` +
        `&teamId=${encodeURIComponent(MLB_TWINS_TEAM_ID)}` +
        `&playerPool=ALL`;

      const data = await fetchJson(url);
      const splits = data?.stats?.[0]?.splits;
      return Array.isArray(splits) ? splits : [];
    }

    async function getTwinsPack(){
      const cached = cacheGet("twinsPack");
      if (cached) return cached;

      await detectMlbGameType();

      let hitters = await mlbTeamStats("hitting");
      let pitchers = await mlbTeamStats("pitching");

      if ((!hitters.length && !pitchers.length) && MLB_GAME_TYPE === "R") {
        MLB_GAME_TYPE = "S";
        hitters = await mlbTeamStats("hitting");
        pitchers = await mlbTeamStats("pitching");
      }

      if (!hitters.length && !pitchers.length) return null;

      const avgTop = topOne(hitters, s => s?.stat?.avg, "desc");
      const hrTop  = topOne(hitters, s => s?.stat?.homeRuns, "desc");
      const rbiTop = topOne(hitters, s => s?.stat?.rbi, "desc");

      const eraTop = topOne(pitchers, s => s?.stat?.era, "asc");
      const soTop  = topOne(pitchers, s => s?.stat?.strikeOuts, "desc");
      const winTop = topOne(pitchers, s => s?.stat?.wins, "desc");
      const wlText = winTop ? `${winTop?.stat?.wins ?? 0}-${winTop?.stat?.losses ?? 0}` : "—";

      const pack = { avgTop, hrTop, rbiTop, eraTop, soTop, winTop, wlText };
      cacheSet("twinsPack", pack);
      return pack;
    }

    function buildTwinsSlides(pack){
      if (!pack) return [];

      const slideHitters = [
        { key:"AVG", name: mlbName(pack.avgTop), stat: fmtAvg(pack.avgTop?.stat?.avg), headshot: mlbId(pack.avgTop) ? MLB_HEADSHOT(mlbId(pack.avgTop)) : "" },
        { key:"HR",  name: mlbName(pack.hrTop),  stat: String(pack.hrTop?.stat?.homeRuns ?? "—"), headshot: mlbId(pack.hrTop) ? MLB_HEADSHOT(mlbId(pack.hrTop)) : "" },
        { key:"RBI", name: mlbName(pack.rbiTop), stat: String(pack.rbiTop?.stat?.rbi ?? "—"), headshot: mlbId(pack.rbiTop) ? MLB_HEADSHOT(mlbId(pack.rbiTop)) : "" },
      ];

      const slidePitchers = [
        { key:"ERA", name: mlbName(pack.eraTop), stat: fmtEra(pack.eraTop?.stat?.era), headshot: mlbId(pack.eraTop) ? MLB_HEADSHOT(mlbId(pack.eraTop)) : "" },
        { key:"SO",  name: mlbName(pack.soTop),  stat: String(pack.soTop?.stat?.strikeOuts ?? "—"), headshot: mlbId(pack.soTop) ? MLB_HEADSHOT(mlbId(pack.soTop)) : "" },
        { key:"W-L", name: mlbName(pack.winTop), stat: pack.wlText || "—", headshot: mlbId(pack.winTop) ? MLB_HEADSHOT(mlbId(pack.winTop)) : "" },
      ];

      return [slideHitters, slidePitchers];
    }

    async function getTwinsNextGame(){
      const cacheKey = `twinsNext:${MLB_SEASON}`;
      const cached = cacheGet(cacheKey);
      if (cached) return cached;

      const now = Date.now();
      const today = new Date().toISOString().slice(0,10);
      const endDateObj = new Date(Date.now() + 14*86400000);
      const endDate = endDateObj.toISOString().slice(0,10);

      const checkRegUrl =
        `https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=${MLB_TWINS_TEAM_ID}&season=${MLB_SEASON}` +
        `&gameType=R&startDate=${MLB_SEASON}-01-01&endDate=${today}`;

      const regCheck = await fetchJson(checkRegUrl);
      const regStarted = (regCheck?.dates || []).some(d => (d?.games || []).length > 0);

      const gameType = regStarted ? "R" : "S";

      const schedUrl =
        `https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=${MLB_TWINS_TEAM_ID}&season=${MLB_SEASON}` +
        `&gameType=${gameType}&startDate=${today}&endDate=${endDate}`;

      const sched = await fetchJson(schedUrl);
      const dates = sched?.dates || [];

      let best = null;

      for (const d of dates){
        for (const g of (d?.games || [])){
          const iso = g?.gameDate;
          const t = iso ? new Date(iso).getTime() : 0;
          if (!t || t <= now) continue;

          const teams = g?.teams || {};
          const homeTeam = teams?.home?.team;
          const awayTeam = teams?.away?.team;

          const isAway = String(awayTeam?.id) === String(MLB_TWINS_TEAM_ID);
          const oppTeam = isAway ? homeTeam : awayTeam;

          best = {
            nextIso: iso,
            nextAtOrVs: isAway ? "@" : "vs",
            nextOpponent: oppTeam?.abbreviation || oppTeam?.name || "TBD",
            nextOppLogo: oppTeam?.id ? MLB_TEAM_LOGO(oppTeam.id) : ""
          };
          break;
        }
        if (best) break;
      }

      cacheSet(cacheKey, best);
      return best;
    }

    // ---------------- ESPN event picker + opponent ----------------
    function pickBestEventForTeam(scoreboard, teamId){
      const events = (scoreboard?.events || []).filter(e =>
        e?.competitions?.[0]?.competitors?.some(c => String(c?.team?.id) === String(teamId))
      );
      if (!events.length) return null;

      const now = Date.now();
      const todayCT = ctDateKey(new Date());

      const live = events.filter(e => e?.status?.type?.state === "in");
      const preToday = events
        .filter(e => e?.status?.type?.state === "pre" && ctDateKey(e?.date) === todayCT)
        .sort((a,b) => new Date(a.date) - new Date(b.date));
      const postToday = events
        .filter(e => e?.status?.type?.state === "post" && ctDateKey(e?.date) === todayCT)
        .sort((a,b) => new Date(b.date) - new Date(a.date));
      const preFuture = events
        .filter(e => e?.status?.type?.state === "pre" && ctDateKey(e?.date) !== todayCT)
        .sort((a,b) => new Date(a.date) - new Date(b.date));

      if (live.length) return live[0];
      const nextPreToday = preToday.find(e => new Date(e.date).getTime() >= now) || preToday[0];
      if (nextPreToday) return nextPreToday;
      if (postToday.length) return postToday[0];
      if (preFuture.length) return preFuture[0];
      return events[0];
    }

    async function standingsText(teamDetails){
      const summary = teamDetails?.team?.standingSummary || teamDetails?.team?.standingsSummary || "";
      return summary ? String(summary) : "";
    }

    async function getOpponentFromEventSummary(team, eventId, myTeamId){
      if (!eventId) return null;
      const event = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/summary?event=${eventId}`);
      const comp = event?.header?.competitions?.[0];
      const competitors = comp?.competitors;
      if (!competitors || competitors.length < 2) return null;

      const me  = competitors.find(c => String(c?.team?.id) === String(myTeamId));
      const opp = competitors.find(c => String(c?.team?.id) !== String(myTeamId));
      if (!opp) return null;

      return {
        oppName: teamName(opp?.team),
        oppLogo: teamLogo(opp?.team),
        atOrVs: (me?.homeAway === "away") ? "@" : "vs"
      };
    }

    async function getTeamData(team){
      const scoreboard = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/scoreboard`);
      const event = pickBestEventForTeam(scoreboard, team.id);

      const teamDetails = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/teams/${team.id}`);
      const record = teamDetails?.team?.record?.items?.[0]?.summary || "0-0";
      const logo = teamDetails?.team?.logo || `https://a.espncdn.com/i/teamlogos/${team.league}/500/${team.id}.png`;
      const standings = await standingsText(teamDetails);

      let nextIso = null, nextAtOrVs = "vs", nextOppLogo = "", nextOpponent = "TBD";
      if (event){
        const comp = event.competitions[0];
        const me = comp.competitors.find(c => String(c?.team?.id) === String(team.id));
        const opp = comp.competitors.find(c => String(c?.team?.id) !== String(team.id));
        nextIso = event.date || null;
        nextAtOrVs = (me?.homeAway === "away") ? "@" : "vs";
        nextOppLogo = teamLogo(opp?.team);
        nextOpponent = teamName(opp?.team);
      } else {
        const next = teamDetails?.team?.nextEvent?.[0];
        nextIso = next?.date || null;
        const oppInfo = await getOpponentFromEventSummary(team, next?.id, team.id);
        nextAtOrVs = oppInfo?.atOrVs || "vs";
        nextOppLogo = oppInfo?.oppLogo || "";
        nextOpponent = oppInfo?.oppName || "TBD";
      }

      if (team.league === "mlb") {
        const twNext = await getTwinsNextGame();
        if (twNext?.nextIso) {
          nextIso = twNext.nextIso;
          nextAtOrVs = twNext.nextAtOrVs || nextAtOrVs;
          nextOppLogo = twNext.nextOppLogo || nextOppLogo;
          nextOpponent = twNext.nextOpponent || nextOpponent;
        }
      }

      const nextCountdown = nextIso ? countdownText(nextIso) : "";
      const nextTimeText = nextIso ? nextLabelAndTime(nextIso) : "TBD";
      const daysUntilNext = daysUntil(nextIso);

      const state = event?.status?.type?.state || "none";

      const showPanel = (team.league === "nhl" || team.league === "nba" || team.league === "mlb") && state !== "in";
      let pack = null;
      if (showPanel){
        if (team.league === "nhl") pack = await getWildPack();
        if (team.league === "nba") pack = await getWolvesPack();
        if (team.league === "mlb") pack = await getTwinsPack();
      }

      let myScore="", oppScore="", myLogo="", theirLogo="";
      if (event){
        const comp = event.competitions[0];
        const me = comp.competitors.find(c => String(c?.team?.id) === String(team.id));
        const opp = comp.competitors.find(c => String(c?.team?.id) !== String(team.id));
        myScore = me?.score ?? "";
        oppScore = opp?.score ?? "";
        myLogo = teamLogo(me?.team) || logo;
        theirLogo = teamLogo(opp?.team) || "";
      }

      let wildLiveFinalPack = null;
      let wolvesLiveFinalPack = null;
      let twinsLiveFinalPack = null;

      if (team.league === "nhl" && team.id === "30" && event && (state === "in" || state === "post")) {
        wildLiveFinalPack = await getWildLiveFinalPack(event, { myScore, oppScore, myLogo, theirLogo });
      }

      if (team.league === "nba" && team.id === "16" && event && (state === "in" || state === "post")) {
        wolvesLiveFinalPack = await getWolvesLiveFinalPack(event, { myScore, oppScore, myLogo, theirLogo });
      }

      if (team.league === "mlb" && team.id === "9" && event && (state === "in" || state === "post")) {
        twinsLiveFinalPack = await getTwinsLiveFinalPack(event, { myScore, oppScore, myLogo, theirLogo });
      }

      return {
        league: team.league,
        name: team.name,
        status: state,
        logo, record, standings,
        nextIso, daysUntilNext, nextAtOrVs, nextOppLogo, nextOpponent, nextCountdown, nextTimeText,
        showPanel, pack,
        myScore, oppScore, myLogo, theirLogo,
        wildLiveFinalPack,
        wolvesLiveFinalPack,
        twinsLiveFinalPack
      };
    }

    function statusLabel(state){
      if (state === "in") return "LIVE";
      if (state === "post") return "FINAL";
      if (state === "pre") return "UP NEXT";
      return "OFF DAY";
    }

    function renderNextSlide(atOrVs, oppLogo, oppName, countdown, timeText){
      const hasLogo = !!oppLogo;
      return `
        <div class="next-wrap">
          <div class="next-label">NEXT</div>
          <div class="opp-row">
            <div class="opp-text">${atOrVs}</div>
            ${hasLogo ? `<img class="opp-logo" src="${oppLogo}" alt="">`
                      : `<div class="opp-text">${oppName}</div>`}
          </div>
          ${countdown ? `<div class="countdown">${countdown}</div>` : ``}
          <div class="next-time">${timeText || "TBD"}</div>
        </div>
      `;
    }

    function renderLeaderSlide(rows){
      return `
        <div class="slide">
          ${rows.map(r => `
            <div class="leader-row">
              <div class="leader-left">
                ${r.headshot ? `<img class="headshot" src="${r.headshot}" alt="">` : `<div class="headshot"></div>`}
                <div class="leader-text">
                  <div class="leader-k">${r.key}</div>
                  <div class="leader-v">${r.name}</div>
                </div>
              </div>
              <div class="leader-stat">${r.stat || ""}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderBottomPanel(teamKey, nextSlideHtml, extraSlidesHtml, totalSlides){
      const dots = Array.from({length: totalSlides}, (_,i) =>
        `<span class="dot ${i===0?"active":""}"></span>`
      ).join("");

      return `
        <div class="panel" data-bottom-carousel="${teamKey}">
          <div class="panel-header">
            <div class="panel-title">INFO</div>
            <div class="dots">${dots}</div>
          </div>
          <div class="slides">
            <div class="slide active">${nextSlideHtml}</div>
            ${extraSlidesHtml}
          </div>
        </div>
      `;
    }

    function renderWildGoalRow(goal){
      const assistsText = goal.assists && goal.assists.length
        ? `A: ${goal.assists.join(", ")}`
        : "Unassisted";

      return `
        <div class="wild-goal-row">
          <div class="wild-goal-left">
            ${goal.headshot ? `<img class="wild-goal-headshot" src="${goal.headshot}" alt="">` : `<div class="wild-goal-headshot"></div>`}
            <div class="wild-goal-main">
              <div class="wild-goal-name-row">
                <div class="wild-goal-scorer">${goal.scorer}</div>
                ${goal.teamLogo ? `<img class="wild-goal-team-logo" src="${goal.teamLogo}" alt="">` : ``}
              </div>
              <div class="wild-goal-assists">${assistsText}</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderStatRow(row){
      return `
        <div class="wild-goal-row">
          <div class="wild-goal-left">
            ${row.headshot ? `<img class="wild-goal-headshot" src="${row.headshot}" alt="">` : `<div class="wild-goal-headshot"></div>`}
            <div class="wild-goal-main">
              <div class="wild-goal-name-row">
                <div class="wild-goal-scorer">${row.name}</div>
                ${row.teamLogo ? `<img class="wild-goal-team-logo" src="${row.teamLogo}" alt="">` : ``}
              </div>
              <div class="wild-goal-assists">${row.statLine || ""}</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderWildLiveFinalPanel(d){
      const pack = d.wildLiveFinalPack || {
        wildLogo: d.myLogo,
        wildScore: d.myScore,
        oppLogo: d.theirLogo,
        oppScore: d.oppScore,
        statusLine: statusLabel(d.status),
        goals: [],
        matchupSymbol: "vs"
      };

      const groups = pack.goals.length ? chunkArray(pack.goals, 3) : [[]];
      const dots = groups.map((_,i) => `<span class="wild-live-dot ${i===0 ? "active" : ""}"></span>`).join("");

      const slides = groups.map((group, i) => `
        <div class="wild-live-slide ${i===0 ? "active" : ""}">
          ${
            group.length
              ? group.map(renderWildGoalRow).join("")
              : `<div class="wild-no-goals">No goals yet</div>`
          }
        </div>
      `).join("");

      return `
        <div class="wild-live-wrap">
          <div class="wild-live-scoreboard">
            <div class="wild-side">
              <img class="wild-live-team-logo" src="${pack.wildLogo || d.myLogo}" alt="">
              <div class="wild-live-score">${pack.wildScore ?? d.myScore ?? ""}</div>
            </div>

            <div class="wild-live-divider">${pack.matchupSymbol || "vs"}</div>

            <div class="wild-side">
              <img class="wild-live-team-logo" src="${pack.oppLogo || d.theirLogo}" alt="">
              <div class="wild-live-score">${pack.oppScore ?? d.oppScore ?? ""}</div>
            </div>
          </div>

          <div class="wild-live-status">${pack.statusLine || statusLabel(d.status)}</div>

          <div class="wild-live-panel" data-wild-goal-carousel="${d.league}_${d.name}">
            <div class="wild-live-panel-header">
              <div class="wild-live-panel-title">SCORING SUMMARY</div>
              <div class="wild-live-dots">${dots}</div>
            </div>
            <div class="wild-live-slides">
              ${slides}
            </div>
          </div>
        </div>
      `;
    }

    function renderGenericLiveStatsPanel(pack, fallback, carouselKey){
      const slidesData = Array.isArray(pack?.slides) ? pack.slides : [[], []];
      const normalizedSlides = slidesData.map(s => Array.isArray(s) ? s : []);
      const dots = normalizedSlides.map((_, i) => `<span class="wild-live-dot ${i===0 ? "active" : ""}"></span>`).join("");

      const slides = normalizedSlides.map((rows, i) => `
        <div class="wild-live-slide ${i===0 ? "active" : ""}">
          ${
            rows.length
              ? rows.map(renderStatRow).join("")
              : `<div class="wild-no-goals">No stats yet</div>`
          }
        </div>
      `).join("");

      return `
        <div class="wild-live-wrap">
          <div class="wild-live-scoreboard">
            <div class="wild-side">
              <img class="wild-live-team-logo" src="${pack?.teamLogo || fallback.myLogo}" alt="">
              <div class="wild-live-score">${pack?.teamScore ?? fallback.myScore ?? ""}</div>
            </div>

            <div class="wild-live-divider">${pack?.matchupSymbol || "vs"}</div>

            <div class="wild-side">
              <img class="wild-live-team-logo" src="${pack?.oppLogo || fallback.theirLogo}" alt="">
              <div class="wild-live-score">${pack?.oppScore ?? fallback.oppScore ?? ""}</div>
            </div>
          </div>

          <div class="wild-live-status">${pack?.statusLine || statusLabel(fallback.status)}</div>

          <div class="wild-live-panel" data-wild-goal-carousel="${carouselKey}">
            <div class="wild-live-panel-header">
              <div class="wild-live-panel-title">${pack?.title || "GAME LEADERS"}</div>
              <div class="wild-live-dots">${dots}</div>
            </div>
            <div class="wild-live-slides">
              ${slides}
            </div>
          </div>
        </div>
      `;
    }

    function startBottomCarousels(){
      document.querySelectorAll("[data-bottom-carousel]").forEach(box => {
        if (box.dataset.running === "1") return;
        box.dataset.running = "1";

        const slides = box.querySelectorAll(".slide");
        const dots = box.querySelectorAll(".dot");
        let idx = 0;

        setInterval(() => {
          slides[idx].classList.remove("active");
          dots[idx]?.classList.remove("active");
          idx = (idx + 1) % slides.length;
          slides[idx].classList.add("active");
          dots[idx]?.classList.add("active");
        }, 15000);
      });
    }

    function startWildGoalCarousels(){
      document.querySelectorAll("[data-wild-goal-carousel]").forEach(box => {
        if (box.dataset.running === "1") return;
        box.dataset.running = "1";

        const slides = box.querySelectorAll(".wild-live-slide");
        const dots = box.querySelectorAll(".wild-live-dot");
        if (slides.length <= 1) return;

        let idx = 0;
        setInterval(() => {
          slides[idx].classList.remove("active");
          dots[idx]?.classList.remove("active");
          idx = (idx + 1) % slides.length;
          slides[idx].classList.add("active");
          dots[idx]?.classList.add("active");
        }, 12000);
      });
    }

    async function updateDashboard(){
      const container = document.getElementById("cards-container");
      const results = await Promise.all(TEAMS.map(t => getTeamData(t)));

      const visible = results.filter(d => {
        if (d.status === "in" || d.status === "post" || d.status === "pre") return true;
        if (d.league === "nfl") return d.daysUntilNext <= NFL_SHOW_WITHIN_DAYS;
        return d.daysUntilNext <= HIDE_AFTER_DAYS;
      });

      const list = visible.length ? visible : results.filter(d => d.league !== "nfl");
      document.documentElement.style.setProperty("--cols", Math.max(1, Math.min(4, list.length)));
      container.innerHTML = "";

      const scoreBlock = (d) => `
        <div class="score-row">
          <div class="score-team">
            <img class="score-logo" src="${d.myLogo}" alt="">
            <div class="score-num">${d.myScore}</div>
          </div>
          <div class="score-dash">-</div>
          <div class="score-team">
            <div class="score-num">${d.oppScore}</div>
            <img class="score-logo" src="${d.theirLogo}" alt="">
          </div>
        </div>
      `;

      list.forEach(d => {
        const card = document.createElement("div");
        card.className = "card";

        let bottomHtml = "";

        if (d.league === "nhl" && d.name === "Wild" && (d.status === "in" || d.status === "post")) {
          bottomHtml = renderWildLiveFinalPanel(d);
        } else if (d.league === "nba" && d.name === "Wolves" && (d.status === "in" || d.status === "post") && d.wolvesLiveFinalPack) {
          bottomHtml = renderGenericLiveStatsPanel(
            d.wolvesLiveFinalPack,
            { myLogo:d.myLogo, theirLogo:d.theirLogo, myScore:d.myScore, oppScore:d.oppScore, status:d.status },
            `${d.league}_${d.name}`
          );
        } else if (d.league === "mlb" && d.name === "Twins" && (d.status === "in" || d.status === "post") && d.twinsLiveFinalPack) {
          bottomHtml = renderGenericLiveStatsPanel(
            d.twinsLiveFinalPack,
            { myLogo:d.myLogo, theirLogo:d.theirLogo, myScore:d.myScore, oppScore:d.oppScore, status:d.status },
            `${d.league}_${d.name}`
          );
        } else if (d.status === "in" || d.status === "post") {
          bottomHtml = scoreBlock(d);
        } else {
          if (d.showPanel && (d.league === "nhl" || d.league === "nba" || d.league === "mlb")) {
            const nextSlide = renderNextSlide(d.nextAtOrVs, d.nextOppLogo, d.nextOpponent, d.nextCountdown, d.nextTimeText);

            let slidesArr = [];
            if (d.league === "nhl") slidesArr = buildWildSlides(d.pack);
            else if (d.league === "nba") slidesArr = buildWolvesSlides(d.pack);
            else if (d.league === "mlb") slidesArr = buildTwinsSlides(d.pack);

            const extraSlidesHtml = slidesArr.map(rows => renderLeaderSlide(rows)).join("");
            const totalSlides = 1 + slidesArr.length;
            bottomHtml = renderBottomPanel(d.league + "_" + d.name, nextSlide, extraSlidesHtml, totalSlides);
          } else {
            bottomHtml = renderNextSlide(d.nextAtOrVs, d.nextOppLogo, d.nextOpponent, d.nextCountdown, d.nextTimeText);
          }
        }

        card.innerHTML = `
          <div class="card-top">
            <div class="status-badge status-${d.status}">${statusLabel(d.status)}</div>
          </div>
          <div class="card-main">
            <img class="team-logo" src="${d.logo}" alt="${d.name}">
            <div class="name-text">${d.name}</div>
            <div class="record-text">${d.record}</div>
            ${d.standings ? `<div class="standings-line">${d.standings}</div>` : ``}
          </div>
          <div class="card-bottom">${bottomHtml}</div>
        `;
        container.appendChild(card);
      });

      startBottomCarousels();
      startWildGoalCarousels();
    }

    async function updateTicker(){
      const leagues = [
        { l:"nhl", s:"hockey" },
        { l:"nba", s:"basketball" },
        { l:"mlb", s:"baseball" }
      ];

      const ticker = document.getElementById("ticker-content");
      let allItems = [];

      const stateRank = (state) => (state === "in" ? 0 : state === "pre" ? 1 : state === "post" ? 2 : 3);

      for (const league of leagues){
        const data = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${league.s}/${league.l}/scoreboard`);
        const events = (data?.events || []).slice().sort((a,b) => {
          const ra = stateRank(a?.status?.type?.state);
          const rb = stateRank(b?.status?.type?.state);
          if (ra !== rb) return ra - rb;
          return new Date(a?.date || 0).getTime() - new Date(b?.date || 0).getTime();
        });

        events.forEach(game => {
          const comp = game.competitions[0];
          const away = comp.competitors[1], home = comp.competitors[0];
          const state = game.status.type.state;

          const awayScoreText = (state === "pre") ? "" : (away.score ?? "");
          const homeScoreText = (state === "pre") ? "" : (home.score ?? "");

          const detail = (state === "pre" && game.date)
            ? (() => {
                const d = new Date(game.date);
                const md = d.toLocaleDateString('en-US', { timeZone: CT_TZ, month:'numeric', day:'numeric' });
                const t  = d.toLocaleTimeString('en-US', { timeZone: CT_TZ, hour:'numeric', minute:'2-digit' });
                return `${md} - ${t} CT`;
              })()
            : game.status.type.shortDetail;

          allItems.push(`
            <div class="ticker-item">
              <div class="league-badge">${league.l.toUpperCase()}</div>
              <div class="ticker-logo-container"><img class="ticker-team-logo" src="${away.team.logo}" alt=""></div>
              <span>${away.team.abbreviation}${awayScoreText !== "" ? ` ${awayScoreText}` : ""}</span>
              <span style="color:#222; margin:0 15px;">@</span>
              <div class="ticker-logo-container"><img class="ticker-team-logo" src="${home.team.logo}" alt=""></div>
              <span>${home.team.abbreviation}${homeScoreText !== "" ? ` ${homeScoreText}` : ""}</span>
              <span style="margin-left:30px; color:${state === "in" ? "var(--live)" : (state === "post" ? "var(--final-gold)" : "#888")}">${detail}</span>
            </div>
          `);
        });
      }

      ticker.innerHTML = [...allItems, ...allItems].join("");
      const mover = document.querySelector(".ticker-move");
      const seconds = Math.max(120, allItems.length * 7);
      mover.style.animationDuration = `${seconds}s`;
    }

    updateDashboard();
    updateTicker();
    setInterval(updateDashboard, 60000);
    setInterval(updateTicker, 300000);
  </script>
