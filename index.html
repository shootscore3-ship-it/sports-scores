<script>
const WORKER_URL = "https://grumpys-scores-api.shootscore3.workers.dev/scores";

function teamName(t){
  return t?.abbreviation || t?.name || t?.full_name || "";
}

function formatGame(league, g){
  const home = teamName(g.home_team);
  const away = teamName(g.visitor_team || g.away_team);

  const homeScore = g.home_team_score ?? g.home_score ?? "";
  const awayScore = g.visitor_team_score ?? g.away_score ?? "";
  const status = g.status || g.game_status || "";

  if(homeScore !== "" || awayScore !== ""){
    return `${league}: ${away} ${awayScore}–${homeScore} ${home} (${status})`;
  }
  return `${league}: ${away} @ ${home} (${status})`;
}

async function refreshTicker(){
  try{
    const r = await fetch(WORKER_URL + "?t=" + Date.now());
    if(!r.ok) throw new Error("Worker HTTP " + r.status);

    const j = await r.json();
    const parts = [];

    // NHL may be 401 on free plan — this just skips it
    if(j.nhl?.data) j.nhl.data.forEach(g => parts.push(formatGame("NHL", g)));
    if(j.nba?.data) j.nba.data.forEach(g => parts.push(formatGame("NBA", g)));
    if(j.mlb?.data) j.mlb.data.forEach(g => parts.push(formatGame("MLB", g)));
    if(j.nfl?.data) j.nfl.data.forEach(g => parts.push(formatGame("NFL", g)));

    const text = parts.length ? parts.join("  •  ") : "No games today";

    document.getElementById("tickerText").textContent = text;
    document.getElementById("tickerText2").textContent = text;

  }catch(e){
    document.getElementById("tickerText").textContent = "Ticker error (worker).";
    document.getElementById("tickerText2").textContent = "Ticker error (worker).";
    console.log(e);
  }
}

refreshTicker();
setInterval(refreshTicker, 60000);
</script>
