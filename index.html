<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MN Sports Center - High Contrast Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card-bg: #111111;
            --text: #ffffff;
            --live: #ff3b3b;
            --final: #ffcc00;
            --accent: #1a1a1a;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
            flex: 1;
            box-sizing: border-box;
            max-height: calc(100vh - 215px);
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #222;
            text-align: center;
            justify-content: space-around;
        }

        .team-logo { 
            width: 170px; 
            height: 170px; 
            object-fit: contain;
            /* Added shadow to main cards too just in case */
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
        }

        .status-badge {
            font-size: 20px;
            font-weight: 900;
            padding: 6px 18px;
            border-radius: 8px;
            text-transform: uppercase;
        }
        .status-live { background: var(--live); animation: pulse 2s infinite; }
        .status-final { color: var(--final); border: 1px solid var(--final); }

        .score-container { font-size: 70px; font-weight: 900; }
        .game-info { font-size: 24px; color: #ccc; }

        /* THE 215PX TICKER WITH LOGO FIXES */
        .ticker-wrap {
            background: #000;
            height: 215px; 
            border-top: 6px solid var(--accent);
            display: flex;
            align-items: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .ticker-move {
            display: flex;
            white-space: nowrap;
            animation: ticker-scroll 100s linear infinite;
        }

        .ticker-item {
            display: flex;
            align-items: center;
            padding: 0 90px;
            font-size: 72px;
            font-weight: 800;
            border-right: 4px solid #111;
        }

        .ticker-item span { margin: 0 18px; }
        
        /* LOGO POPPER: This makes dark logos visible on black */
        .ticker-logo-container {
            background: rgba(255, 255, 255, 0.1); /* Slight light circle behind logo */
            border-radius: 50%;
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 12px;
        }

        .ticker-team-logo {
            width: 85px;
            height: 85px;
            object-fit: contain;
            /* White glow effect around the logo shape */
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.8));
        }

        .ticker-live-dot { color: var(--live); margin-right: 18px; font-size: 50px; }
        .league-label { color: #333; font-size: 44px; margin-right: 30px; font-weight: 900; }

        @keyframes ticker-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>

    <div class="dashboard" id="cards-container"></div>

    <div class="ticker-wrap">
        <div class="ticker-move" id="ticker-content">
            <div class="ticker-item">REFRESHING FEED...</div>
        </div>
    </div>

    <script>
        const workerUrl = "https://grumpys-scores-api.shootscore3.workers.dev/?url=";
        const TEAMS = [
            { id: "30", sport: "hockey", league: "nhl", name: "Wild" },
            { id: "16", sport: "basketball", league: "nba", name: "Timberwolves" },
            { id: "9", sport: "baseball", league: "mlb", name: "Twins" },
            { id: "16", sport: "football", league: "nfl", name: "Vikings" }
        ];

        async function fetchJson(url) {
            try {
                const response = await fetch(workerUrl + encodeURIComponent(url.replace('site.web.api', 'site.api')));
                return await response.json();
            } catch (e) { return null; }
        }

        async function getTeamData(team) {
            const scoreboard = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/scoreboard`);
            let game = scoreboard?.events?.find(e => e.competitions[0].competitors.some(c => c.team.id === team.id));
            const teamData = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/teams/${team.id}`);
            let record = teamData?.team?.record?.items?.[0]?.summary || "0-0";

            if (game) {
                const me = game.competitions[0].competitors.find(c => c.team.id === team.id);
                const opp = game.competitions[0].competitors.find(c => c.team.id !== team.id);
                return { status: game.status.type.state, detail: game.status.type.shortDetail, myScore: me.score, oppScore: opp.score, opponent: opp.team.shortDisplayName, logo: me.team.logo, record: record };
            } else {
                const next = teamData?.team?.nextEvent?.[0];
                return { status: 'none', record: record, logo: `https://a.espncdn.com/i/teamlogos/${team.league}/500/${team.id}.png`, nextOpponent: next?.shortName || "Check Schedule", nextTime: next?.date ? new Date(next.date).toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}) : "TBD" };
            }
        }

        async function updateDashboard() {
            const container = document.getElementById('cards-container');
            const teamResults = await Promise.all(TEAMS.map(team => getTeamData(team)));
            container.innerHTML = ''; 
            teamResults.forEach((data, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div class="status-badge status-${data.status}">${data.status === 'in' ? 'LIVE' : (data.status === 'post' ? 'FINAL' : 'OFF DAY')}</div>
                    <img class="team-logo" src="${data.logo}">
                    <div><div style="font-size:32px; font-weight:900;">${TEAMS[index].name}</div><div style="color:#888;">${data.record}</div></div>
                    ${data.status !== 'none' ? `<div class="score-container">${data.myScore}-${data.oppScore}</div><div>${data.detail}</div>` : `<div><div style="color:#444; font-size:12px; letter-spacing:2px;">NEXT</div><div style="font-weight:900;">${data.nextOpponent}</div><div>${data.nextTime}</div></div>`}`;
                container.appendChild(card);
            });
        }

        async function updateTicker() {
            const leagues = [{l:'nhl', s:'hockey'}, {l:'nba', s:'basketball'}, {l:'mlb', s:'baseball'}];
            const ticker = document.getElementById('ticker-content');
            let allItems = [];

            for (const league of leagues) {
                const data = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${league.s}/${league.l}/scoreboard`);
                data?.events?.forEach(game => {
                    const comp = game.competitions[0];
                    const away = comp.competitors[1], home = comp.competitors[0];
                    allItems.push(`
                        <div class="ticker-item">
                            ${game.status.type.state === 'in' ? '<span class="ticker-live-dot">●</span>' : ''}
                            <span class="league-label">${league.l.toUpperCase()}</span>
                            <div class="ticker-logo-container"><img class="ticker-team-logo" src="${away.team.logo}"></div>
                            <span>${away.team.abbreviation} ${away.score || ''}</span>
                            <span style="color:#1a1a1a;">@</span>
                            <div class="ticker-logo-container"><img class="ticker-team-logo" src="${home.team.logo}"></div>
                            <span>${home.team.abbreviation} ${home.score || ''}</span>
                            <span style="color: ${game.status.type.state === 'in' ? 'var(--live)' : '#444'}; font-size:48px;">${game.status.type.shortDetail}</span>
                        </div>
                    `);
                });
            }
            ticker.innerHTML = [...allItems, ...allItems].join('');
        }

        updateDashboard(); updateTicker();
        setInterval(updateDashboard, 60000); 
        setInterval(updateTicker, 300000);
    </script>
</body>
</html>
