<script>
    const workerUrl = "https://grumpys-scores-api.shootscore3.workers.dev/?url=";
    
    const TEAMS = [
        { id: "30", sport: "hockey", league: "nhl", name: "Wild" },
        { id: "16", sport: "basketball", league: "nba", name: "Wolves" },
        { id: "9", sport: "baseball", league: "mlb", name: "Twins" },
        { id: "16", sport: "football", league: "nfl", name: "Vikings" }
    ];

    async function fetchJson(url) {
        try {
            const response = await fetch(workerUrl + encodeURIComponent(url));
            if (!response.ok) return null;
            return await response.json();
        } catch (e) { 
            console.error("Fetch failed", e);
            return null; 
        }
    }

    async function getTeamLeader(team) {
        try {
            const url = `https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/teams/${team.id}`;
            const data = await fetchJson(url);
            
            // Look for the "Leaders" section first
            const leaderCategory = data?.team?.leaders?.[0];
            const topAthlete = leaderCategory?.leaders?.[0];

            if (topAthlete && topAthlete.athlete) {
                return {
                    label: `${topAthlete.athlete.shortName} (${leaderCategory.displayName})`,
                    value: topAthlete.displayValue
                };
            }
            
            // Fallback: If no leaders (like off-season), show record detail
            return { label: "Current Status", value: "Roster Active" };
        } catch (e) { 
            return { label: "Stats", value: "Updating..." }; 
        }
    }

    async function getTeamData(team) {
        try {
            const scoreboard = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/scoreboard`);
            let game = scoreboard?.events?.find(e => e.competitions[0].competitors.some(c => c.team.id === team.id));
            const teamDetails = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/teams/${team.id}`);
            
            let record = teamDetails?.team?.record?.items?.[0]?.summary || "0-0";
            let logo = teamDetails?.team?.logo || `https://a.espncdn.com/i/teamlogos/${team.league}/500/${team.id}.png`;
            
            if (game) {
                const comp = game.competitions[0];
                const me = comp.competitors.find(c => c.team.id === team.id);
                const opp = comp.competitors.find(c => c.team.id !== team.id);
                return { status: game.status.type.state, detail: game.status.type.shortDetail, myScore: me.score, oppScore: opp.score, logo: logo, record: record };
            } else {
                const next = teamDetails?.team?.nextEvent?.[0];
                return { status: 'none', record: record, logo: logo, nextOpponent: next?.shortName || "TBD", nextTime: next?.date ? new Date(next.date).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : "TBD" };
            }
        } catch (e) {
            return { status: 'none', record: "---", logo: "", nextOpponent: "Error Loading", nextTime: "" };
        }
    }

    async function updateDashboard() {
        const container = document.getElementById('cards-container');
        if (!container) return;

        // Fetch everything, but handle errors so one team doesn't kill the whole app
        const results = await Promise.allSettled(TEAMS.map(t => getTeamData(t)));
        const leaders = await Promise.allSettled(TEAMS.map(t => getTeamLeader(t)));

        container.innerHTML = ''; 
        
        TEAMS.forEach((team, index) => {
            const data = results[index].status === 'fulfilled' ? results[index].value : { status: 'none', record: 'N/A' };
            const leader = leaders[index].status === 'fulfilled' ? leaders[index].value : { label: 'Stat', value: '---' };
            
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="status-badge status-${data.status}">${data.status === 'in' ? 'LIVE' : (data.status === 'post' ? 'FINAL' : 'OFF DAY')}</div>
                <img class="team-logo" src="${data.logo || ''}">
                <div><div style="font-size:32px; font-weight:900;">${team.name}</div><div style="color:#888;">${data.record}</div></div>
                <div class="stat-box">
                    <div class="stat-label">${leader.label}</div>
                    <div class="stat-value">${leader.value}</div>
                </div>
                ${data.status !== 'none' ? `<div style="font-size:56px; font-weight:900;">${data.myScore}-${data.oppScore}</div><div>${data.detail}</div>` : `<div><div style="color:#444; font-size:12px; font-weight:900;">NEXT</div><div style="font-size:24px; font-weight:900;">${data.nextOpponent}</div><div>${data.nextTime}</div></div>`}`;
            container.appendChild(card);
        });
    }

    async function updateTicker() {
        try {
            const leagues = [{l:'nhl', s:'hockey'}, {l:'nba', s:'basketball'}, {l:'mlb', s:'baseball'}];
            const ticker = document.getElementById('ticker-content');
            if (!ticker) return;
            
            let allItems = [];
            for (const league of leagues) {
                const data = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${league.s}/${league.l}/scoreboard`);
                data?.events?.forEach(game => {
                    const comp = game.competitions[0];
                    const away = comp.competitors[1], home = comp.competitors[0];
                    allItems.push(`
                        <div class="ticker-item">
                            <div class="league-badge">${league.l.toUpperCase()}</div>
                            <span>${away.team.abbreviation} ${away.score || ''} @ ${home.team.abbreviation} ${home.score || ''}</span>
                            <span style="margin-left:30px; color:#555">${game.status.type.shortDetail}</span>
                        </div>
                    `);
                });
            }
            ticker.innerHTML = [...allItems, ...allItems].join('');
        } catch (e) { console.error("Ticker error", e); }
    }

    // Initial Start
    updateDashboard(); 
    updateTicker();
    
    // Refresh intervals
    setInterval(updateDashboard, 60000); 
    setInterval(updateTicker, 300000);
</script>
