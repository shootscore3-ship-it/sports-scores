<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MN Sports Center - 2026 Pro Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#050505; --card-bg:#111111; --text:#ffffff;
      --live:#ff3b3b; --final-gold:#D4AF37; --accent:#1a1a1a;
      --cols: 4;
    }

    body{
      margin:0; background:var(--bg); color:var(--text);
      font-family:'Inter',sans-serif; width:100vw; height:100vh;
      overflow:hidden; display:flex; flex-direction:column;
      cursor:none; user-select:none;
    }

    .app-header{
      height:64px; flex:0 0 64px; box-sizing:border-box;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 24px; border-bottom:1px solid #242424;
      background:linear-gradient(90deg,#0b0b0b,#151515);
    }
    .brand{ display:flex; align-items:center; gap:13px; }
    .brand-mark{ width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:#fff; color:#080808; font-weight:900; }
    .brand-title{ font-size:20px; font-weight:900; letter-spacing:.3px; }
    .brand-sub{ color:#777; font-size:11px; font-weight:900; letter-spacing:1.3px; text-transform:uppercase; margin-top:2px; }
    .header-right{ display:flex; align-items:center; gap:18px; }
    .rotation-status{ color:#8d8d8d; font-size:12px; font-weight:900; letter-spacing:.8px; text-transform:uppercase; }
    .rotation-status strong{ color:#fff; }
    .header-clock{ font-size:18px; font-weight:900; min-width:118px; text-align:right; }
    .data-health{ display:flex; align-items:center; gap:7px; color:#777; font-size:10px; font-weight:900; letter-spacing:.7px; text-transform:uppercase; }
    .health-dot{ width:9px; height:9px; border-radius:50%; background:#48c774; box-shadow:0 0 10px rgba(72,199,116,.65); }
    .data-health.degraded .health-dot{ background:#ffb020; box-shadow:0 0 10px rgba(255,176,32,.65); }

    .dashboard{
      display:grid;
      grid-template-columns:repeat(var(--cols), 1fr);
      gap:20px;
      padding:20px;
      flex:1;
      box-sizing:border-box;
      max-height:calc(100vh - 279px);
      transition:grid-template-columns .7s cubic-bezier(.2,.8,.2,1);
    }

    .dashboard.focus-mode{
      grid-template-columns:minmax(0,2.2fr) minmax(360px,.8fr);
      grid-template-rows:repeat(3,minmax(0,1fr));
    }

    .card{
      background:var(--card-bg);
      border-radius:20px;
      padding:24px;
      border:2px solid #222;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      box-sizing:border-box;
      min-height:0;
      overflow:hidden;
      transition:all .7s cubic-bezier(.2,.8,.2,1), border-color .25s ease, box-shadow .25s ease;
    }
    .card.is-featured{ grid-row:1 / 4; align-items:stretch; text-align:left; padding:26px 30px; border-color:var(--team-color,#555); box-shadow:0 0 38px color-mix(in srgb,var(--team-color,#555) 28%,transparent); }
    .team-watermark{ position:absolute; right:4%; bottom:4%; width:390px; height:390px; object-fit:contain; opacity:.025; filter:grayscale(1); pointer-events:none; }
    .card.is-compact .team-watermark{ display:none; }
    .card.is-featured .card-top{ justify-content:space-between; align-items:center; }
    .card.is-featured .card-main{ flex-direction:row; justify-content:flex-start; gap:20px; margin:10px 0 4px; }
    .card.is-featured .team-logo{ width:132px; height:132px; }
    .card.is-featured .team-identity{ text-align:left; }
    .card.is-featured .name-text{ font-size:42px; }
    .card.is-featured .card-bottom{ padding-top:8px; margin-top:0; }
    .card.is-compact{ grid-column:2; position:relative; flex-direction:row; text-align:left; padding:18px 20px; gap:14px; }
    .card.is-compact .card-top{ position:absolute; left:20px; top:18px; width:auto; z-index:2; }
    .card.is-compact .status-badge{ font-size:13px; padding:8px 10px; }
    .card.is-compact .game-meta{ display:none; }
    .card.is-compact .card-main{ flex-direction:row; flex:1; justify-content:center; gap:14px; min-width:0; }
    .card.is-compact .team-logo{ width:98px; height:98px; flex:0 0 auto; }
    .card.is-compact .team-identity{ text-align:left; min-width:0; }
    .card.is-compact .feature-label{ font-size:14px; letter-spacing:1.1px; }
    .card.is-compact .name-text{ font-size:30px; line-height:1.02; }
    .card.is-compact .record-text,.card.is-compact .standings-line{ font-size:16px; line-height:1.18; }
    .card.is-compact.has-compact-score .standings-line{ display:none; }
    .card.is-compact.has-compact-score .card-main{ justify-content:flex-start; }
    .card.is-compact.has-compact-score .team-logo{ width:90px; height:90px; }
    .card.is-compact.has-compact-score .name-text{ font-size:28px; white-space:nowrap; }
    .card.is-compact .card-bottom,.card.is-compact .feature-extras{ display:none; }
    .compact-score{ display:none; }
    .card.is-compact .compact-score{ margin-left:auto; transform:translateY(14px); display:flex; flex-direction:column; align-items:flex-end; justify-content:center; gap:6px; min-width:118px; font-size:30px; font-weight:900; color:#fff; }
    .compact-score-row{ display:flex; align-items:center; justify-content:flex-end; gap:5px; }
    .compact-score-logo{ width:44px; height:44px; object-fit:contain; }
    .compact-score-sep{ color:#555; font-size:20px; }
    .compact-game-detail{ color:#aaa; font-size:13px; font-weight:900; text-transform:uppercase; text-align:right; max-width:128px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .feature-label{ color:#666; font-size:11px; font-weight:900; letter-spacing:1.4px; text-transform:uppercase; }
    .feature-extras{ display:grid; grid-template-columns:1.05fr .95fr; gap:20px; min-height:0; margin-top:8px; flex:1; }
    .feature-section{ height:100%; background:rgba(255,255,255,.025); border:1px solid rgba(255,255,255,.07); border-radius:16px; padding:18px 20px; min-width:0; overflow:hidden; box-sizing:border-box; }
    .feature-section-title{ color:#777; font-size:13px; font-weight:900; letter-spacing:1.2px; text-transform:uppercase; margin-bottom:11px; }
    .feature-section > .card-bottom{ height:calc(100% - 34px); padding-top:0; display:flex; min-height:0; }
    .headline{ padding:14px 0; border-top:1px solid rgba(255,255,255,.07); display:flex; align-items:center; gap:16px; min-height:88px; box-sizing:border-box; }
    .headline:first-of-type{ border-top:0; padding-top:0; }
    .headline-thumb{ width:118px; height:76px; flex:0 0 118px; border-radius:10px; object-fit:cover; background:#222; border:1px solid rgba(255,255,255,.10); }
    .headline-copy{ min-width:0; }
    .headline-title{ font-size:19px; line-height:1.18; font-weight:900; }
    .headline-meta{ margin-top:7px; color:#858585; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; }
    .division-standings{ display:flex; flex-direction:column; min-height:0; }
    .standings-heading{ display:grid; grid-template-columns:32px 44px minmax(0,1fr) 86px 66px; align-items:center; gap:10px; padding:0 9px 8px; color:#777; font-size:11px; font-weight:900; letter-spacing:.8px; text-transform:uppercase; }
    .standings-heading span:nth-last-child(-n+2){ text-align:right; }
    .division-row{ display:grid; grid-template-columns:32px 44px minmax(0,1fr) 86px 66px; align-items:center; gap:10px; min-height:48px; padding:5px 9px; border-top:1px solid rgba(255,255,255,.07); border-radius:9px; box-sizing:border-box; }
    .division-row.is-minnesota{ background:color-mix(in srgb,var(--team-color,#fff) 18%,transparent); border-top-color:color-mix(in srgb,var(--team-color,#fff) 55%,#333); }
    .division-rank{ color:#888; font-size:15px; font-weight:900; text-align:center; }
    .division-logo{ width:39px; height:39px; object-fit:contain; }
    .division-name{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:17px; font-weight:900; }
    .division-record,.division-value{ text-align:right; white-space:nowrap; font-size:15px; font-weight:900; }
    .division-record{ color:#aaa; }
    .division-value{ color:#fff; }
    .standings-empty{ display:grid; place-items:center; min-height:190px; color:#777; text-align:center; font-size:15px; font-weight:900; }
    .context-slide{ height:100%; display:flex; flex-direction:column; justify-content:center; gap:13px; }
    .context-title{ color:#888; font-size:14px; font-weight:900; letter-spacing:1.1px; text-transform:uppercase; }
    .context-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .context-stat{ padding:15px; border-radius:12px; background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.08); }
    .context-k{ color:#777; font-size:11px; font-weight:900; letter-spacing:.7px; text-transform:uppercase; }
    .context-v{ margin-top:5px; color:#fff; font-size:22px; line-height:1.1; font-weight:900; }
    .update-row{ display:flex; align-items:center; gap:13px; min-height:72px; padding:8px 0; border-top:1px solid rgba(255,255,255,.07); }
    .update-row:first-of-type{ border-top:0; }
    .update-thumb{ width:92px; height:62px; border-radius:9px; object-fit:cover; background:#222; }
    .update-text{ font-size:17px; line-height:1.18; font-weight:900; }
    .calendar-row{ display:grid; grid-template-columns:42px 74px minmax(0,1fr) 135px; align-items:center; gap:10px; padding:10px 0; border-top:1px solid rgba(255,255,255,.07); }
    .calendar-row:first-of-type{ border-top:0; }
    .calendar-logo{ width:38px; height:38px; object-fit:contain; }
    .calendar-team{ font-size:16px; font-weight:900; }
    .calendar-matchup{ color:#aaa; font-size:15px; font-weight:900; }
    .calendar-time{ text-align:right; color:#fff; font-size:14px; font-weight:900; }
    .pregame-panel,.postgame-panel{ height:100%; display:flex; flex-direction:column; justify-content:center; gap:14px; }
    .mode-kicker{ color:var(--team-color,#fff); font-size:13px; font-weight:900; letter-spacing:1.3px; text-transform:uppercase; }
    .mode-title{ font-size:30px; line-height:1.05; font-weight:900; }
    .mode-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .mode-item{ padding:14px; border-radius:12px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); }
    .mode-item-k{ color:#777; font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:.7px; }
    .mode-item-v{ margin-top:5px; color:#fff; font-size:18px; font-weight:900; }
    .breaking-alert{ position:fixed; inset:0; z-index:19; display:grid; place-items:center; background:rgba(0,0,0,.78); opacity:0; visibility:hidden; transition:opacity .35s; }
    .breaking-alert.show{ opacity:1; visibility:visible; }
    .breaking-card{ width:min(980px,82vw); display:grid; grid-template-columns:320px 1fr; overflow:hidden; border-radius:24px; border:3px solid var(--breaking-color,#fff); background:#111; box-shadow:0 0 70px color-mix(in srgb,var(--breaking-color,#fff) 45%,transparent); }
    .breaking-image{ width:320px; height:250px; object-fit:cover; background:#222; }
    .breaking-copy{ padding:32px; display:flex; flex-direction:column; justify-content:center; }
    .breaking-kicker{ color:var(--breaking-color,#fff); font-size:16px; font-weight:900; letter-spacing:2px; text-transform:uppercase; }
    .breaking-title{ margin-top:10px; color:#fff; font-size:36px; line-height:1.08; font-weight:900; }
    .idle-info-rotator{ position:relative; height:100%; min-height:0; }
    .idle-info-slide{ position:absolute; inset:0; opacity:0; visibility:hidden; }
    .card.is-featured .idle-info-slide.standings-slide{ animation:idle-standings 45s steps(1,end) infinite; }
    .card.is-featured .idle-info-slide.headlines-slide{ animation:idle-headlines 45s steps(1,end) infinite; }
    .idle-slide-label{ color:#888; font-size:13px; font-weight:900; letter-spacing:1.2px; text-transform:uppercase; margin-bottom:13px; }
    .game-meta{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-left:auto; justify-content:flex-end; }
    .meta-pill{ color:#aaa; border:1px solid #333; background:#161616; border-radius:999px; padding:7px 10px; font-size:11px; font-weight:900; }
    .network-logos{ display:flex; align-items:center; gap:7px; }
    .network-mark{ min-width:42px; height:25px; padding:0 8px; border-radius:6px; display:inline-grid; place-items:center; background:#f5f5f5; color:#111; font-size:11px; font-weight:900; font-style:italic; box-sizing:border-box; }
    .network-mark.espn{ background:#e31b23; color:#fff; }
    .network-mark.fox{ background:#053c75; color:#fff; }
    .network-mark.nbc{ background:linear-gradient(135deg,#f7c800,#e94040,#7047eb); color:#fff; }
    .network-mark.cbs{ background:#1769aa; color:#fff; }
    .network-mark.abc{ border-radius:50%; min-width:27px; width:27px; padding:0; background:#050505; color:#fff; border:1px solid #555; }
    .live-visual{ height:calc(100% - 30px); min-height:0; display:flex; flex-direction:column; gap:9px; overflow:hidden; }
    .live-last-play{ min-height:38px; color:#e8e8e8; font-size:16px; line-height:1.25; font-weight:900; }
    .live-subline{ color:#777; font-size:11px; font-weight:900; letter-spacing:.8px; text-transform:uppercase; }
    .live-stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:auto; padding:2px 0 4px; flex:0 0 auto; }
    .live-stat{ background:#101010; border:1px solid #2a2a2a; border-radius:10px; padding:8px; text-align:center; }
    .live-stat-k{ color:#707070; font-size:9px; font-weight:900; text-transform:uppercase; letter-spacing:.6px; }
    .live-stat-v{ color:#fff; font-size:19px; font-weight:900; margin-top:3px; }
    .baseball-diamond{ position:relative; width:164px; height:164px; margin:0 auto; flex:0 0 auto; }
    .baseball-infield{ position:absolute; width:112px; height:112px; left:50%; top:50%; transform:translate(-50%,-50%) rotate(45deg); border:3px solid #835f38; background:radial-gradient(circle at 50% 50%,#3d792f 0 42%,#78542e 43% 49%,#347029 50%); border-radius:10px; box-shadow:inset 0 0 0 8px rgba(255,255,255,.025); }
    .base{ position:absolute; width:24px; height:24px; background:#f3f3e8; border:3px solid #a8a897; border-radius:3px; box-sizing:border-box; }
    .base.on{ background:#ffd24a; border-color:#fff1a1; box-shadow:0 0 18px #ffc400; animation:base-pulse 1.4s ease-in-out infinite; }
    .base.first{ right:10px; top:calc(50% - 12px); }.base.second{ top:8px; left:calc(50% - 12px); }.base.third{ left:10px; top:calc(50% - 12px); }.base.home{ bottom:8px; left:calc(50% - 12px); transform:rotate(45deg); }
    .count-board{ display:flex; justify-content:center; gap:16px; color:#aaa; font-size:12px; font-weight:900; text-transform:uppercase; }
    .count-board strong{ color:#fff; font-size:18px; margin-left:4px; }
    .outs{ display:flex; gap:5px; align-items:center; }.out-dot{ width:10px; height:10px; border-radius:50%; background:#353535; }.out-dot.on{ background:#ff3b3b; box-shadow:0 0 9px #ff3b3b; }
    .football-field{ height:132px; flex:0 0 132px; position:relative; overflow:hidden; border:2px solid #e8e2c9; border-radius:10px; background:repeating-linear-gradient(90deg,#245b2a 0,#245b2a calc(10% - 2px),rgba(255,255,255,.32) calc(10% - 1px),rgba(255,255,255,.32) 10%); }
    .football-field::before,.football-field::after{ content:"END ZONE"; position:absolute; top:0; bottom:0; width:9%; display:grid; place-items:center; writing-mode:vertical-rl; color:rgba(255,255,255,.55); font-size:10px; font-weight:900; letter-spacing:2px; background:color-mix(in srgb,var(--team-color) 62%,#111); }
    .football-field::before{ left:0; }.football-field::after{ right:0; }
    .yard-numbers{ position:absolute; inset:0 10%; display:flex; align-items:center; justify-content:space-around; color:rgba(255,255,255,.45); font-size:10px; font-weight:900; }
    .ball-marker{ position:absolute; top:50%; left:var(--ball-pos,50%); transform:translate(-50%,-50%); width:30px; height:19px; border-radius:60% 60% 60% 60%; background:#8b4c25; border:2px solid #e8c596; box-shadow:0 0 18px rgba(255,255,255,.7); transition:left .8s ease; z-index:2; }
    .ball-marker::after{ content:""; position:absolute; width:13px; border-top:2px solid #fff; left:7px; top:7px; }
    .hockey-rink{ height:132px; flex:0 0 132px; position:relative; overflow:hidden; border:4px solid #d8d8d8; border-radius:48px; background:#e9f3f5; }
    .hockey-rink::before{ content:""; position:absolute; left:50%; top:0; bottom:0; border-left:4px solid #d54848; box-shadow:-98px 0 0 -1px #416ab0,98px 0 0 -1px #416ab0; }
    .rink-circle{ position:absolute; width:39px; height:39px; border:2px solid #d54848; border-radius:50%; }.rink-circle.a{left:18%;top:16px}.rink-circle.b{left:18%;bottom:16px}.rink-circle.c{right:18%;top:16px}.rink-circle.d{right:18%;bottom:16px}
    .rink-puck{ position:absolute; width:13px; height:13px; border-radius:50%; background:#050505; left:var(--puck-x,50%); top:var(--puck-y,50%); box-shadow:0 0 0 7px rgba(255,59,59,.26); animation:puck-pulse 1.5s ease-in-out infinite; transition:left .8s,top .8s; }
    .basketball-court{ height:132px; flex:0 0 132px; position:relative; overflow:hidden; border:3px solid #d8b27a; border-radius:8px; background:#b97b43; box-shadow:inset 0 0 0 2px rgba(255,255,255,.2); }
    .basketball-court::before{ content:""; position:absolute; left:50%; top:0; bottom:0; border-left:3px solid rgba(255,255,255,.65); }
    .basketball-court::after{ content:""; position:absolute; width:70px; height:70px; border:3px solid rgba(255,255,255,.65); border-radius:50%; left:50%; top:50%; transform:translate(-50%,-50%); }
    .court-key{ position:absolute; top:34px; width:65px; height:78px; border:3px solid rgba(255,255,255,.62); }.court-key.left{left:-3px}.court-key.right{right:-3px}
    .scoring-alert{ position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.76); opacity:0; pointer-events:none; overflow:hidden; transition:opacity .35s ease; }
    .scoring-alert.show{ opacity:1; }
    .celebration-beams{ position:absolute; inset:-35%; background:repeating-conic-gradient(from 0deg,transparent 0 13deg,color-mix(in srgb,var(--alert-color,#fff) 18%,transparent) 14deg 19deg,transparent 20deg 43deg); opacity:0; transform:scale(.6) rotate(0); }
    .scoring-alert.show .celebration-beams{ opacity:1; animation:beam-spin 7s linear infinite,beam-breathe 1.1s ease-in-out infinite alternate; }
    .goal-beacon{ position:absolute; z-index:3; top:-54px; left:-38px; width:76px; height:76px; border-radius:16px 16px 29px 29px; background:linear-gradient(90deg,#8a0000,#ff3b3b 42%,#fff 50%,#ff3b3b 58%,#8a0000); border:5px solid #4a4a4a; box-shadow:0 0 20px #ff2424,0 0 55px #ff2424,0 0 90px rgba(255,36,36,.55); opacity:0; }
    .goal-beacon::before{ content:""; position:absolute; left:-12px; right:-12px; bottom:-15px; height:18px; border-radius:5px; background:#858585; border:3px solid #333; }
    .scoring-alert.show .goal-beacon{ opacity:1; animation:beacon-spin .62s linear infinite,beacon-flash .42s ease-in-out infinite alternate; }
    .scoring-alert-card{ position:relative; width:min(880px,78vw); padding:32px 42px; display:flex; align-items:center; gap:28px; border-radius:26px; border:3px solid var(--alert-color,#fff); background:linear-gradient(120deg,#0d0d0d 0%,#161616 52%,color-mix(in srgb,var(--alert-color,#fff) 13%,#101010) 100%); box-shadow:0 0 70px color-mix(in srgb,var(--alert-color,#fff) 45%,transparent); transform:scale(.82) translateY(35px); transition:transform .55s cubic-bezier(.15,1,.25,1.18); overflow:visible; }
    .scoring-alert.show .scoring-alert-card{ transform:scale(1); }
    .alert-headshot-wrap{ position:relative; flex:0 0 auto; }
    .alert-headshot-wrap::before,.alert-headshot-wrap::after{ content:""; position:absolute; inset:-13px; border:3px solid var(--alert-color,#fff); border-radius:50%; opacity:.55; }
    .alert-headshot-wrap::after{ inset:-25px; opacity:.22; }
    .scoring-alert.show .alert-headshot-wrap::before{ animation:headshot-ring 1.2s ease-out infinite; }
    .scoring-alert.show .alert-headshot-wrap::after{ animation:headshot-ring 1.2s .35s ease-out infinite; }
    .alert-headshot{ position:relative; z-index:1; width:215px; height:215px; object-fit:cover; border-radius:50%; background:#222; border:3px solid rgba(255,255,255,.3); }
    .alert-copy{ position:relative; z-index:1; }
    .alert-kicker{ color:var(--alert-color,#fff); font-size:18px; font-weight:900; letter-spacing:2px; text-transform:uppercase; }
    .alert-title{ color:#fff; font-size:48px; line-height:1; font-weight:900; margin-top:8px; }
    .alert-score{ display:inline-block; color:#fff; font-size:25px; font-weight:900; margin-top:14px; padding:7px 14px; border-radius:999px; background:color-mix(in srgb,var(--alert-color,#fff) 25%,#151515); border:1px solid color-mix(in srgb,var(--alert-color,#fff) 65%,transparent); }
    @keyframes base-pulse{50%{transform:scale(1.15)}}
    @keyframes puck-pulse{50%{box-shadow:0 0 0 13px rgba(255,59,59,.08)}}
    @keyframes beam-spin{to{transform:scale(.9) rotate(360deg)}}
    @keyframes beam-breathe{to{opacity:.48}}
    @keyframes beacon-spin{to{filter:hue-rotate(12deg);background-position:84px 0}}
    @keyframes beacon-flash{to{box-shadow:0 0 32px #ff2424,0 0 95px #ff2424,0 0 160px rgba(255,36,36,.85)}}

<body>
  <div class="breaking-alert" id="breaking-alert"><div class="breaking-card"><img class="breaking-image" id="breaking-image" alt=""><div class="breaking-copy"><div class="breaking-kicker" id="breaking-kicker"></div><div class="breaking-title" id="breaking-title"></div></div></div></div>
  <div class="scoring-alert" id="scoring-alert"><div class="celebration-beams"></div><div class="scoring-alert-card"><div class="goal-beacon"></div><div class="alert-headshot-wrap"><img class="alert-headshot" id="alert-headshot" alt=""></div><div class="alert-copy"><div class="alert-kicker" id="alert-kicker"></div><div class="alert-title" id="alert-title"></div><div class="alert-score" id="alert-score"></div></div></div></div>
  <header class="app-header">
    <div class="brand"><div class="brand-mark">MN</div><div><div class="brand-title">Minnesota Sports Center</div><div class="brand-sub">Live dashboard</div></div></div>
    <div class="header-right"><div class="data-health" id="data-health"><i class="health-dot"></i><span id="health-text">Live data</span></div><div class="rotation-status">Featuring <strong id="featured-name">—</strong></div><div class="header-clock" id="header-clock">—</div></div>
  </header>
  <div class="dashboard" id="cards-container"></div>
  <div class="ticker-wrap"><div class="ticker-move" id="ticker-content"></div></div>

  <script>
    const workerUrl = "https://grumpys-scores-api.shootscore3.workers.dev/?url=";
    const CT_TZ = "America/Chicago";
    const DEMO_KIND = new URLSearchParams(location.search).get("demo") || "";
    const LIVE_DEMO = DEMO_KIND === "live";
    const FEATURE_DEMO = DEMO_KIND === "features";
    const DEMO_MODE = LIVE_DEMO || FEATURE_DEMO;
    const FEATURE_DURATION_MS = 45000;

    const HIDE_AFTER_DAYS = 3;
    const NFL_SHOW_WITHIN_DAYS = 7;

    const TEAMS = [
      { id:"30", sport:"hockey",     league:"nhl", name:"Wild",    color:"#154734" },
      { id:"9",  sport:"baseball",   league:"mlb", name:"Twins",   color:"#d31145" },
      { id:"16", sport:"football",   league:"nfl", name:"Vikings", color:"#4f2683" },
      { id:"16", sport:"basketball", league:"nba", name:"Wolves",  color:"#78be20" }
    ];

    // Wild / NHL
    const NHL_SEASON_CODE = "20252026";
    const NHL_WILD_CLUB_STATS_URL = `https://api-web.nhle.com/v1/club-stats/MIN/${NHL_SEASON_CODE}/2`;

    // Wolves stats
    const NBA_WOLVES_LEAGUE_DASH_URL =
      "https://stats.nba.com/stats/leaguedashplayerstats" +
      "?College=&Conference=&Country=&DateFrom=&DateTo=&Division=&DraftPick=&DraftYear=&GameScope=&GameSegment=" +
      "&Height=&LastNGames=0&LeagueID=00&Location=&MeasureType=Base&Month=0&OpponentTeamID=0&Outcome=&PORound=0" +
      "&PaceAdjust=N&PerMode=PerGame&Period=0&PlayerExperience=&PlayerPosition=&PlusMinus=N&Rank=N&Season=2025-26" +
      "&SeasonSegment=&SeasonType=Regular%20Season&ShotClockRange=&StarterBench=&TeamID=1610612750&TwoWay=0&VsConference=&VsDivision=&Weight=";

    const NBA_HEADSHOT = (playerId) =>
      `https://ak-static.cms.nba.com/wp-content/uploads/headshots/nba/latest/260x190/${playerId}.png`;

    // Twins (MLB)
    const MLB_TWINS_TEAM_ID = 142;
    const MLB_SEASON = new Date().getFullYear();
    let MLB_GAME_TYPE = "S";
    const MLB_HEADSHOT = (personId) =>
      `https://img.mlbstatic.com/mlb-photos/image/upload/w_180,q_auto:best/v1/people/${personId}/headshot/67/current`;

    const MLB_TEAM_LOGO = (teamId) =>
      `https://www.mlbstatic.com/team-logos/team-cap-on-light/${teamId}.svg`;

    let dataSuccesses = 0;
    let dataFailures = 0;
    let lastDataSuccess = null;

    function updateDataHealth(){
      const box = document.getElementById("data-health");
      const text = document.getElementById("health-text");
      if (!box || !text) return;
      const degraded = dataFailures > 0 && dataFailures >= Math.max(2,Math.ceil(dataSuccesses * .35));
      box.classList.toggle("degraded",degraded);
      text.textContent = degraded ? "Using cached data" : "Live data";
    }

    async function fetchJson(url){
      try{
        const r = await fetch(workerUrl + encodeURIComponent(url));
        const ct = (r.headers.get("content-type") || "").toLowerCase();
        if (!ct.includes("application/json") && !ct.includes("text/json")) { dataFailures++; updateDataHealth(); return null; }
        const json = await r.json();
        dataSuccesses++; lastDataSuccess = Date.now(); updateDataHealth();
        return json;
      }catch(e){
        dataFailures++; updateDataHealth();
        return null;
      }
    }

    async function fetchDirectJson(url){
      try{
        const r = await fetch(url);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const json = await r.json();
        dataSuccesses++; lastDataSuccess = Date.now(); updateDataHealth();
        return json;
      }catch(e){
        dataFailures++; updateDataHealth();
        return null;
      }
    }

    async function getTeamNews(team){
      const key = `news:${team.league}:${team.id}`;
      const cached = cacheGet(key);
      if (cached) return cached;
      const data = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/news?team=${team.id}&limit=4`);
      const articles = (data?.articles || []).slice(0,3).map(a => ({
        title: safeText(a?.headline || a?.title || "Team update"),
        source: safeText(a?.source || "ESPN"),
        published: a?.published || a?.lastModified || "",
        image: safeText(a?.images?.[0]?.url || a?.image?.url || a?.thumbnail || "")
      }));
      cacheSet(key, articles);
      return articles;
    }

    function broadcastNames(comp){
      const names = (comp?.broadcasts || []).flatMap(b => b?.names || []).filter(Boolean);
      return [...new Set(names)].slice(0,3);
    }

    function networkClass(name){
      const n = String(name || "").toLowerCase();
      if (n.includes("espn")) return "espn";
      if (n.includes("fox") || n.includes("fs1")) return "fox";
      if (n.includes("nbc") || n.includes("peacock")) return "nbc";
      if (n.includes("cbs")) return "cbs";
      if (n.includes("abc")) return "abc";
      return "";
    }

    function renderNetworkLogos(networks){
      if (!networks?.length) return `<span class="meta-pill">TV TBD</span>`;
      return `<div class="network-logos">${networks.map(n => `<span class="network-mark ${networkClass(n)}" title="${safeText(n)}">${safeText(n).replace(/ Network| Television/gi,"")}</span>`).join("")}</div>`;
    }

    function formatNewsTime(iso){
      if (!iso) return "Latest update";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "Latest update";
      return d.toLocaleDateString("en-US",{timeZone:CT_TZ,month:"short",day:"numeric"});
    }

    function renderHeadlines(news){
      if (!news?.length) return `<div class="headline"><div class="headline-title">No new team headlines right now.</div><div class="headline-meta">Check back on the next refresh</div></div>`;
      return news.map(n => `<div class="headline">${n.image ? `<img class="headline-thumb" src="${n.image}" alt="" loading="lazy">` : ``}<div class="headline-copy"><div class="headline-title">${n.title}</div><div class="headline-meta">${n.source} · ${formatNewsTime(n.published)}</div></div></div>`).join("");
    }

    function standingStat(entry, ...names){
      const wanted = names.map(n => String(n).toLowerCase());
      return (entry?.stats || []).find(s => wanted.includes(String(s?.name || s?.type || s?.abbreviation || "").toLowerCase()));
    }

    function standingsRecord(entry, league){
      const wins = standingStat(entry,"wins")?.displayValue ?? "0";
      const losses = standingStat(entry,"losses")?.displayValue ?? "0";
      const extra = league === "nhl" ? standingStat(entry,"otLosses") : standingStat(entry,"ties");
      return extra?.displayValue && extra.displayValue !== "0" ? `${wins}-${losses}-${extra.displayValue}` : `${wins}-${losses}`;
    }

    function standingsValue(entry, league){
      if (league === "nhl") return { label:"PTS", value:standingStat(entry,"points")?.displayValue || "0" };
      const pct = standingStat(entry,"winPercent","winPercentage","percentage")?.displayValue;
      const gb = standingStat(entry,"gamesBehind")?.displayValue;
      if ((league === "mlb" || league === "nba") && gb != null) return { label:"GB", value:gb === "0" || gb === "-" ? "—" : gb };
      return { label:"PCT", value:pct || "—" };
    }

    function findDivisionNode(root, teamId){
      const matches = [];
      const walk = node => {
        const entries = node?.standings?.entries || [];
        if (entries.some(e => String(e?.team?.id) === String(teamId))) matches.push(node);
        (node?.children || []).forEach(walk);
      };
      walk(root);
      return matches.find(n => /division/i.test(n?.name || "")) || matches[matches.length - 1] || null;
    }

    function ctDateKey(d){

    }

    function daysUntil(iso){
      if (!iso) return Infinity;
      return (new Date(iso).getTime() - Date.now()) / 86400000;
    }

    function countdownText(iso){
      if (!iso) return "";
      const start = new Date(iso).getTime();
      const now = Date.now();
      const diff = start - now;
      if (diff <= 0) return "";
      const totalMinutes = Math.floor(diff / 60000);
      const days = Math.floor(totalMinutes / (60 * 24));
      const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
      const mins = totalMinutes % 60;
      if (days >= 1) return `Starts in ${days}d ${hours}h`;
      if (hours >= 1) return `Starts in ${hours}h ${mins}m`;
      return `Starts in ${mins}m`;
    }

    function nextLabelAndTime(iso){
      if (!iso) return "TBD";
      const start = new Date(iso);

      const todayCT = new Date().toLocaleDateString('en-US', { timeZone: CT_TZ, year:'numeric', month:'2-digit', day:'2-digit' });
      const startCT = start.toLocaleDateString('en-US', { timeZone: CT_TZ, year:'numeric', month:'2-digit', day:'2-digit' });

      const [mm, dd, yyyy] = todayCT.split('/').map(x => parseInt(x, 10));
      const tomorrowDate = new Date(Date.UTC(yyyy, mm - 1, dd + 1, 12, 0, 0));
      const tomorrowCT = tomorrowDate.toLocaleDateString('en-US', { timeZone: CT_TZ, year:'numeric', month:'2-digit', day:'2-digit' });

      let label = "";
      if (startCT === todayCT) label = "TODAY";
      else if (startCT === tomorrowCT) label = "TOMORROW";
      else {
        const dow = start.toLocaleDateString('en-US', { timeZone: CT_TZ, weekday:'short' }).toUpperCase();
        const md = start.toLocaleDateString('en-US', { timeZone: CT_TZ, month:'numeric', day:'numeric' });
        label = `${dow} ${md}`;
      }

      const time = start.toLocaleTimeString('en-US', { timeZone: CT_TZ, hour:'numeric', minute:'2-digit' });
      return `${label} • ${time} CT`;
    }

    function chunkArray(arr, size){
      const out = [];
      for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
      return out;
    }

    function ordinalPeriod(n){
      const num = Number(n);
      if (!Number.isFinite(num) || num <= 0) return "";
      if (num === 1) return "1ST";
      if (num === 2) return "2ND";
      if (num === 3) return "3RD";
      return `${num}OT`;
    }

    function safeText(s){

    function normalizeAthlete(a){

    function athleteHeadshot(a){

    function normalizePlayerName(name){
      return String(name || "")
        .toLowerCase()
        .replace(/\./g, "")
        .replace(/'/g, "")
        .replace(/-/g, " ")
        .replace(/\s+/g, " ")
        .trim();

    function buildWildStatusLineFromCompetition(comp){
      const status = comp?.status || {};
      const state = status?.type?.state || "";
      const shortDetail = safeText(status?.type?.shortDetail);
      const detail = safeText(status?.type?.detail);
      const clock = safeText(status?.displayClock);
      const period = ordinalPeriod(status?.period);
      const combined = `${shortDetail} ${detail}`.toUpperCase();

      if (state === "post"){
        if (combined.includes("SO") || combined.includes("SHOOTOUT")) return "FINAL • SO";
        if (combined.includes("OT") || combined.includes("OVERTIME")) return "FINAL • OT";
        return "FINAL";
      }

      if (state === "in"){
        const bits = ["LIVE"];
        if (period) bits.push(period);
        if (clock && clock !== "0:00") bits.push(clock);
        return bits.join(" • ");
      }

      return shortDetail || detail || "";
    }

    function buildGenericStatusLineFromCompetition(comp){
      const status = comp?.status || {};
      const state = status?.type?.state || "";
      const shortDetail = safeText(status?.type?.shortDetail);
      const detail = safeText(status?.type?.detail);
      const combinedUpper = `${shortDetail} ${detail}`.toUpperCase();
      const display = shortDetail || detail;

      if (state === "post"){
        if (combinedUpper.includes("SO") || combinedUpper.includes("SHOOTOUT")) return "FINAL • SO";
        if (combinedUpper.includes("OT") || combinedUpper.includes("OVERTIME")) return "FINAL • OT";
        return "FINAL";
      }

      if (state === "in"){
        return display ? `LIVE • ${display.toUpperCase()}` : "LIVE";
      }

      return display;
    }

    function buildNhlHeadshotLookupFromClubStats(data){
      const lookup = new Map();

      const skaters = Array.isArray(data?.skaters) ? data.skaters : [];
      const goalies = Array.isArray(data?.goalies) ? data.goalies : [];
      const allPlayers = [...skaters, ...goalies];

      for (const p of allPlayers){
        const first = p?.firstName?.default || "";
        const last = p?.lastName?.default || "";
        const full = `${first} ${last}`.trim();
        const shot = p?.headshot || "";

        if (full && shot){
          lookup.set(normalizePlayerName(full), shot);
        }
      }

      return lookup;
    }

    function applyNhlHeadshotsToGoals(goals, wildLookup, oppLookup, wildLogo, oppLogo){
      return (goals || []).map(g => {
        const key = normalizePlayerName(g.scorer);
        const isWildGoal = !!g.teamLogo && !!wildLogo && g.teamLogo === wildLogo;
        const preferredLookup = isWildGoal ? wildLookup : oppLookup;
        const fallbackLookup = isWildGoal ? oppLookup : wildLookup;

        const betterHeadshot =
          preferredLookup?.get(key) ||
          fallbackLookup?.get(key) ||
          g.headshot ||
          "";

        return {
          ...g,
          headshot: betterHeadshot
        };
      });
    }

    function findScoringPlaysDeep(obj){
      if (!obj || typeof obj !== "object") return [];
      if (Array.isArray(obj?.scoringPlays)) return obj.scoringPlays;
      if (Array.isArray(obj?.plays)) {
        const goalLike = obj.plays.filter(p => {
          const txt = `${p?.text || ""} ${p?.type?.text || ""} ${p?.type?.displayName || ""}`.toLowerCase();
          return txt.includes("goal") || txt.includes("scores");
        });
        if (goalLike.length) return goalLike;
      }
      for (const key of Object.keys(obj)){
        const val = obj[key];
        if (val && typeof val === "object"){
          const found = findScoringPlaysDeep(val);
          if (found.length) return found;
        }
      }
      return [];
    }

    function parseWildScoringPlays(summary, fallbackWildLogo, fallbackOppLogo){
      const comp = summary?.header?.competitions?.[0] || summary?.boxscore?.game || summary?.gamepackageJSON?.header?.competitions?.[0] || null;
      const competitors = comp?.competitors || [];
      const wildComp = competitors.find(c => String(c?.team?.id) === "30");
      const oppComp = competitors.find(c => String(c?.team?.id) !== "30");

      const wildLogo = teamLogo(wildComp?.team) || fallbackWildLogo || "";
      const oppLogo = teamLogo(oppComp?.team) || fallbackOppLogo || "";

      const playsRaw = findScoringPlaysDeep(summary);
      const plays = [];

      for (const p of playsRaw){
        const text = safeText(p?.text || p?.shortText || p?.description);
        const lower = text.toLowerCase();

        if (
          lower.includes("shootout") ||
          lower.includes("goalie stopped") ||
          lower.includes("saved") ||
          lower.includes("save") ||
          lower.includes("missed") ||
          lower.includes("misses") ||
          lower.includes("penalty shot")
        ) {
          continue;
        }

        const isGoalLike = lower.includes("goal") || lower.includes("scores");
        if (!isGoalLike) continue;

        if (p?.scoreValue != null && Number(p.scoreValue) <= 0) continue;

        const athletes = Array.isArray(p?.athletesInvolved)
          ? p.athletesInvolved
          : (Array.isArray(p?.participants) ? p.participants : []);

        const scorerA = athletes.length ? normalizeAthlete(athletes[0]) : null;
        const assistsA = athletes.slice(1).map(normalizeAthlete).filter(Boolean);

        let scorer = athleteName(scorerA);
        const headshot = athleteHeadshot(scorerA);

        const playTeam = p?.team || p?.teamInfo || {};
        const playTeamId = String(playTeam?.id || p?.teamId || "");
        const playTeamLogo = teamLogo(playTeam) || (playTeamId === "30" ? wildLogo : oppLogo) || "";

        let assists = assistsA.map(athleteName).filter(Boolean);

        if (!assists.length){
          const assistMatch = text.match(/assists?:\s*(.*)$/i);
          if (assistMatch && assistMatch[1]){
            assists = assistMatch[1]
              .split(/[;,]/)
              .map(s => s.replace(/\(\d+\)/g, "").trim())
              .filter(Boolean);
          }
        }

        if (!scorer){
          let firstPart = text.split(",")[0].trim();
          firstPart = firstPart.replace(/\s+scores.*$/i, "").trim();
          firstPart = firstPart.replace(/\s+goal.*$/i, "").trim();
          scorer = firstPart || "Goal";
        }

        assists = assists
          .map(a => a.replace(/\s+scores.*$/i, "").trim())
          .filter(Boolean);

        plays.push({
          scorer,
          assists,
          teamLogo: playTeamLogo,
          headshot: headshot || "",
          sequence: Number(p?.sequenceNumber || p?.id || 0) || 0
        });
      }

      plays.sort((a,b) => a.sequence - b.sequence);
      return plays;
    }

    async function getWildLiveFinalPack(event, fallbackData){
      const isLive = event?.status?.type?.state === "in";
      const cacheKey = `wildLiveFinal:${event?.id}:${event?.status?.type?.state}:${fallbackData?.myScore}:${fallbackData?.oppScore}`;
      const cached = isLive ? null : cacheGet(cacheKey);
      if (cached) return cached;

      const summary = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/summary?event=${event?.id}`);
      const comp = summary?.header?.competitions?.[0] || event?.competitions?.[0] || {};
      const competitors = comp?.competitors || [];

      const eventComp = event?.competitions?.[0] || {};
      const eventCompetitors = eventComp?.competitors || [];

      const wildComp = competitors.find(c => String(c?.team?.id) === "30") || eventCompetitors.find(c => String(c?.team?.id) === "30");
      const oppComp  = competitors.find(c => String(c?.team?.id) !== "30") || eventCompetitors.find(c => String(c?.team?.id) !== "30");

      const wildHomeAway = wildComp?.homeAway || eventCompetitors.find(c => String(c?.team?.id) === "30")?.homeAway || "";
      const matchupSymbol = wildHomeAway === "away" ? "@" : "vs";

      const wildLogo = teamLogo(wildComp?.team) || fallbackData?.myLogo || "";
      const oppLogo = teamLogo(oppComp?.team) || fallbackData?.theirLogo || "";

      const wildScore = String(wildComp?.score ?? fallbackData?.myScore ?? "");
      const oppScore = String(oppComp?.score ?? fallbackData?.oppScore ?? "");

      const statusLine =
        buildWildStatusLineFromCompetition(comp) ||
        buildWildStatusLineFromCompetition(eventComp) ||
        statusLabel(event?.status?.type?.state);

      let goals = summary ? parseWildScoringPlays(summary, wildLogo, oppLogo) : [];

      const wildAbbr =
        wildComp?.team?.abbreviation ||
        wildComp?.team?.shortDisplayName ||
        "MIN";

      const oppAbbr =
        oppComp?.team?.abbreviation ||
        oppComp?.team?.shortDisplayName ||
        "";

      const [wildLookup, oppLookup] = await Promise.all([
        getNhlTeamHeadshotLookup(wildAbbr),
        getNhlTeamHeadshotLookup(oppAbbr)
      ]);

      goals = applyNhlHeadshotsToGoals(goals, wildLookup, oppLookup, wildLogo, oppLogo);

      const pack = {
        wildLogo,
        wildScore,
        oppLogo,
        oppScore,
        statusLine,
        goals,
        matchupSymbol,
        visual: buildLiveVisual(summary || {}, {myScore:wildScore,oppScore}, "nhl", "30")
      };

      if (!isLive) cacheSet(cacheKey, pack);
      return pack;
    }

    // ---------- Generic ESPN boxscore helpers for Wolves/Twins ----------
    function normalizeLabel(label){
      return String(label || "")
        .toUpperCase()
        .replace(/[^A-Z0-9%]/g, "");
    }

    function firstExisting(obj, keys){
      for (const k of keys){
        if (obj[k] != null && obj[k] !== "") return obj[k];
      }
      return null;
    }

    function buildStatMap(labels, stats){
      const map = {};
      (labels || []).forEach((label, i) => {
        map[normalizeLabel(label)] = stats?.[i];
      });
      return map;
    }

    function parseEspnStatNumber(v){
      if (v == null) return null;
      const s = String(v).trim();
      if (!s || s === "-" || s === "--") return null;
      const n = Number(s);
      return Number.isFinite(n) ? n : null;
    }

    function baseballIpToNumber(v){
      if (v == null) return null;
      const s = String(v).trim();
      if (!s || s === "-" || s === "--") return null;
      if (!s.includes(".")) {
        const n = Number(s);
        return Number.isFinite(n) ? n : null;
      }
      const [wholeStr, fracStr] = s.split(".");
      const whole = Number(wholeStr);
      const frac = Number(fracStr);
      if (!Number.isFinite(whole) || !Number.isFinite(frac)) return null;
      if (frac === 1) return whole + 1/3;
      if (frac === 2) return whole + 2/3;
      return whole + (frac / 10);
    }

    function extractEspnTeamBox(summary, teamId){
      const players = Array.isArray(summary?.boxscore?.players) ? summary.boxscore.players : [];
      return players.find(p => String(p?.team?.id) === String(teamId)) || null;
    }

    function extractAthleteRowsFromTeamBox(teamBox){
      const rows = [];
      const seen = new Map();

      function visit(node, inheritedLabels = null){
        if (!node) return;

        if (Array.isArray(node)){
          node.forEach(item => visit(item, inheritedLabels));
          return;
        }

        if (typeof node !== "object") return;

        const currentLabels = Array.isArray(node?.labels) ? node.labels : inheritedLabels;

        if (node?.athlete && Array.isArray(node?.stats)){
          const id = String(node.athlete?.id || node.athlete?.$ref || node.athlete?.displayName || Math.random());
          const candidate = {
            athlete: node.athlete,
            labels: currentLabels || [],
            stats: node.stats || []
          };
          const prev = seen.get(id);
          if (!prev || (candidate.labels.length + candidate.stats.length) > (prev.labels.length + prev.stats.length)){
            seen.set(id, candidate);
          }
        }

        if (Array.isArray(node?.athletes)){
          node.athletes.forEach(a => visit(a, currentLabels));
        }

        Object.values(node).forEach(v => {
          if (v && typeof v === "object") visit(v, currentLabels);
        });
      }

      visit(teamBox, null);
      seen.forEach(v => rows.push(v));
      return rows;
    }

    function getCompTeamInfo(comp, teamId){
      const competitors = comp?.competitors || [];
      const me = competitors.find(c => String(c?.team?.id) === String(teamId));
      const opp = competitors.find(c => String(c?.team?.id) !== String(teamId));
      return { me, opp };
    }

    function buildLivePackBaseFromSummary(summary, event, teamId, fallbackData, statusBuilder){
      const comp = summary?.header?.competitions?.[0] || event?.competitions?.[0] || {};
      const { me, opp } = getCompTeamInfo(comp, teamId);

      const myHomeAway = me?.homeAway || "";
      const matchupSymbol = myHomeAway === "away" ? "@" : "vs";

      return {
        comp,
        me,
        opp,
        myLogo: teamLogo(me?.team) || fallbackData?.myLogo || "",
        oppLogo: teamLogo(opp?.team) || fallbackData?.theirLogo || "",
        myScore: String(me?.score ?? fallbackData?.myScore ?? ""),
        oppScore: String(opp?.score ?? fallbackData?.oppScore ?? ""),
        statusLine: statusBuilder(comp) || statusBuilder(event?.competitions?.[0] || {}) || statusLabel(event?.status?.type?.state),
        matchupSymbol
      };
    }

    function buildWolvesPlayersFromTeamBox(teamBox, teamLogoUrl){
      const rows = extractAthleteRowsFromTeamBox(teamBox);

      return rows.map(r => {
        const statMap = buildStatMap(r.labels, r.stats);
        const athlete = normalizeAthlete(r.athlete);

        const pts = parseEspnStatNumber(firstExisting(statMap, ["PTS"]));
        const reb = parseEspnStatNumber(firstExisting(statMap, ["REB"]));
        const ast = parseEspnStatNumber(firstExisting(statMap, ["AST"]));

        return {
          name: athleteName(athlete),
          headshot: athleteHeadshot(athlete),
          teamLogo: teamLogoUrl,
          pts: pts ?? 0,
          reb: reb ?? 0,
          ast: ast ?? 0
        };
      })
      .filter(p => p.name && (p.pts > 0 || p.reb > 0 || p.ast > 0))
      .sort((a,b) => {
        if (b.pts !== a.pts) return b.pts - a.pts;
        if (b.reb !== a.reb) return b.reb - a.reb;
        return b.ast - a.ast;
      })
      .slice(0, 3)
      .map(p => ({
        name: p.name,
        headshot: p.headshot,
        teamLogo: p.teamLogo,
        statLine: `PTS ${p.pts} • REB ${p.reb} • AST ${p.ast}`
      }));
    }

    function summaryTeamStats(summary, teamId){
      const teams = Array.isArray(summary?.boxscore?.teams) ? summary.boxscore.teams : [];
      const entry = teams.find(t => String(t?.team?.id) === String(teamId));
      return (entry?.statistics || []).map(s => ({
        key: safeText(s?.label || s?.abbreviation || s?.name).replace(/Percentage/gi,"%").slice(0,13),
        value: safeText(s?.displayValue ?? s?.value ?? "—")
      })).filter(s => s.key && s.value).slice(0,6);
    }

    function recentSummaryPlay(summary){
      const sources = [summary?.plays, summary?.scoringPlays, summary?.drives?.current?.plays];
      const plays = sources.find(Array.isArray) || [];
      const p = plays[plays.length - 1] || null;
      return {
        id: String(p?.id || p?.sequenceNumber || p?.sequence || ""),
        text: safeText(p?.text || p?.shortText || p?.description || p?.type?.text || "Live game in progress"),
        clock: safeText(p?.clock?.displayValue || p?.clock || ""),
        scoring: !!(p?.scoringPlay || p?.isScoringPlay || /touchdown|home run|homered|goal|three point|3-pt/i.test(`${p?.text || ""} ${p?.type?.text || ""}`)),
        athlete: normalizeAthlete(p?.athletesInvolved?.[0] || p?.participants?.[0]?.athlete || p?.athlete),
        type: safeText(p?.type?.text || p?.type?.displayName || "SCORE")
      };
    }

    function playTeamId(play){
      return String(play?.team?.id || play?.teamId || play?.participants?.[0]?.team?.id || "");
    }

    function playScoreState(play, myHomeAway){
      const home = toNum(play?.homeScore ?? play?.score?.home);
      const away = toNum(play?.awayScore ?? play?.score?.away);
      if (home == null || away == null) return null;
      return myHomeAway === "home" ? {mine:home,theirs:away} : {mine:away,theirs:home};
    }

    function clockSeconds(play){
      const raw = safeText(play?.clock?.displayValue || play?.clock || "");
      const match = raw.match(/(\d+):(\d+)/);
      return match ? Number(match[1]) * 60 + Number(match[2]) : Infinity;
    }

    function timberwolvesRunPoints(plays, endIndex, teamId){
      let points = 0;
      for (let i=endIndex;i>=0;i--){
        const p = plays[i];
        if (!(p?.scoringPlay || p?.isScoringPlay)) continue;
        const value = Number(p?.scoreValue || p?.points || 0) || 0;
        const scorer = playTeamId(p);
        if (scorer && scorer !== String(teamId)) break;
        if (scorer === String(teamId)) points += value;
      }
      return points;
    }

    function scoringAlertFromSummary(summary, base, league, teamId){
      const plays = Array.isArray(summary?.plays) ? summary.plays : (Array.isArray(summary?.scoringPlays) ? summary.scoringPlays : []);
      const comp = summary?.header?.competitions?.[0] || {};
      const mine = (comp?.competitors || []).find(c => String(c?.team?.id) === String(teamId));
      const myHomeAway = mine?.homeAway || base?.me?.homeAway || "home";

      let p = null;
      for (let i=plays.length-1;i>=0;i--){
        const candidate = plays[i];
        const text = `${candidate?.text || ""} ${candidate?.shortText || ""} ${candidate?.type?.text || ""}`;
        const scoring = !!(candidate?.scoringPlay || candidate?.isScoringPlay || /touchdown|home run|homered|goal|three point|3-pt/i.test(text));
        if (!scoring || playTeamId(candidate) !== String(teamId)) continue;

        const score = playScoreState(candidate,myHomeAway);
        const value = Number(candidate?.scoreValue || candidate?.points || (league === "nfl" && /field goal/i.test(text) ? 3 : 0)) || 0;
        const beforeMine = score ? score.mine - value : null;
        const nowLeads = score ? score.mine > score.theirs : false;
        const nowTied = score ? score.mine === score.theirs : false;
        const tookLead = score ? nowLeads && beforeMine <= score.theirs : false;

        let qualifies = false;
        if (league === "nhl") qualifies = /goal|scores/i.test(text);
        if (league === "nfl") qualifies = /touchdown/i.test(text) || (/field goal/i.test(text) && tookLead);
        if (league === "mlb") qualifies = /home run|homered|grand slam/i.test(text) || tookLead || nowTied || value >= 2;
        if (league === "nba") {
          const period = Number(candidate?.period?.number || candidate?.period || comp?.status?.period || 0);
          const finalTwo = period >= 4 && clockSeconds(candidate) <= 120;
          const three = value === 3 || /three point|3-pt/i.test(text);
          const runPoints = timberwolvesRunPoints(plays,i,teamId);
          const notableRun = runPoints >= 6 && (runPoints - value) < 6;
          qualifies = notableRun || (finalTwo && three) || (finalTwo && tookLead);
        }
        if (qualifies){ p = candidate; break; }
      }
      if (!p) return null;
      const athlete = normalizeAthlete(p?.athletesInvolved?.[0] || p?.participants?.[0]?.athlete || p?.athlete);
      const label = league === "mlb" ? "SCORING PLAY" : league === "nfl" ? "SCORING DRIVE" : league === "nhl" ? "GOAL" : "BUCKET";
      return {
        id:String(p?.id || p?.sequenceNumber || p?.sequence || safeText(p?.text)),
        label,
        text:safeText(p?.text || p?.shortText || p?.description || p?.type?.text || label),
        headshot:athleteHeadshot(athlete),
        score:`${base?.myScore || ""} – ${base?.oppScore || ""}`
      };
    }

    function buildLiveVisual(summary, base, league, teamId){
      const comp = summary?.header?.competitions?.[0] || {};
      const situation = comp?.situation || summary?.situation || {};
      const last = recentSummaryPlay(summary || {});
      const stats = summaryTeamStats(summary || {}, teamId);
      const yardRaw = Number(situation?.yardLine ?? situation?.possessionText?.match?.(/\d+/)?.[0] ?? 50);
      const ballPosition = Number.isFinite(yardRaw) ? Math.max(10,Math.min(90,yardRaw)) : 50;
      return {
        league,
        lastPlay:last.text,
        clock:last.clock || safeText(comp?.status?.displayClock || ""),
        stats,
        alert:scoringAlertFromSummary(summary || {},base,league,teamId),
        baseball:{
          balls:Number(situation?.balls ?? 0), strikes:Number(situation?.strikes ?? 0), outs:Number(situation?.outs ?? 0),
          first:!!(situation?.onFirst || situation?.firstBase || situation?.runnersOnFirst),
          second:!!(situation?.onSecond || situation?.secondBase || situation?.runnersOnSecond),
          third:!!(situation?.onThird || situation?.thirdBase || situation?.runnersOnThird),
          batter:safeText(situation?.batter?.displayName || situation?.currentBatter?.displayName || ""),
          pitcher:safeText(situation?.pitcher?.displayName || situation?.currentPitcher?.displayName || "")
        },
        football:{
          downDistance:safeText(situation?.downDistanceText || situation?.shortDownDistanceText || comp?.status?.type?.detail || ""),
          ballPosition,
          possession:safeText(situation?.possessionText || situation?.possession || "")
        },
        hockey:{
          period:safeText(comp?.status?.type?.shortDetail || comp?.status?.type?.detail || "LIVE"),
          puckX:25 + ((Number(last.id.replace(/\D/g,"").slice(-2)) || 50) % 51),
          puckY:25 + ((Number(last.id.replace(/\D/g,"").slice(-3)) || 35) % 51)
        }
      };
    }

    async function getWolvesLiveFinalPack(event, fallbackData){
      const isLive = event?.status?.type?.state === "in";

    function buildTwinsHitterRowsFromTeamBox(teamBox, teamLogoUrl){
      const rows = extractAthleteRowsFromTeamBox(teamBox);

      return rows.map(r => {
        const statMap = buildStatMap(r.labels, r.stats);
        const athlete = normalizeAthlete(r.athlete);
        const id = athleteId(athlete);
        const betterHeadshot = id ? MLB_HEADSHOT(id) : (athleteHeadshot(athlete) || "");

        return {
          name: athleteName(athlete),
          headshot: betterHeadshot,
          teamLogo: teamLogoUrl,
          r: parseEspnStatNumber(firstExisting(statMap, ["R"])) ?? 0,
          h: parseEspnStatNumber(firstExisting(statMap, ["H"])) ?? 0,
          rbi: parseEspnStatNumber(firstExisting(statMap, ["RBI"])) ?? 0,
          hr: parseEspnStatNumber(firstExisting(statMap, ["HR"])) ?? 0,
          ip: firstExisting(statMap, ["IP"]),
          so: firstExisting(statMap, ["SO"]),
          er: firstExisting(statMap, ["ER"])
        };
      })
      .filter(p => p.name && p.ip == null && (p.h > 0 || p.rbi > 0 || p.r > 0 || p.hr > 0))
      .sort((a,b) => {
        if (b.rbi !== a.rbi) return b.rbi - a.rbi;
        if (b.h !== a.h) return b.h - a.h;
        if (b.r !== a.r) return b.r - a.r;
        return b.hr - a.hr;
      })
      .slice(0, 2)
      .map(p => ({
        name: p.name,
        headshot: p.headshot,
        teamLogo: p.teamLogo,

      }));

    function buildTwinsPitcherRowFromTeamBox(teamBox, teamLogoUrl){
      const rows = extractAthleteRowsFromTeamBox(teamBox);

      const pitchers = rows.map(r => {
        const statMap = buildStatMap(r.labels, r.stats);
        const athlete = normalizeAthlete(r.athlete);
        const id = athleteId(athlete);
        const betterHeadshot = id ? MLB_HEADSHOT(id) : (athleteHeadshot(athlete) || "");

        const ipRaw = firstExisting(statMap, ["IP"]);
        const ipValue = baseballIpToNumber(ipRaw);
        const so = parseEspnStatNumber(firstExisting(statMap, ["SO"])) ?? 0;
        const er = parseEspnStatNumber(firstExisting(statMap, ["ER"])) ?? 0;

        return {
          name: athleteName(athlete),
          headshot: betterHeadshot,
          teamLogo: teamLogoUrl,
          ipRaw: ipRaw || null,
          ipValue,
          so,
          er
        };
      })
      .filter(p => p.name && p.ipRaw != null)
      .sort((a,b) => {
        if ((b.ipValue ?? -1) !== (a.ipValue ?? -1)) return (b.ipValue ?? -1) - (a.ipValue ?? -1);
        if (b.so !== a.so) return b.so - a.so;
        return a.er - b.er;
      });

      if (!pitchers.length) return null;

      const p = pitchers[0];
      return {
        name: p.name,
        headshot: p.headshot,
        teamLogo: p.teamLogo,
        statLine: `IP ${p.ipRaw} • SO ${p.so} • ER ${p.er}`
      };
    }

    async function getWildPack(){

    // ---------------- Wolves off-day pack ----------------
    function parseNbaResultSet(data){
      const rs = data?.resultSets?.[0] || data?.resultSet;
      if (!rs) return null;
      const headers = rs.headers;
      const rows = rs.rowSet;
      if (!Array.isArray(headers) || !Array.isArray(rows)) return null;

      const idx = (h) => headers.indexOf(h);
      const iId = idx("PLAYER_ID");
      const iName = idx("PLAYER_NAME");
      const iPTS = idx("PTS");
      const iREB = idx("REB");
      const iAST = idx("AST");
      if ([iId,iName,iPTS,iREB,iAST].some(v => v < 0)) return null;

      return rows.map(r => ({
        id: r[iId],
        name: r[iName],
        pts: Number(r[iPTS]) || 0,
        reb: Number(r[iREB]) || 0,
        ast: Number(r[iAST]) || 0
      }));
    }

    function topBy(players, field){
      let best = null;
      for (const p of players) if (!best || p[field] > best[field]) best = p;
      return best;
    }

      const topPts = [...players].sort((a,b)=>b.pts-a.pts).slice(0,3);
      const rebL = topBy(players, "reb");
      const astL = topBy(players, "ast");

      const pack = { topPts, rebL, astL };
      cacheSet("wolvesPack", pack);
      return pack;

    // ---------------- Twins off-day pack ----------------
    function fmtAvg(v){
      const n = toNum(v);
      if (n == null) return "—";
      if (n > 0 && n < 1) return n.toFixed(3).replace(/^0/, "");
      return n.toFixed(3);
    }
    function fmtEra(v){
      const n = toNum(v);
      if (n == null) return "—";
      return n.toFixed(2);
    }
    function mlbName(s){ return s?.player?.fullName || s?.player?.name || "—"; }
    function mlbId(s){ return s?.player?.id || null; }

    function topOne(splits, getter, dir="desc"){
      const mult = dir === "asc" ? 1 : -1;
      return [...splits]
        .map(x => ({ x, v: toNum(getter(x)) }))
        .filter(o => o.v != null)
        .sort((a,b) => (a.v - b.v) * mult)
        [0]?.x || null;
    }

    async function detectMlbGameType(){
      const today = new Date().toISOString().slice(0,10);
      const scheduleUrl =
        `https://statsapi.mlb.com/api/v1/schedule` +
        `?sportId=1&teamId=${MLB_TWINS_TEAM_ID}&season=${MLB_SEASON}&gameType=R` +
        `&startDate=${MLB_SEASON}-01-01&endDate=${today}`;

      const sched = await fetchJson(scheduleUrl);
      const dates = sched?.dates || [];
      const hasRegularGameAlready = dates.some(d => (d?.games || []).length > 0);

      MLB_GAME_TYPE = hasRegularGameAlready ? "R" : "S";
    }

    async function mlbTeamStats(group){
      const url =
        `https://statsapi.mlb.com/api/v1/stats` +
        `?stats=season` +
        `&group=${encodeURIComponent(group)}` +
        `&season=${encodeURIComponent(MLB_SEASON)}` +
        `&gameType=${encodeURIComponent(MLB_GAME_TYPE)}` +
        `&sportId=1` +
        `&teamId=${encodeURIComponent(MLB_TWINS_TEAM_ID)}` +
        `&playerPool=ALL`;

      const data = await fetchJson(url);
      const splits = data?.stats?.[0]?.splits;
      return Array.isArray(splits) ? splits : [];
    }

    async function getTwinsPack(){
      const cached = cacheGet("twinsPack");
      if (cached) return cached;

      await detectMlbGameType();

      let hitters = await mlbTeamStats("hitting");
      let pitchers = await mlbTeamStats("pitching");

      if ((!hitters.length && !pitchers.length) && MLB_GAME_TYPE === "R") {
        MLB_GAME_TYPE = "S";
        hitters = await mlbTeamStats("hitting");
        pitchers = await mlbTeamStats("pitching");
      }

      if (!hitters.length && !pitchers.length) return null;

      const avgTop = topOne(hitters, s => s?.stat?.avg, "desc");
      const hrTop  = topOne(hitters, s => s?.stat?.homeRuns, "desc");
      const rbiTop = topOne(hitters, s => s?.stat?.rbi, "desc");

      const eraTop = topOne(pitchers, s => s?.stat?.era, "asc");
      const soTop  = topOne(pitchers, s => s?.stat?.strikeOuts, "desc");
      const winTop = topOne(pitchers, s => s?.stat?.wins, "desc");
      const wlText = winTop ? `${winTop?.stat?.wins ?? 0}-${winTop?.stat?.losses ?? 0}` : "—";

      const pack = { avgTop, hrTop, rbiTop, eraTop, soTop, winTop, wlText };
      cacheSet("twinsPack", pack);
      return pack;
    }

    function buildTwinsSlides(pack){
      if (!pack) return [];

      const slideHitters = [
        { key:"AVG", name: mlbName(pack.avgTop), stat: fmtAvg(pack.avgTop?.stat?.avg), headshot: mlbId(pack.avgTop) ? MLB_HEADSHOT(mlbId(pack.avgTop)) : "" },
        { key:"HR",  name: mlbName(pack.hrTop),  stat: String(pack.hrTop?.stat?.homeRuns ?? "—"), headshot: mlbId(pack.hrTop) ? MLB_HEADSHOT(mlbId(pack.hrTop)) : "" },
        { key:"RBI", name: mlbName(pack.rbiTop), stat: String(pack.rbiTop?.stat?.rbi ?? "—"), headshot: mlbId(pack.rbiTop) ? MLB_HEADSHOT(mlbId(pack.rbiTop)) : "" },
      ];

      const slidePitchers = [
        { key:"ERA", name: mlbName(pack.eraTop), stat: fmtEra(pack.eraTop?.stat?.era), headshot: mlbId(pack.eraTop) ? MLB_HEADSHOT(mlbId(pack.eraTop)) : "" },
        { key:"SO",  name: mlbName(pack.soTop),  stat: String(pack.soTop?.stat?.strikeOuts ?? "—"), headshot: mlbId(pack.soTop) ? MLB_HEADSHOT(mlbId(pack.soTop)) : "" },
        { key:"W-L", name: mlbName(pack.winTop), stat: pack.wlText || "—", headshot: mlbId(pack.winTop) ? MLB_HEADSHOT(mlbId(pack.winTop)) : "" },
      ];

      return [slideHitters, slidePitchers];
    }

    async function getTwinsNextGame(){
      const cacheKey = `twinsNext:${MLB_SEASON}`;
      const cached = cacheGet(cacheKey);
      if (cached) return cached;

      const now = Date.now();
      const today = new Date().toISOString().slice(0,10);
      const endDateObj = new Date(Date.now() + 14*86400000);
      const endDate = endDateObj.toISOString().slice(0,10);

      const checkRegUrl =
        `https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=${MLB_TWINS_TEAM_ID}&season=${MLB_SEASON}` +
        `&gameType=R&startDate=${MLB_SEASON}-01-01&endDate=${today}`;

      const regCheck = await fetchJson(checkRegUrl);
      const regStarted = (regCheck?.dates || []).some(d => (d?.games || []).length > 0);

      const gameType = regStarted ? "R" : "S";

      const schedUrl =
        `https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=${MLB_TWINS_TEAM_ID}&season=${MLB_SEASON}` +
        `&gameType=${gameType}&startDate=${today}&endDate=${endDate}`;

      const sched = await fetchJson(schedUrl);
      const dates = sched?.dates || [];

      let best = null;

      for (const d of dates){
        for (const g of (d?.games || [])){
          const iso = g?.gameDate;
          const t = iso ? new Date(iso).getTime() : 0;
          if (!t || t <= now) continue;

          const teams = g?.teams || {};
          const homeTeam = teams?.home?.team;
          const awayTeam = teams?.away?.team;

          const isAway = String(awayTeam?.id) === String(MLB_TWINS_TEAM_ID);
          const oppTeam = isAway ? homeTeam : awayTeam;

          best = {
            nextIso: iso,
            nextAtOrVs: isAway ? "@" : "vs",
            nextOpponent: oppTeam?.abbreviation || oppTeam?.name || "TBD",
            nextOppLogo: oppTeam?.id ? MLB_TEAM_LOGO(oppTeam.id) : ""
          };
          break;
        }
        if (best) break;
      }

      cacheSet(cacheKey, best);
      return best;
    }

    // ---------------- ESPN event picker + opponent ----------------
    function pickBestEventForTeam(scoreboard, teamId){
      const events = (scoreboard?.events || []).filter(e =>
        e?.competitions?.[0]?.competitors?.some(c => String(c?.team?.id) === String(teamId))
      );
      if (!events.length) return null;

      const now = Date.now();
      const todayCT = ctDateKey(new Date());

      const live = events.filter(e => e?.status?.type?.state === "in");
      const preToday = events
        .filter(e => e?.status?.type?.state === "pre" && ctDateKey(e?.date) === todayCT)
        .sort((a,b) => new Date(a.date) - new Date(b.date));
      const postToday = events
        .filter(e => e?.status?.type?.state === "post" && ctDateKey(e?.date) === todayCT)
        .sort((a,b) => new Date(b.date) - new Date(a.date));
      const preFuture = events
        .filter(e => e?.status?.type?.state === "pre" && ctDateKey(e?.date) !== todayCT)
        .sort((a,b) => new Date(a.date) - new Date(b.date));

      if (live.length) return live[0];
      const nextPreToday = preToday.find(e => new Date(e.date).getTime() >= now) || preToday[0];
      if (nextPreToday) return nextPreToday;
      if (postToday.length) return postToday[0];
      if (preFuture.length) return preFuture[0];
      return events[0];
    }

    async function standingsText(teamDetails){
      const summary = teamDetails?.team?.standingSummary || teamDetails?.team?.standingsSummary || "";
      return summary ? String(summary) : "";
    }

    async function getOpponentFromEventSummary(team, eventId, myTeamId){
      if (!eventId) return null;
      const event = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/summary?event=${eventId}`);
      const comp = event?.header?.competitions?.[0];
      const competitors = comp?.competitors;
      if (!competitors || competitors.length < 2) return null;

      const me  = competitors.find(c => String(c?.team?.id) === String(myTeamId));
      const opp = competitors.find(c => String(c?.team?.id) !== String(myTeamId));
      if (!opp) return null;

      return {
        oppName: teamName(opp?.team),
        oppLogo: teamLogo(opp?.team),
        atOrVs: (me?.homeAway === "away") ? "@" : "vs"
      };
    }

    async function getTeamData(team){
      const [scoreboard, teamDetails, news, division, upcomingGames] = await Promise.all([
        fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/scoreboard`),
        fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.league}/teams/${team.id}`),
        getTeamNews(team),
        getDivisionStandings(team),
        getTeamSchedule(team)
      ]);
      const event = pickBestEventForTeam(scoreboard, team.id);

      const record = teamDetails?.team?.record?.items?.[0]?.summary || "0-0";
      const logo = teamDetails?.team?.logo || `https://a.espncdn.com/i/teamlogos/${team.league}/500/${team.id}.png`;
      const standings = await standingsText(teamDetails);

      let nextIso = null, nextAtOrVs = "vs", nextOppLogo = "", nextOpponent = "TBD";
      if (event){
        const comp = event.competitions[0];
        const me = comp.competitors.find(c => String(c?.team?.id) === String(team.id));
        const opp = comp.competitors.find(c => String(c?.team?.id) !== String(team.id));
        nextIso = event.date || null;
        nextAtOrVs = (me?.homeAway === "away") ? "@" : "vs";
        nextOppLogo = teamLogo(opp?.team);
        nextOpponent = teamName(opp?.team);
      } else {
        const next = teamDetails?.team?.nextEvent?.[0];
        nextIso = next?.date || null;
        const oppInfo = await getOpponentFromEventSummary(team, next?.id, team.id);
        nextAtOrVs = oppInfo?.atOrVs || "vs";
        nextOppLogo = oppInfo?.oppLogo || "";
        nextOpponent = oppInfo?.oppName || "TBD";
      }

      if (team.league === "mlb") {
        const twNext = await getTwinsNextGame();
        if (twNext?.nextIso) {
          nextIso = twNext.nextIso;
          nextAtOrVs = twNext.nextAtOrVs || nextAtOrVs;
          nextOppLogo = twNext.nextOppLogo || nextOppLogo;
          nextOpponent = twNext.nextOpponent || nextOpponent;
        }
      }

      const nextCountdown = nextIso ? countdownText(nextIso) : "";
      const nextTimeText = nextIso ? nextLabelAndTime(nextIso) : "TBD";
      const daysUntilNext = daysUntil(nextIso);

      const state = event?.status?.type?.state || "none";
      const eventComp = event?.competitions?.[0] || null;
      const networks = broadcastNames(eventComp);
      const venue = safeText(eventComp?.venue?.fullName || eventComp?.venue?.address?.city || "");
      const weatherTemp = eventComp?.weather?.temperature;
      const weatherCondition = safeText(eventComp?.weather?.displayValue || eventComp?.weather?.conditionId || "");
      const weather = [weatherTemp != null ? `${weatherTemp}°F` : "",weatherCondition].filter(Boolean).join(" · ");
      const odds = safeText(eventComp?.odds?.[0]?.details || eventComp?.odds?.[0]?.overUnder ? `${eventComp?.odds?.[0]?.details || "Line"} · O/U ${eventComp?.odds?.[0]?.overUnder || "—"}` : "");
      const minutesToStart = nextIso ? (new Date(nextIso).getTime() - Date.now()) / 60000 : Infinity;
      const pregameMode = state === "pre" && minutesToStart >= 0 && minutesToStart <= 60;

      const showPanel = state !== "in";
      let pack = null;
      if (showPanel){
        if (team.league === "nhl") pack = await getWildPack();
        if (team.league === "nba") pack = await getWolvesPack();
        if (team.league === "mlb") pack = await getTwinsPack();
        if (team.league === "nfl") pack = await getVikingsPack();
      }

      let myScore="", oppScore="", myLogo="", theirLogo="";
      if (event){
        const comp = event.competitions[0];
        const me = comp.competitors.find(c => String(c?.team?.id) === String(team.id));
        const opp = comp.competitors.find(c => String(c?.team?.id) !== String(team.id));
        myScore = me?.score ?? "";
        oppScore = opp?.score ?? "";
        myLogo = teamLogo(me?.team) || logo;
        theirLogo = teamLogo(opp?.team) || "";
      }

      let wildLiveFinalPack = null;
      let wolvesLiveFinalPack = null;
      let twinsLiveFinalPack = null;
      let vikingsLiveFinalPack = null;

      if (team.league === "nhl" && team.id === "30" && event && (state === "in" || state === "post")) {
        wildLiveFinalPack = await getWildLiveFinalPack(event, { myScore, oppScore, myLogo, theirLogo });
      }

      if (team.league === "nba" && team.id === "16" && event && (state === "in" || state === "post")) {
        wolvesLiveFinalPack = await getWolvesLiveFinalPack(event, { myScore, oppScore, myLogo, theirLogo });
      }

      if (team.league === "mlb" && team.id === "9" && event && (state === "in" || state === "post")) {
        twinsLiveFinalPack = await getTwinsLiveFinalPack(event, { myScore, oppScore, myLogo, theirLogo });
      }

      if (team.league === "nfl" && team.id === "16" && event && (state === "in" || state === "post")) {
        vikingsLiveFinalPack = await getVikingsLiveFinalPack(event, { myScore, oppScore, myLogo, theirLogo });
      }

      return {
        league: team.league,
        name: team.name,
        color: team.color,
        status: state,
        logo, record, standings,
        news, division, teamId:team.id, upcomingGames, networks, venue, weather, odds, pregameMode,
        nextIso, daysUntilNext, nextAtOrVs, nextOppLogo, nextOpponent, nextCountdown, nextTimeText,
        showPanel, pack,
        myScore, oppScore, myLogo, theirLogo,
        wildLiveFinalPack,
        wolvesLiveFinalPack,
        twinsLiveFinalPack,
        vikingsLiveFinalPack
      };
    }

        context = [b.batter ? `BATTER ${b.batter}` : "",b.pitcher ? `PITCHER ${b.pitcher}` : ""].filter(Boolean).join(" · ") || context;
      } else if (visual.league === "nfl") {

        arena = `<div class="football-field"><div class="yard-numbers"><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>40</span><span>30</span><span>20</span><span>10</span></div><div class="ball-marker" style="--ball-pos:${f.ballPosition || 50}%"></div></div>`;
        context = f.downDistance || context;
      } else if (visual.league === "nhl") {
        const h = visual.hockey || {};
        arena = `<div class="hockey-rink"><i class="rink-circle a"></i><i class="rink-circle b"></i><i class="rink-circle c"></i><i class="rink-circle d"></i><i class="rink-puck" style="--puck-x:${h.puckX || 50}%;--puck-y:${h.puckY || 50}%"></i></div>`;

    function startBottomCarousels(){

        slides.forEach((slide,i) => slide.classList.toggle("active",i === 0));
        dots.forEach((dot,i) => dot.classList.toggle("active",i === 0));
      });
    }

    function syncFeaturedInfoCarousel(activeCard){
      document.querySelectorAll("[data-bottom-carousel]").forEach(box => {
        clearTimeout(box._rotationTimer);
        const slides = [...box.querySelectorAll(".slide")];
        const dots = [...box.querySelectorAll(".dot")];
        if (!activeCard?.contains(box) || slides.length <= 1) {
          slides.forEach((slide,i) => slide.classList.toggle("active",i === 0));
          dots.forEach((dot,i) => dot.classList.toggle("active",i === 0));
          return;
        }
        const elapsed = Math.min(Math.max(0,Date.now() - featureStartedAt),FEATURE_DURATION_MS - 1);
        const equalShare = featureDurationForCard(activeCard) / slides.length;
        let idx = Math.min(slides.length - 1,Math.floor(elapsed / equalShare));
        slides.forEach((slide,i) => slide.classList.toggle("active",i === idx));
        dots.forEach((dot,i) => dot.classList.toggle("active",i === idx));
        const advance = () => {
          slides[idx].classList.remove("active");
          dots[idx]?.classList.remove("active");
          idx = (idx + 1) % slides.length;
          slides[idx].classList.add("active");
          dots[idx]?.classList.add("active");
          box._rotationTimer = setTimeout(advance,equalShare);
        };
        box._rotationTimer = setTimeout(advance,equalShare - (elapsed % equalShare));
      });
    }

      document.querySelectorAll("[data-wild-goal-carousel]").forEach(box => {

    function applyFeaturedCard(){
      const cards = [...document.querySelectorAll("#cards-container .card")];
      if (!cards.length) return;
      if (featureStartedAt == null) featureStartedAt = Date.now();
      featuredIndex = ((featuredIndex % cards.length) + cards.length) % cards.length;
      const elapsed = Math.min(Math.max(0,Date.now() - featureStartedAt),FEATURE_DURATION_MS - 1);
      cards.forEach((card, i) => {
        card.classList.toggle("is-featured", i === featuredIndex);
        card.classList.toggle("is-compact", i !== featuredIndex);
        card.classList.toggle("has-compact-score", i !== featuredIndex && !!card.querySelector(".compact-score"));

    async function updateTicker(){
      const leagues = [
        { l:"nhl", s:"hockey" },
        { l:"nba", s:"basketball" },
        { l:"mlb", s:"baseball" }
      ];

      const ticker = document.getElementById("ticker-content");
      let allItems = [];

      const stateRank = (state) => (state === "in" ? 0 : state === "pre" ? 1 : state === "post" ? 2 : 3);

      for (const league of leagues){
        const data = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/${league.s}/${league.l}/scoreboard`);
        const todayCT = ctDateKey(new Date());
        const events = (data?.events || []).filter(game => {
          if (!game?.date) return false;
          return ctDateKey(new Date(game.date)) === todayCT;
        }).sort((a,b) => {
          const ra = stateRank(a?.status?.type?.state);
          const rb = stateRank(b?.status?.type?.state);
          if (ra !== rb) return ra - rb;
          return new Date(a?.date || 0).getTime() - new Date(b?.date || 0).getTime();
        });

        events.forEach(game => {
          const comp = game.competitions[0];
          const away = comp.competitors[1], home = comp.competitors[0];
          const state = game.status.type.state;

          const awayScoreText = (state === "pre") ? "" : (away.score ?? "");
          const homeScoreText = (state === "pre") ? "" : (home.score ?? "");

          const detail = (state === "pre" && game.date)
            ? (() => {
                const d = new Date(game.date);
                const md = d.toLocaleDateString('en-US', { timeZone: CT_TZ, month:'numeric', day:'numeric' });
                const t  = d.toLocaleTimeString('en-US', { timeZone: CT_TZ, hour:'numeric', minute:'2-digit' });
                return `${md} - ${t} CT`;
              })()
            : game.status.type.shortDetail;

          allItems.push(`
            <div class="ticker-item">
              <div class="league-badge">${league.l.toUpperCase()}</div>
              <div class="ticker-logo-container"><img class="ticker-team-logo" src="${away.team.logo}" alt=""></div>
              <span>${away.team.abbreviation}${awayScoreText !== "" ? ` ${awayScoreText}` : ""}</span>
              <span style="color:#222; margin:0 15px;">@</span>
              <div class="ticker-logo-container"><img class="ticker-team-logo" src="${home.team.logo}" alt=""></div>
              <span>${home.team.abbreviation}${homeScoreText !== "" ? ` ${homeScoreText}` : ""}</span>
              <span style="margin-left:30px; color:${state === "in" ? "var(--live)" : (state === "post" ? "var(--final-gold)" : "#888")}">${detail}</span>
            </div>
          `);
        });
      }

      if (!allItems.length) {
        ticker.innerHTML = `<div class="ticker-item"><span class="league-badge">TODAY</span><span>No games scheduled today</span></div>`;
        ticker.style.animation = "none";
        return;
      }

      ticker.innerHTML = [...allItems, ...allItems].join("");
      const mover = document.querySelector(".ticker-move");
      mover.style.animation = "";
      const seconds = Math.max(120, allItems.length * 7);
      mover.style.animationDuration = `${seconds}s`;
    }

    let dashboardRefreshTimer = null;
    async function refreshDashboardLoop(){
      let hasLiveGame = false;
      try { hasLiveGame = await updateDashboard(); } catch (err) { console.error("Dashboard refresh failed",err); }
      clearTimeout(dashboardRefreshTimer);
      dashboardRefreshTimer = setTimeout(refreshDashboardLoop,hasLiveGame ? 15000 : 60000);
    }

    refreshDashboardLoop();
    updateTicker();
    updateHeaderClock();
    setInterval(updateHeaderClock, 30000);
    setInterval(updateTicker, 300000);
  </script>
</body>
